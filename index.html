<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SisMotionTooL</title>
<style>
:root {
  --bg: #1c1d20; --panel: #25272b; --panel2: #2f3136; --line: #3a3d44; --text: #d9dbe0; --dim: #8a8f99;
  --accent: #4ea1ff; --key: #e2b340; --sel: #ff8a3d; --red: #e0605a; --green: #5fbf6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 12px/1.4 system-ui, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; user-select: none; }
#app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 240px 1fr auto; height: 100vh; }
#toolbar { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; padding: 4px 6px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#view canvas { display: block; width: 100%; height: 100%; outline: none; }
#timeline { grid-column: 1 / -1; background: var(--panel); border-top: 1px solid var(--line); }
button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 3px; padding: 2px 7px; height: 23px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: #5a5f69; }
button.on { background: #2b4666; border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
input[type=number] { width: 52px; padding: 2px 4px; }
input[type=checkbox] { height: auto; vertical-align: middle; margin: 0 3px 0 0; }
label { display: inline-flex; align-items: center; color: var(--text); }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
#status { margin-left: auto; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; padding-left: 8px; }
#status.err { color: var(--red); }
#side .head { padding: 4px; border-bottom: 1px solid var(--line); display: flex; gap: 4px; }
#side .head input { flex: 1; min-width: 0; height: 23px; }
#bones, #shapes, #meshes { flex: 1; overflow: auto; padding: 2px 0; }
.meshrow { display: flex; align-items: center; gap: 5px; height: 21px; padding: 0 6px; cursor: pointer; white-space: nowrap; }
.meshrow:hover { background: #2c2f35; }
.meshrow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.meshrow.off .nm { color: var(--dim); }
.meshbar { display: flex; gap: 4px; padding: 4px; border-bottom: 1px solid var(--line); }
#side .tabs { display: flex; gap: 2px; padding: 4px 4px 0; border-bottom: 1px solid var(--line); }
#side .tabs button { flex: 1; border-radius: 3px 3px 0 0; border-bottom: 0; }
.mesh { display: flex; align-items: center; height: 21px; padding: 0 4px; cursor: pointer; color: var(--dim); white-space: nowrap; }
.mesh:hover { background: #2c2f35; }
.mesh .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.shape { display: flex; align-items: center; gap: 4px; height: 21px; padding: 0 4px 0 16px; cursor: pointer; white-space: nowrap; }
.shape:hover { background: #2c2f35; }
.shape.sel { background: #2b4666; }
.shape .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #aab0ba; }
.shape.on .nm { color: #fff; }
.shape input[type=range] { width: 70px; height: 14px; padding: 0; margin: 0; background: none; border: 0; accent-color: var(--accent); }
.shape .val { width: 24px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.shape .kd { width: 10px; text-align: center; font-size: 9px; color: transparent; }
.shape.keyed .kd { color: #8a7433; }
.shape.keynow .kd { color: var(--key); }
.shape.edited .val { color: var(--sel); }
.bone { display: flex; align-items: center; height: 19px; padding-right: 4px; cursor: pointer; white-space: nowrap; }
.bone:hover { background: #2c2f35; }
.bone.sel { background: #2b4666; }
.bone .tw { width: 12px; flex: none; color: var(--dim); text-align: center; }
.bone .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.bone.human .nm { color: #fff; }
.bone:not(.human) .nm { color: #aab0ba; }
.bone .kd { width: 12px; flex: none; text-align: center; font-size: 9px; color: transparent; }
.bone.keyed .kd { color: #8a7433; }
.bone.keynow .kd { color: var(--key); }
#tlbar { display: flex; gap: 4px; align-items: center; padding: 4px 6px; flex-wrap: wrap; }
#tlwrap { position: relative; height: 170px; }
#tlresize { height: 7px; margin-top: -4px; cursor: ns-resize; position: relative; }
#tlresize:hover { background: var(--accent); }
#tl { display: block; width: 100%; height: 100%; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim);
  font-size: 14px; pointer-events: none; text-align: center; line-height: 1.8; }
.menu { position: fixed; background: var(--panel2); border: 1px solid #50545c; border-radius: 4px; padding: 3px 0; z-index: 60;
  min-width: 140px; box-shadow: 0 4px 14px rgba(0,0,0,.4); display: none; }
.menu div { padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.menu div:hover { background: #2b4666; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 70; }
.modal.show { display: flex; }
#ask input { width: 440px; max-width: 80vw; }
#ask .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
.modal .box { background: var(--panel); border: 1px solid #50545c; border-radius: 6px; padding: 12px 14px; min-width: 260px; max-width: 520px; }
.modal .box h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.modal .box .list { display: flex; flex-direction: column; gap: 4px; }
.modal .box .list button { text-align: left; height: auto; padding: 5px 8px; }
#help table { border-collapse: collapse; }
#help .box, #settings .box { max-height: 86vh; overflow: auto; }
#settings .box { width: min(680px, 94vw); max-width: none; }
#settings h4 { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: var(--key); }
.setrow { display: flex; align-items: center; gap: 6px; padding: 2px 0; flex-wrap: wrap; }
.setrow .lb { width: 140px; flex: none; }
.setrow .kb { flex: 1; min-width: 90px; text-align: left; }
.keygrid .setrow { flex-wrap: nowrap; }
.setrow .kx { padding: 2px 6px; color: var(--dim); }
.keygrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
#settings .note { color: var(--dim); margin: 2px 0 0; }
#help td { padding: 2px 10px 2px 0; vertical-align: top; }
#help td:first-child { color: var(--key); white-space: nowrap; }
#vpane { flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); position: relative; }
#vresize { position: absolute; left: -4px; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 5; }
#vresize:hover { background: var(--accent); }
#vpane .vbar { display: flex; gap: 4px; align-items: center; padding: 4px 6px; }
#vName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
#vbox { flex: 1; min-height: 0; position: relative; background: #000; }
#vid, #vimg { width: 100%; height: 100%; object-fit: contain; display: block; }
#vEmpty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); pointer-events: none; }
#vSeek { flex: 1; min-width: 60px; padding: 0; height: 16px; accent-color: var(--accent); background: none; border: 0; }
#vTime { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pop.col { flex-direction: column; align-items: stretch; }
.pop .prow { display: flex; gap: 5px; align-items: center; }
.pop .prow input[type=number] { width: 58px; }
.pop { position: fixed; display: none; gap: 5px; align-items: center; background: var(--panel2); border: 1px solid #50545c; border-radius: 4px;
  padding: 6px 8px; z-index: 60; box-shadow: 0 4px 14px rgba(0,0,0,.4); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="bNew" title="キーを全部消して最初から">新規</button>
    <button id="bOpen" title=".sismotion（プロジェクト）を開く">開く</button>
    <button id="bSaveProj" title="キー・呼吸などをそのまま .sismotion に保存する（あとで開いて続きを作れる）">プロジェクト保存</button>
    <button id="bSave" title="Ctrl+S">.anim保存</button>
    <button id="bSaveAs">.anim別名保存</button>
    <input id="projFile" type="file" accept=".sismotion,application/json" hidden>
    <span class="sep"></span>
    <button id="bMove" title="W">移動</button>
    <button id="bRot" title="E">回転</button>
    <button id="bSpace" title="X">ローカル</button>
    <span class="sep"></span>
    <button id="bIK" title="手先・足先をIKで動かす">IK</button>
    <button id="bPin" title="体を動かしても、IKの手先・足先をその場に残す">固定</button>
    <button id="bAuto" title="動かし終えたらキーを打つ">自動キー</button>
    <button id="bSym" title="左右の骨を一緒に動かす">対称</button>
    <button id="bLimit" title="首や手首などを回しすぎないようにする">上限</button>
    <button id="bFalloff" title="キーを打つとき、前後のキーにも同じ動きを少しずつ足す（離れるほど弱く）">伝染</button>
    <input id="falloffR" type="number" min="1" step="1" style="width:44px" title="伝染させる範囲（前後のフレーム数）。左右にドラッグかホイールで増減、クリックで打ち込み。Shiftで5ずつ">
    <span class="sep"></span>
    <button id="bPose">ポーズ ▾</button>
    <button id="bBones" title="骨の表示">骨: 人型</button>
    <button id="bOnion" title="前後のキーの骨を重ねる">オニオン</button>
    <button id="bBreath">呼吸</button>
    <button id="bVideo">動画</button>
    <button id="bPair" title="2人目のアバター（相手役）を出して、同じタイムラインで一緒に再生する">相手 ▾</button>
    <button id="bWho" title="動かすほうを入れ替える（相手役の体をクリックしても入れ替わる）" style="display:none"></button>
    <button id="bSettings" title="マウスとキーの割り当て">設定</button>
    <button id="bHelp">?</button>
    <span id="status"></span>
  </div>
  <div id="side">
    <div class="tabs"><button id="tabBones" class="on">骨</button><button id="tabShapes">シェイプ</button><button id="tabMeshes">表示</button></div>
    <div class="head"><input id="filter" placeholder="探す"></div>
    <div id="bones"></div>
    <div id="shapes" style="display:none"></div>
    <div id="meshes" style="display:none"></div>
  </div>
  <div id="view">
    <div id="empty"><div>読み込み中</div></div>
  </div>
  <div id="vpane" style="display:none">
    <div id="vresize"></div>
    <div class="vbar"><button id="vOpen">開く</button><span id="vName"></span><button id="vMirror" title="左右反転">反転</button><button id="vMute">音なし</button></div>
    <div id="vbox"><video id="vid" playsinline muted preload="auto"></video><img id="vimg" alt="" style="display:none"><div id="vEmpty">動画か画像をここに置く</div></div>
    <div class="vbar vvid"><button id="vBack" title="動画を1フレーム前へずらす">-1</button><input id="vSeek" type="range" min="0" max="0" step="0.001" title="今のフレームに合わせる動画の位置"><button id="vFwd" title="動画を1フレーム後ろへずらす">+1</button><span id="vTime"></span></div>
    <div class="vbar vvid"><span>0Fの位置</span><input id="vStart" type="number" step="0.01" style="width:64px" title="0フレームのときの動画の時刻（秒）"><span>秒</span><button id="vZero" title="今の動画の位置を0フレームにする">ここを0F</button></div>
    <input id="vFile" type="file" accept="video/*,image/*" hidden>
  </div>
  <div id="timeline">
    <div id="tlresize"></div>
    <div id="tlbar">
      <button id="bPlay" title="Space">▶</button>
      <button id="bPrevKey" title="Shift+,">|◀</button>
      <button id="bPrev" title=",">◀</button>
      <input id="frame" type="number" min="0" value="0">
      <button id="bNext" title=".">▶</button>
      <button id="bNextKey" title="Shift+.">▶|</button>
      <span style="color:var(--dim)">/</span>
      <input id="frames" type="number" min="1" value="60" title="フレーム数">
      <span style="color:var(--dim)">fps</span>
      <input id="fps" type="number" min="1" max="240" value="30">
      <label><input id="loop" type="checkbox" checked>ループ</label>
      <span class="sep"></span>
      <button id="bKey" title="K">キー</button>
      <button id="bKeyAll" title="Shift+K">全身キー</button>
      <button id="bDel" title="Delete">キーを消す</button>
      <select id="interp" title="このフレームから次のキーまでのつなぎ方">
        <option value="0">Auto</option><option value="1">Linear</option><option value="2">Constant</option>
      </select>
      <span id="unkeyed" style="color:var(--sel)"></span>
    </div>
    <div id="tlwrap"><canvas id="tl"></canvas></div>
  </div>
</div>
<div id="ctx" class="menu"></div>
<div id="breathPop" class="pop"><label><input id="brOn" type="checkbox">入れる</label><span>周期</span><input id="brPeriod" type="number" min="0.5" max="60" step="0.5"><span>秒</span><span>強さ</span><input id="brAmp" type="number" min="0" max="500" step="10"><span>%</span><span id="brNote" style="color:var(--dim)"></span></div>
<div id="pairPop" class="pop col">
  <div class="prow"><span id="paName" style="color:var(--dim)"></span><span style="flex:1"></span><button id="paSwap" title="動かすほうを入れ替える（キーを打てるのは動かしているほうだけ）">⇄ 入れ替え</button></div>
  <div class="prow"><span>出す</span><button id="paSame" title="今のアバターをもう1体出す">同じアバター</button><button id="paUnityTab" title="Unityで開いた、ほかのアバターのタブから出す（衣装なども出る）">Unityの別のタブ…</button><button id="paFolder" title="FBXと画像が入ったフォルダを選ぶ">フォルダから…</button><button id="paFiles" title="FBXと画像（と .motiontool.json）をまとめて選ぶ">ファイルから…</button><button id="paDel">消す</button></div>
  <div class="prow"><label><input id="paShow" type="checkbox">見せる</label><label><input id="paGhost" type="checkbox">半透明</label><span class="sep"></span><span>動き</span><button id="paMotion" title="相手役の .sismotion を開く（同じタイムラインで一緒に再生する）">.sismotion…</button><button id="paCopy" title="今のアバターのキーを、骨の名前で相手役に写す">今の動きを写す</button><button id="paStill" title="相手役の動きを外して、元のポーズにする">動きなし</button></div>
  <div class="prow"><span>位置</span><span>X</span><input id="paX" type="number" step="0.01"><span>Y</span><input id="paY" type="number" step="0.01"><span>Z</span><input id="paZ" type="number" step="0.01"><span>向き</span><input id="paYaw" type="number" step="5"><span>°</span><button id="paFace" title="今のアバターの正面に、こちらを向けて置く">向かい合わせ</button></div>
  <div class="prow"><span id="paUnity" style="color:var(--dim)" title="Unityで2体の.animを再生するときは、この置き方にすると、ここで見たとおりに組み合う"></span></div>
  <div class="prow"><span>くっつける</span><button id="paPin" title="IKで選んだ手先・足先か、選んだ腰（ルート）を、相手の体にくっつける。押してから相手の体をクリックする（今のフレームでの位置の関係を、ほかのフレームでも保つ）">選んだ手足・腰 → 相手の体…</button><button id="paLook" title="首と頭を、相手の顔（目の間）に向けてキーを打つ">視線 → 相手の顔</button><span id="paPinInfo" style="color:var(--dim)"></span></div>
  <div class="prow" id="paPinRow" style="display:none"><span>フレーム</span><input id="paFrom" type="number" min="0" step="1"><span>〜</span><input id="paTo" type="number" min="0" step="1"><span>間隔</span><input id="paStep" type="number" min="1" step="1" style="width:44px"><label title="手先・足先の向きも、相手の骨と一緒に回す"><input id="paRot" type="checkbox">向きも</label><button id="paBake" title="この範囲のフレームに、くっついた姿勢でキーを打つ（相手の動きを変えたら、もう一度押す）">キーを打つ</button><button id="paPinX">やめる</button></div>
  <input id="paFolderIn" type="file" webkitdirectory multiple hidden>
  <input id="paFilesIn" type="file" multiple hidden accept=".fbx,.json,.png,.jpg,.jpeg,.tga,.bmp,.webp">
  <input id="paMotionIn" type="file" accept=".sismotion,application/json" hidden>
</div>
<div id="ask" class="modal"><div class="box"><h3></h3><input type="text" spellcheck="false"><div class="row"><button class="no">やめる</button><button class="ok">OK</button></div></div></div>
<div id="help" class="modal"><div class="box">
  <h3>操作</h3>
  <table id="helpTable"></table>
  <p id="helpNote" style="color:var(--dim);margin:8px 0 0"></p>
  <p style="color:var(--dim);margin:8px 0 0">最初のモデル: <a href="https://minto-akayama.booth.pm/items/8861598" target="_blank" rel="noopener" style="color:var(--accent)">茜犬 -Akane-</a>（CC0、赤山みんと）</p>
</div></div>
<div id="settings" class="modal"><div class="box"><h3>設定</h3><div id="settingsBody"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r6 = v => Math.round(v * 1e6) / 1e6;

// ================================================================
//  3D
// ================================================================

const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
renderer.domElement.tabIndex = 0;
const scene = new THREE.Scene();
scene.matrixWorldAutoUpdate = false; // 描く直前に自分で更新する（骨を表示用の向きにする前の値でギズモを置くため）
scene.background = new THREE.Color(0x2a2c30);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
camera.position.set(0, 1, 4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x50505a, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(1, 2, 3);
scene.add(sun);
let grid = new THREE.GridHelper(4, 20, 0x5a5a5a, 0x3a3a3a);
scene.add(grid);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1, 0);
orbit.mouseButtons = { LEFT: -1, MIDDLE: -1, RIGHT: -1 }; // 押したときに、設定の割り当てで決める
orbit.enableDamping = false;

const gizmo = new TransformControls(camera, renderer.domElement);
gizmo.setSpace('local');
gizmo.setMode('rotate');
gizmo.setSize(0.9);
scene.add(gizmo.getHelper());
gizmo.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; });

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  drawTimeline();
}
new ResizeObserver(resize).observe(view);

const wq = (o, out = new THREE.Quaternion()) => o.getWorldQuaternion(out);
const wp = (o, out = new THREE.Vector3()) => o.getWorldPosition(out);
function setWorldQuat(o, q) {
  const pq = o.parent ? wq(o.parent) : new THREE.Quaternion();
  o.quaternion.copy(pq.invert().multiply(q)).normalize();
  o.updateMatrixWorld(true);
}
function setWorldPos(o, p) {
  o.parent.updateWorldMatrix(true, false);
  o.position.copy(o.parent.worldToLocal(p.clone()));
  o.updateMatrixWorld(true);
}
// Unity ⇔ three.js、左右の反転（モデルは +Z を向き、左右は X）
const mirrorQ = q => new THREE.Quaternion(q.x, -q.y, -q.z, q.w);
const mirrorV = v => new THREE.Vector3(-v.x, v.y, v.z);

// ================================================================
//  状態
// ================================================================

let M = null; // モデル（2 体いるときは、今動かしているほう。もう 1 体は P.M）
/** 今動かしているアバターの入れ物。いつも原点に置く（もう 1 体は P.wrap で、こちらから見た位置に置く） */
let ownWrap = new THREE.Group();
scene.add(ownWrap);
let D = { name: 'NewMotion', fps: 30, frameCount: 60, loop: true, tracks: new Map(), shapes: new Map(), interp: new Map(), breath: { on: false, period: 4, amp: 100 } };
let docVer = 0;
const S = {
  /** Unityから開いたとき: { path: 保存先の.anim（まだ無ければnull）, dir: 保存先の候補のフォルダ }。 */
  unity: null,
  /** 茜犬の見本（Unityを通さずに .anim を書く）。Unity から開いたときは unity、どちらでもなければ（file:// など）モデルを出さない。 */
  sample: false, animHandle: null,
  frame: 0, playing: false, playT: 0, sel: null, edited: new Set(), shapeEdited: new Set(), shapeSel: null, tab: 'bones',
  autoKey: true, ik: true, pin: false, falloff: false, falloffR: 10, space: 'local', mode: 'rotate', boneView: 'human', onion: false, unityView: true,
  dirty: false,
  /** 2 体いるとき、2 体目を動かしている */
  second: false,
  /** 今動かしているアバターをどこから読んだか（相手役の「同じアバター」と保存に使う） */
  src: null,
};

function setStatus(text, err = false) {
  const el = $('status');
  el.textContent = text || '';
  el.title = text || '';
  el.classList.toggle('err', !!err);
}

function markDirty() {
  S.dirty = true;
  updateTitle();
}
function updateTitle() { document.title = `${D.name}${S.dirty ? ' *' : ''} - SisMotionTooL`; }
// 閉じるときは止めない（自動保存が今の状態を残す。次に開くとそのまま戻る）
window.addEventListener('beforeunload', () => autoSaveNow());
window.addEventListener('pagehide', () => autoSaveNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoSaveNow(); });

// ================================================================
//  モデル
// ================================================================

const IMAGE_RE = /\.(png|jpe?g|tga|bmp|webp)$/i;
const MISSING_TEX = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==';

/**
 * FBX・画像・モデルの情報（FBX名.motiontool.json）から、モデルを出す。
 * texByMat: マテリアル名（小文字）→ 画像。Unityから開いたときに渡される。無ければ、画像の名前から探す。
 */
async function loadModelFiles(files, texByMat = null, body = null) {
  const r = await parseModelFiles(files, texByMat, body);
  if (!r) return false;
  if (r.error) { setStatus('FBXを読めません: ' + r.error, true); return true; }
  setModel(r.group, r.name, r.info);
  // 保存のときに送る元のポーズは FBX のまま（Unity は FBX と比べ、FBX の元のポーズに当てはめる）
  if (M && r.fileRest) M.fileRest = M.names.map((n, i) => r.fileRest.get(n) ?? { p: M.restWP[i], q: M.restWQ[i] });
  applyBodyShapes(body);
  if (r.missing.length) setStatus($('status').textContent + `  テクスチャなし: ${r.missing.join(', ')}`);
  return true;
}

/** FBX を読んで、シーンに入れる前のモデルにする。FBX が無ければ null、読めなければ { error } */
async function parseModelFiles(files, texByMat = null, body = null) {
  const fbx = files.find(f => /\.fbx$/i.test(f.name));
  if (!fbx) return null;
  const images = new Map();
  for (const f of files) if (IMAGE_RE.test(f.name)) images.set(f.name.toLowerCase(), f);
  // Unity の「HTML 用に書き出す」で FBX から作ったモデルの情報（人型の骨の対応と、マッスルの回転軸）
  const infoFile = files.find(f => f.name.toLowerCase() === fbx.name.toLowerCase() + '.motiontool.json');
  let info = null;
  if (infoFile) { try { info = JSON.parse(await infoFile.text()); } catch (e) { info = null; } }

  setStatus('読み込み中…');
  const urls = [];
  const manager = new THREE.LoadingManager();
  manager.setURLModifier(url => {
    if (url.startsWith('data:') || url.startsWith('blob:')) return url;
    const base = decodeURIComponent(url).split(/[\\/]/).pop().toLowerCase();
    const f = images.get(base);
    if (!f) return MISSING_TEX;
    const u = URL.createObjectURL(f);
    urls.push(u);
    return u;
  });
  manager.addHandler(/\.tga$/i, new TGALoader(manager));
  // テクスチャを読み始めたときだけ、読み終わるのを待つ（最長 4 秒）
  let loading = false;
  manager.onStart = () => { loading = true; };
  const done = new Promise(res => { manager.onLoad = res; });
  let group;
  const buffer = await fbx.arrayBuffer();
  try {
    group = new FBXLoader(manager).parse(buffer, '');
  } catch (e) {
    console.error(e);
    return { error: e.message };
  }
  // FBXLoader は軸の設定（Z-up など）を見ないので、Unity と同じく Y-up・+Z 向きに回す
  group.quaternion.setFromRotationMatrix(axisConversion(readAxes(buffer)));
  if (loading) await Promise.race([done, new Promise(res => setTimeout(res, 4000))]);
  const missing = fixMaterials(group, images, urls, texByMat || new Map());
  const fileRest = applyBodyBones(group, body);
  return { group, name: fbx.name, info, fileRest, missing };
}

/**
 * シーンのアバターで変えてある骨の大きさ・位置・向き（Unity が FBX と比べた差）を、元のポーズに入れる。
 * Unity とは X を反転した向きで、位置の単位は FBX のローカルの位置の長さの比で直す
 */
function applyBodyBones(group, body) {
  if (!body?.bones?.length) return null;
  const byName = new Map();
  group.traverse(o => { const n = o.userData.originalName || o.name; if (o.isBone && !byName.has(n)) byName.set(n, o); });
  // 変える前の、FBX のままの位置と向き（ワールド）
  group.updateMatrixWorld(true);
  const before = new Map([...byName].map(([n, o]) => [n, { p: wp(o), q: wq(o) }]));
  for (const b of body.bones) {
    const o = byName.get(b.name);
    if (!o) continue;
    if (b.scale?.length === 3) o.scale.multiply(new THREE.Vector3(...b.scale));
    if (b.move?.length === 3) {
      const ref = Math.hypot(...b.fbxPos);
      o.position.add(mirrorV(new THREE.Vector3(...b.move)).multiplyScalar(ref > 1e-9 ? o.position.length() / ref : 1));
    }
    if (b.turn?.length === 4) o.quaternion.multiply(mirrorQ(new THREE.Quaternion(...b.turn)));
  }
  group.updateMatrixWorld(true);
  return before;
}
/** シーンのアバターのシェイプキーの値を、キーが無いときの値にする（.anim には書かないので、Unity の再生でもシーンの値のまま） */
function applyBodyShapes(body, quiet = false) {
  if (!M) return;
  M.shapeBase = new Map();
  for (const s of body?.shapes || []) {
    const id = `${s.path}|${s.name}`;
    if (M.shapeById.has(id)) M.shapeBase.set(id, s.value);
  }
  if (M.shapeBase.size && !quiet) goFrame(S.frame);
}

/**
 * シーンのアバターの、FBX に無い見た目（衣装・髪・アクセ）を出す。Unity が書き出したメッシュをそのまま使う。
 * 衣装の骨は、Unity が決めた素体の骨の子にする（揺らさず、その骨に付いてくる）。
 * 骨の子にしてあるので、クリックで骨を選ぶ（boneAtHit）も衣装の上でそのまま効く。
 */
async function loadParts(parts) {
  if (!M || !parts) return;
  addParts(parts, await fetchParts(parts));
}
/** 衣装などのメッシュの中身（Unity のサーバーから）。読めなかった物は null */
function fetchParts(parts) {
  return Promise.all((parts.meshes || []).map(async pm => {
    try { const r = await fetch(pm.url); return r.ok ? await r.arrayBuffer() : null; } catch (e) { return null; }
  }));
}
/** quiet: 相手役のとき（左の一覧と状態の表示は今のアバターのままにする） */
function addParts(parts, bufs, quiet = false) {
  const hidden = hideSceneMeshes(parts.hide || [], quiet);
  if (!parts.meshes?.length) return;
  const fit = fitUnitySpace(parts);
  if (!fit) { if (!quiet) setStatus($('status').textContent + '  衣装などを合わせられません（素体の骨が見つからない）', true); return; }

  // 衣装の骨: 素体の骨（元のポーズ）から見た位置で固定する
  const saved = savePose();
  applyRest();
  const nodes = parts.nodes.map(nd => {
    const bone = M.bones[(nd.driver ? M.byName.get(nd.driver) : null) ?? M.hips];
    const o = new THREE.Object3D();
    o.name = nd.name;
    o.matrixAutoUpdate = false;
    o.matrix.copy(bone.matrixWorld).invert().multiply(fit.W.clone().multiply(new THREE.Matrix4().fromArray(nd.m)));
    bone.add(o);
    return o;
  });
  restorePose(saved);

  const flip = fit.W.determinant() < 0;
  const textures = new Map();
  const texture = url => {
    if (!url) return null;
    if (!textures.has(url)) {
      const t = new THREE.TextureLoader().load(url);
      t.colorSpace = THREE.SRGBColorSpace;
      textures.set(url, t);
    }
    return textures.get(url);
  };
  const meshes = parts.meshes.map((pm, k) => {
    const buf = bufs[k];
    if (!buf) return null;
    const n = pm.vertexCount;
    let off = 0;
    const take = (Type, count) => { const a = new Type(buf.slice(off, off + count * Type.BYTES_PER_ELEMENT)); off += count * Type.BYTES_PER_ELEMENT; return a; };
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(take(Float32Array, n * 3), 3));
    if (pm.normals) g.setAttribute('normal', new THREE.BufferAttribute(take(Float32Array, n * 3), 3));
    if (pm.uv) g.setAttribute('uv', new THREE.BufferAttribute(take(Float32Array, n * 2), 2));
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(take(Uint16Array, n * 4), 4));
    g.setAttribute('skinWeight', new THREE.BufferAttribute(take(Float32Array, n * 4), 4));
    const binds = take(Float32Array, pm.bones.length * 16);
    const index = take(Uint32Array, pm.indexCount);
    // 左右の反転を挟むと三角形の回り方が逆になる（そのままだと表と裏が入れ替わり、陰が逆に付く）
    if (flip) for (let t = 0; t + 2 < index.length; t += 3) [index[t + 1], index[t + 2]] = [index[t + 2], index[t + 1]];
    g.setIndex(new THREE.BufferAttribute(index, 1));
    if (!pm.normals) g.computeVertexNormals();
    const mats = pm.subs.map((s, k) => {
      g.addGroup(s.start, s.count, k);
      const map = texture(s.tex);
      const c = s.color || [1, 1, 1, 1];
      return new THREE.MeshToonMaterial({
        name: pm.name, map, color: new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace),
        alphaTest: map ? 0.4 : 0, side: THREE.DoubleSide,
      });
    });
    const mesh = new THREE.SkinnedMesh(g, mats);
    // Unity と同じく「骨のワールド × バインドポーズ」で動かす（メッシュ自体の置き場所は効かせない）
    mesh.bind(new THREE.Skeleton(pm.bones.map(k => nodes[k]), pm.bones.map((_, j) => new THREE.Matrix4().fromArray(binds, j * 16))), new THREE.Matrix4());
    mesh.name = pm.name;
    mesh.userData.originalName = pm.name;
    mesh.frustumCulled = false;
    return mesh;
  });
  const added = meshes.filter(Boolean);
  for (const m of added) { M.root.add(m); M.meshes.push(m); }
  M.root.updateMatrixWorld(true);
  if (!quiet) buildMeshList();
  for (const m of hidden) m.visible = false;
  if (quiet) return;
  refreshMeshList();
  const lost = parts.meshes.length - added.length;
  setStatus($('status').textContent + `  衣装など${added.length}個` + (lost ? `（${lost}個は読めません）` : '') +
    (fit.err > M.size * 0.01 ? `  骨の合わせに${(fit.err / M.size * 100).toFixed(1)}%のずれ` : ''), lost > 0);
}

/** シーンで出ていない FBX のメッシュ（パスはモデルのルートから）を隠す。隠した物を返す */
function hideSceneMeshes(paths, quiet = false) {
  if (!paths.length) return [];
  const want = new Set(paths);
  const out = [];
  for (const m of M.meshes) {
    const path = [];
    for (let o = m; o && o !== M.root; o = o.parent) path.unshift(o.userData.originalName ?? o.name);
    if (want.has(path.join('/'))) { m.visible = false; out.push(m); }
  }
  if (out.length && !quiet) refreshMeshList();
  return out;
}

/**
 * Unity の空間（モデルのルートから）→ ページのワールドの行列。素体の骨のシーンでの位置を、ページの元のポーズの位置に最小二乗で重ねる。
 * 反転・単位・軸の違い（Z-up の FBX など）も、Armature ごとの拡大も、まとめてここに入る。err はいちばんずれた骨の距離。
 */
function fitUnitySpace(parts) {
  const rows = [];
  (parts.refNames || []).forEach((n, k) => {
    const i = M.byName.get(n);
    if (i != null) rows.push([parts.refPos[k * 3], parts.refPos[k * 3 + 1], parts.refPos[k * 3 + 2], M.restWP[i]]);
  });
  if (rows.length < 4) return null;
  // (Σ u uᵀ) X = Σ u pᵀ、u = (x, y, z, 1)
  const A = [0, 1, 2, 3].map(() => [0, 0, 0, 0]), B = [0, 1, 2, 3].map(() => [0, 0, 0]);
  for (const [x, y, z, p] of rows) {
    const u = [x, y, z, 1];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) A[r][c] += u[r] * u[c];
      B[r][0] += u[r] * p.x; B[r][1] += u[r] * p.y; B[r][2] += u[r] * p.z;
    }
  }
  // ガウスの消去法（部分ピボット）
  for (let c = 0; c < 4; c++) {
    let piv = c;
    for (let r = c + 1; r < 4; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-12) return null;
    [A[c], A[piv]] = [A[piv], A[c]];
    [B[c], B[piv]] = [B[piv], B[c]];
    for (let r = 0; r < 4; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 4; k++) A[r][k] -= f * A[c][k];
      for (let k = 0; k < 3; k++) B[r][k] -= f * B[c][k];
    }
  }
  const X = B.map((row, r) => row.map(v => v / A[r][r]));
  const W = new THREE.Matrix4().set(
    X[0][0], X[1][0], X[2][0], X[3][0],
    X[0][1], X[1][1], X[2][1], X[3][1],
    X[0][2], X[1][2], X[2][2], X[3][2],
    0, 0, 0, 1);
  let err = 0;
  for (const [x, y, z, p] of rows) err = Math.max(err, new THREE.Vector3(x, y, z).applyMatrix4(W).distanceTo(p));
  return { W, err, count: rows.length };
}

/** FBX の GlobalSettings の軸（UpAxis など）。バイナリとテキストの両方。無ければ Y-up・+Z 前・+X。 */
function readAxes(buffer) {
  const names = ['UpAxis', 'UpAxisSign', 'FrontAxis', 'FrontAxisSign', 'CoordAxis', 'CoordAxisSign'];
  const out = { UpAxis: 1, UpAxisSign: 1, FrontAxis: 2, FrontAxisSign: 1, CoordAxis: 0, CoordAxisSign: 1 };
  const bytes = new Uint8Array(buffer);
  const head = new TextDecoder('latin1').decode(bytes.subarray(0, 20));
  if (head.startsWith('Kaydara FBX Binary')) {
    const dv = new DataView(buffer);
    for (const name of names) {
      const pat = [83, name.length, 0, 0, 0, ...[...name].map(ch => ch.charCodeAt(0))];
      let i = -1;
      outer: for (let s = 0; s + pat.length < bytes.length; s++) {
        for (let k = 0; k < pat.length; k++) if (bytes[s + k] !== pat[k]) continue outer;
        i = s;
        break;
      }
      if (i < 0) continue;
      let j = i + pat.length;
      // 名前のあとに文字列 3 つ（型など）、そのあとに値
      for (let n = 0; n < 3 && bytes[j] === 83; n++) j += 5 + dv.getUint32(j + 1, true);
      if (bytes[j] === 73) out[name] = dv.getInt32(j + 1, true);
    }
  } else {
    const text = new TextDecoder().decode(bytes.subarray(0, Math.min(bytes.length, 200000)));
    for (const name of names) {
      const m = new RegExp(`"${name}"\\s*,\\s*"int"\\s*,\\s*"Integer"\\s*,\\s*""\\s*,\\s*(-?\\d+)`).exec(text);
      if (m) out[name] = Number(m[1]);
    }
  }
  return out;
}

/** ファイルの軸 → Y-up・+Z 前・+X（Unity で読んだときの向きを、X を反転する前の形で）。 */
function axisConversion(a) {
  const axis = (i, s) => new THREE.Vector3(i === 0 ? s : 0, i === 1 ? s : 0, i === 2 ? s : 0);
  const c = axis(a.CoordAxis, a.CoordAxisSign), u = axis(a.UpAxis, a.UpAxisSign), f = axis(a.FrontAxis, a.FrontAxisSign);
  const m = new THREE.Matrix4().makeBasis(c, u, f);
  if (Math.abs(m.determinant() - 1) > 1e-6) return new THREE.Matrix4();
  return m.transpose();
}

/**
 * テクスチャは、Unity のマテリアルの物 → FBX が指している物 → マテリアル名に近い画像、の順で貼る。見た目はトゥーン 1 種にそろえる。
 * 貼れなかったマテリアルの名前を返す。
 */
function fixMaterials(group, images, urls, unityTex) {
  const loadFile = f => {
    const u = URL.createObjectURL(f);
    urls.push(u);
    return (/\.tga$/i.test(f.name) ? new TGALoader() : new THREE.TextureLoader()).load(u);
  };
  const missing = [];
  const byMat = new Map();
  group.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map(m => {
      if (byMat.has(m)) return byMat.get(m);
      const own = unityTex.get((m.name || '').toLowerCase());
      let map = own ? loadFile(own) : m.map && m.map.image && m.map.image.src !== MISSING_TEX ? m.map : null;
      if (!map) {
        const f = guessTexture(m.name, images);
        if (f) map = loadFile(f);
      }
      if (map) map.colorSpace = THREE.SRGBColorSpace;
      else missing.push(m.name || '(名前なし)');
      const nm = new THREE.MeshToonMaterial({
        name: m.name, map, color: map ? 0xffffff : (m.color ? m.color.clone() : new THREE.Color(0xcccccc)),
        alphaTest: map ? 0.4 : 0, side: THREE.DoubleSide,
      });
      byMat.set(m, nm);
      return nm;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
  return missing;
}

function guessTexture(matName, images) {
  const norm = s => s.toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]/g, '');
  const want = norm(matName || '');
  if (!want) return null;
  let best = null;
  for (const [name, f] of images) {
    const n = norm(name);
    if (/mask|normal|matcap|rim|outline|emission|shadow|alpha/.test(n)) continue;
    if (!(n === want || n.endsWith(want) || want.endsWith(n))) continue;
    if (!best || n.length < norm(best.name).length) best = f;
  }
  return best;
}

/** into: 相手役のとき、入れる先（画面・左の一覧・カメラは今のアバターのままにする） */
function setModel(group, name, info = null, into = null) {
  const oldNames = M ? D.tracks.size && new Map([...D.tracks].map(([i, t]) => [M.names[i], t])) : null;
  if (M) {
    gizmo.detach();
    M.root.parent?.remove(M.root);
    for (const L of M.limbs) { scene.remove(L.target); scene.remove(L.pole); }
    M.root.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); }); } });
  }
  (into || ownWrap).add(group);
  group.updateMatrixWorld(true);

  const isBone = o => o.isBone && !(o.parent && o.parent.isBone && o.parent.ID === o.ID);
  // 腰のすぐ上に「ルート」を1つ挟む（全体の移動・回転用）。FBXには無い物なので、書き出すときは骨として数えない。
  // 動くのは腰から下だけ。UnityのHumanoidの再生も腰から下しか動かさないので、見た目がそろう
  const rootNode = new THREE.Group();
  {
    const list = [];
    group.traverse(o => { if (isBone(o)) list.push(o); });
    const hips = findHipsObject(list, info && info.model === name ? info : null);
    if (hips) { hips.parent.add(rootNode); rootNode.add(hips); }
  }
  const bones = [];
  group.traverse(o => { if (isBone(o) || o === rootNode) bones.push(o); });
  const index = new Map(bones.map((b, i) => [b, i]));
  const names = bones.map(b => (b === rootNode ? '' : b.userData.originalName || b.name));
  if (index.has(rootNode)) names[index.get(rootNode)] = names.includes(ROOT_NAME) ? ROOT_NAME + '*' : ROOT_NAME;
  const byName = new Map();
  names.forEach((n, i) => { if (!byName.has(n)) byName.set(n, i); });
  const parent = bones.map(b => { for (let p = b.parent; p; p = p.parent) if (index.has(p)) return index.get(p); return -1; });
  const depth = parent.map(() => 0);
  for (let i = 0; i < bones.length; i++) depth[i] = parent[i] >= 0 ? depth[parent[i]] + 1 : 0;
  const children = bones.map(() => []);
  parent.forEach((p, i) => { if (p >= 0) children[p].push(i); });
  const meshes = [];
  group.traverse(o => { if (o.isMesh) meshes.push(o); });
  // シェイプキー。id は「メッシュのパス|名前」（Unity のカーブのパスと blendShape.名前 に対応）
  const shapes = [];
  for (const m of meshes) {
    if (!m.morphTargetDictionary) continue;
    const path = [];
    for (let o = m; o && o !== group; o = o.parent) path.unshift(o.userData.originalName ?? o.name);
    const p = path.join('/');
    for (const [name, idx] of Object.entries(m.morphTargetDictionary).sort((x, y) => x[1] - y[1]))
      shapes.push({ id: `${p}|${name}`, mesh: m, path: p, name, idx });
  }

  M = {
    root: group, name, bones, index, names, byName, parent, depth, children, meshes, rootBone: index.get(rootNode) ?? -1,
    shapes, shapeById: new Map(shapes.map(x => [x.id, x])), shapeIndex: new Map(shapes.map((x, k) => [x.id, k])),
    restQ: bones.map(b => b.quaternion.clone()),
    restP: bones.map(b => b.position.clone()),
    restWQ: bones.map(b => wq(b)),
    restWP: bones.map(b => wp(b)),
    human: {}, humanFrom: '', humanSet: new Set(), hips: -1, limbs: [], size: 1,
  };
  const box = new THREE.Box3();
  for (const p of M.restWP) box.expandByPoint(p);
  M.size = Math.max(1e-3, box.max.y - box.min.y) * 1.1;

  setHuman(guessHuman());
  M.humanFrom = '名前から推測';
  if (info && info.model === name) applyHumanFromJson(info);
  M.muscleInfo = info && info.model === name && info.muscle?.bones?.length ? info : null;
  const axesFrom = info && info.model === name && setUnityInfo(info) ? 'Unity' : loadRememberedInfo() ? 'Unity（前回）' : '';

  // 前のモデルのキーは、骨の名前で引き継ぐ
  D.tracks.clear();
  if (oldNames) for (const [n, t] of oldNames) if (byName.has(n)) D.tracks.set(byName.get(n), t);
  for (const id of [...D.shapes.keys()]) if (!M.shapeById.has(id)) D.shapes.delete(id);
  docVer++;
  if (into) return;
  S.shapeSel = null;

  frameCamera();
  buildBoneList();
  buildShapeList();
  buildMeshList();
  $('empty').style.display = 'none';
  S.sel = null;
  goFrame(S.frame);
  setStatus(`${name}  骨${bones.length}本、人型${M.humanSet.size}本（${M.humanFrom}）` + (axesFrom ? `、関節の軸は${axesFrom}` : ''));
}

const ROOT_NAME = 'ルート';
/** 位置のキーを持つ骨（腰とルート）。ほかの骨は回転だけ。 */
const hasPos = i => i === M.hips || i === M.rootBone;

/** ルートを挟む相手（腰）を、骨の一覧ができる前に決める。モデルの情報 → 名前の順。 */
function findHipsObject(list, info) {
  if (!list.length) return null;
  const names = list.map(b => b.userData.originalName || b.name);
  const pick = n => (names.includes(n) ? list[names.indexOf(n)] : null);
  const fromInfo = info && Array.isArray(info.human) && info.human.find(t => t.startsWith('Hips:'));
  return (fromInfo && pick(fromInfo.slice(5)))
    || list[names.findIndex(n => /^(hips?|pelvis)$/i.test(n.replace(/^.*:/, '')))]
    || list[names.findIndex(n => /hip|pelvis/i.test(n))] || list[0];
}

/** json の human（"LeftUpperArm:骨の名前"）で人型の骨の対応を置き換える（.meta から読んだものは優先）。 */
function applyHumanFromJson(obj) {
  if (!Array.isArray(obj.human) || !obj.human.length) return;
  const map = {};
  for (const s of obj.human) { const at = s.indexOf(':'); const i = M.byName.get(s.slice(at + 1)); if (i != null) map[s.slice(0, at)] = i; }
  if (Object.keys(map).length >= 10) { M.humanFrom = 'json'; setHuman(map); if (M.rows) buildBoneList(); }
}

/** "LeftUpperArm" 形式の名前 → 骨の番号。 */
function setHuman(map) {
  M.human = {};
  for (const [k, i] of Object.entries(map)) if (i != null && i >= 0) M.human[k.replace(/\s+/g, '')] = i;
  M.humanSet = new Set(Object.values(M.human));
  M.hips = M.human.Hips ?? bonesMatching(/hip|pelvis/i)[0] ?? 0;
  buildLimbs();
  if (M.unityInfo) setUnityInfo(M.unityInfo, false);
  else { buildDof(); buildUnityView(); }
  S.boneView = M.humanSet.size >= 10 ? 'human' : 'all';
  updateButtons();
}

function bonesMatching(re) { return M.names.map((n, i) => re.test(n) ? i : -1).filter(i => i >= 0); }

function sideOf(n) {
  if (/left/i.test(n)) return 'Left';
  if (/right/i.test(n)) return 'Right';
  if (/(^|[_.\s-])[lL]([_.\s-]|\d|$)/.test(n)) return 'Left';
  if (/(^|[_.\s-])[rR]([_.\s-]|\d|$)/.test(n)) return 'Right';
  if (/[a-z][L]$/.test(n)) return 'Left';
  if (/[a-z][R]$/.test(n)) return 'Right';
  return '';
}

/** .meta が無いときの、名前からの推測。 */
function guessHuman() {
  const table = [
    ['Hips', /^(hips?|pelvis)$/], ['Spine', /^spine$/], ['Chest', /^(chest|spine1)$/], ['UpperChest', /^(upperchest|spine2)$/],
    ['Neck', /^neck$/], ['Head', /^head$/],
    ['Shoulder', /^(shoulder|clavicle)$/], ['UpperArm', /^(upperarm|uparm|arm)$/], ['LowerArm', /^(lowerarm|forearm|elbow)$/],
    ['Hand', /^(hand|wrist)$/], ['UpperLeg', /^(upperleg|upleg|thigh)$/], ['LowerLeg', /^(lowerleg|leg|calf|knee|shin)$/],
    ['Foot', /^(foot|ankle)$/], ['Toes', /^(toes?|toebase)$/], ['Eye', /^eyes?$/],
  ];
  const fingers = { thumb: 'Thumb', index: 'Index', middle: 'Middle', ring: 'Ring', little: 'Little', pinky: 'Little' };
  const segNames = { proximal: 0, intermediate: 1, distal: 2 };
  const SEG = ['Proximal', 'Intermediate', 'Distal'];
  const out = {};
  const fingerBones = []; // [side, 指, 番号 or 名前, 骨]
  M.names.forEach((raw, i) => {
    const n = raw.replace(/^.*:/, '');
    if (/_end$|end$/i.test(n)) return;
    const side = sideOf(n);
    const base = n.replace(/left|right/ig, '').replace(/(^|[_.\s-])[lLrR](?=[_.\s-]|\d|$)/g, '$1')
      .replace(/([a-z])[LR]$/, '$1').toLowerCase().replace(/[^a-z0-9]/g, '');
    for (const [hn, re] of table) {
      const sided = !['Hips', 'Spine', 'Chest', 'UpperChest', 'Neck', 'Head'].includes(hn);
      if (sided !== !!side || !re.test(base)) continue;
      const key = sided ? side + hn : hn;
      if (out[key] == null) out[key] = i;
    }
    const fm = /^(?:hand)?(thumb|index|middle|ring|little|pinky)(?:finger)?(proximal|intermediate|distal|\d)?$/.exec(base);
    if (fm && side) fingerBones.push([side, fingers[fm[1]], fm[2], i]);
  });
  // 指: 名前の番号（0 始まりも 1 始まりもある）か、根元からの順
  for (const side of ['Left', 'Right']) for (const f of Object.values(fingers)) {
    const list = fingerBones.filter(x => x[0] === side && x[1] === f);
    if (!list.length) continue;
    const nums = list.map(x => (x[2] in segNames ? segNames[x[2]] : x[2] != null ? Number(x[2]) : null));
    const min = Math.min(...nums.filter(v => v != null));
    list.forEach((x, k) => {
      const seg = nums[k] != null ? nums[k] - (x[2] in segNames ? 0 : min) : k;
      const key = side + f + SEG[seg];
      if (seg >= 0 && seg < 3 && out[key] == null) out[key] = x[3];
    });
  }
  // 腕・脚は、手先・足先から親をたどって決める（MMD の「足 = 太もも」など、名前だけでは決まらない）
  const up = i => { let p = M.parent[i]; while (p >= 0 && /twist|roll|捩/i.test(M.names[p])) p = M.parent[p]; return p; };
  for (const side of ['Left', 'Right']) {
    for (const [end, mid, top] of [['Hand', 'LowerArm', 'UpperArm'], ['Foot', 'LowerLeg', 'UpperLeg']]) {
      const c = out[side + end];
      if (c == null) continue;
      const b = up(c), a = b >= 0 ? up(b) : -1;
      if (b >= 0) out[side + mid] = b;
      if (a >= 0) out[side + top] = a;
    }
  }
  return out;
}

/** 左右の相手（名前の L/R を入れ替えた骨）。無ければ自分。 */
function partnerOf(i) {
  if (!M.partner) {
    M.partner = M.names.map((n, j) => {
      const cands = [
        n.replace(/Left/g, 'Right'), n.replace(/Right/g, 'Left'), n.replace(/left/g, 'right'), n.replace(/right/g, 'left'),
        n.replace(/(^|[_.\s-])L(?=[_.\s-]|\d|$)/g, '$1R'), n.replace(/(^|[_.\s-])R(?=[_.\s-]|\d|$)/g, '$1L'),
        n.replace(/(^|[_.\s-])l(?=[_.\s-]|\d|$)/g, '$1r'), n.replace(/(^|[_.\s-])r(?=[_.\s-]|\d|$)/g, '$1l'),
        n.replace(/([a-z])L$/, '$1R'), n.replace(/([a-z])R$/, '$1L'),
      ];
      for (const c of cands) if (c !== n && M.byName.has(c)) return M.byName.get(c);
      return j;
    });
  }
  return M.partner[i];
}

function frameCamera() {
  const box = new THREE.Box3();
  for (const p of M.restWP) box.expandByPoint(p);
  const c = box.getCenter(new THREE.Vector3());
  const h = M.size;
  orbit.target.copy(c);
  camera.near = h / 200;
  camera.far = h * 200;
  camera.position.set(c.x, c.y + h * 0.05, c.z + h * 2.6);
  camera.updateProjectionMatrix();
  orbit.update();
  scene.remove(grid);
  grid = new THREE.GridHelper(h * 6, 24, 0x5a5a5a, 0x3a3a3a);
  scene.add(grid);
  buildMarkers();
}

// ================================================================
//  IK（2 ボーン。肘・膝は、付け根の骨に固定したヒンジでだけ曲げる）
// ================================================================

const LIMBS = [
  { key: 'LeftHand', label: '左手', parts: ['LeftUpperArm', 'LeftLowerArm', 'LeftHand'], arm: true },
  { key: 'RightHand', label: '右手', parts: ['RightUpperArm', 'RightLowerArm', 'RightHand'], arm: true },
  { key: 'LeftFoot', label: '左足', parts: ['LeftUpperLeg', 'LeftLowerLeg', 'LeftFoot'], arm: false },
  { key: 'RightFoot', label: '右足', parts: ['RightUpperLeg', 'RightLowerLeg', 'RightFoot'], arm: false },
];

function modelForward() {
  for (const s of ['Left', 'Right']) {
    const f = M.human[s + 'Foot'], t = M.human[s + 'Toes'];
    if (f != null && t != null) {
      const d = M.restWP[t].clone().sub(M.restWP[f]);
      d.y = 0;
      if (d.lengthSq() > 1e-12) return d.normalize();
    }
  }
  return new THREE.Vector3(0, 0, 1);
}

function buildLimbs() {
  for (const L of M.limbs || []) { scene.remove(L.target); scene.remove(L.pole); }
  M.limbs = [];
  M.partner = null;
  const fwd = modelForward();
  for (const def of LIMBS) {
    const c = M.human[def.parts[2]];
    if (c == null) continue;
    const b = M.human[def.parts[1]] ?? M.parent[c];
    const a = M.human[def.parts[0]] ?? (b >= 0 ? M.parent[b] : -1);
    if (a < 0 || b < 0) continue;
    // 先端が曲げで動く向き: 肘は前、膝は後ろ。ヒンジは付け根の骨の中で固定
    const flex = def.arm ? fwd.clone() : fwd.clone().negate();
    const v = M.restWP[c].clone().sub(M.restWP[b]).normalize();
    let h = v.clone().cross(flex);
    if (h.lengthSq() < 1e-8) h = v.clone().cross(new THREE.Vector3(0, 1, 0));
    h.normalize();
    const hingeInA = h.applyQuaternion(M.restWQ[a].clone().invert());
    const target = new THREE.Object3D();
    const pole = new THREE.Object3D();
    scene.add(target, pole);
    M.limbs.push({ ...def, a, b, c, hingeInA, target, pole });
  }
}

const limbHinge = L => L.hingeInA.clone().applyQuaternion(wq(M.bones[L.a])).normalize();

function syncLimb(L) {
  const C = M.bones[L.c];
  L.target.position.copy(wp(C));
  L.target.quaternion.copy(wq(C));
  L.target.updateMatrixWorld(true);
  L.pole.position.copy(defaultPole(L));
  L.pole.updateMatrixWorld(true);
}
function syncLimbs(except) { if (M) { for (const L of M.limbs) if (L !== except) syncLimb(L); syncLook(); } }

function defaultPole(L) {
  const a = wp(M.bones[L.a]), b = wp(M.bones[L.b]), c = wp(M.bones[L.c]);
  const len = a.distanceTo(b) + b.distanceTo(c);
  const ac = c.clone().sub(a);
  const mid = a.clone().add(ac.clone().multiplyScalar(b.clone().sub(a).dot(ac) / Math.max(1e-12, ac.lengthSq())));
  let dir = b.clone().sub(mid);
  if (dir.length() < len * 0.03) dir = c.clone().sub(b).cross(limbHinge(L)); // まっすぐなら、曲げたときに関節が出る側
  return b.add(dir.normalize().multiplyScalar(len * 0.5));
}

function rotateWorld(o, q) { setWorldQuat(o, q.clone().multiply(wq(o))); }

function solveLimb(L) {
  const A = M.bones[L.a], B = M.bones[L.b], C = M.bones[L.c];
  const t = L.target.position.clone(), p = L.pole.position.clone();
  const endQ = L.target.quaternion.clone();
  const a = wp(A), b = wp(B), c = wp(C);
  const l1 = a.distanceTo(b), l2 = b.distanceTo(c);
  const dist = clamp(t.distanceTo(a), Math.abs(l1 - l2) + (l1 + l2) * 1e-4, (l1 + l2) * 0.9999);

  // ① 肘・膝をヒンジまわりに回して、付け根から先端までの距離を dist にする（3D で正確に）
  const h = limbHinge(L);
  const w = b.clone().sub(a), v = c.clone().sub(b);
  const vPar = h.clone().multiplyScalar(v.dot(h)), vPerp = v.clone().sub(vPar);
  const hxv = h.clone().cross(vPerp);
  const P = w.dot(vPerp), Q = w.dot(hxv);
  const Sv = (dist * dist - w.lengthSq() - v.lengthSq()) / 2 - w.dot(vPar);
  const R0 = Math.hypot(P, Q);
  if (R0 > 1e-12) {
    const phi = Math.atan2(Q, P), ac = Math.acos(clamp(Sv / R0, -1, 1));
    const u = w.clone().normalize();
    let best = null;
    for (let th of [phi + ac, phi - ac]) {
      th = Math.atan2(Math.sin(th), Math.cos(th));
      const vr = v.clone().applyAxisAngle(h, th);
      const flex = Math.atan2(h.dot(u.clone().cross(vr)), u.dot(vr)); // 曲げ（正）か反り（負）か
      const score = (flex >= -1e-3 ? 0 : 10) + Math.abs(th);
      if (!best || score < best.score) best = { th, score };
    }
    rotateWorld(B, new THREE.Quaternion().setFromAxisAngle(h, best.th));
  }
  // ② 付け根から振って、先端を目標へ
  const from = wp(C).sub(a).normalize(), to = t.clone().sub(a).normalize();
  rotateWorld(A, new THREE.Quaternion().setFromUnitVectors(from, to));
  // ③ 付け根→目標の軸まわりにねじって、肘・膝をポールの側へ
  const bp = wp(B).sub(a), pp = p.sub(a);
  bp.sub(to.clone().multiplyScalar(bp.dot(to)));
  pp.sub(to.clone().multiplyScalar(pp.dot(to)));
  if (bp.lengthSq() > 1e-14 && pp.lengthSq() > 1e-14) {
    const ang = Math.atan2(to.dot(bp.clone().cross(pp)), bp.dot(pp));
    rotateWorld(A, new THREE.Quaternion().setFromAxisAngle(to, ang));
  }
  // ④ 手先・足先のワールドの向きは保つ
  setWorldQuat(C, endQ);
  S.edited.add(L.a); S.edited.add(L.b); S.edited.add(L.c);
}

// ================================================================
//  人型の骨の自由度。Unity の Humanoid で表せない回し方（肘の横曲げ、肩や指のねじり、足首の横倒し）は、
//  マッスルにするときに別の骨のねじりに置き換わって、形が変わる。HTML でも同じ範囲に収めておく
// ================================================================

/** 親の骨の元のポーズの向き（ワールド）の逆。ローカルの回転はこの向きで表される。 */
const parentRestInv = i => M.restWQ[i].clone().multiply(M.restQ[i].clone().invert()).invert();
const toParentFrame = (i, v) => v.clone().applyQuaternion(parentRestInv(i)).normalize();

function buildDof() {
  M.dof = new Map();
  M.dofWorld = new Map(); // 確認用: 元のポーズでのワールドの軸
  const H = M.human;
  const dirTo = (i, j) => M.restWP[j].clone().sub(M.restWP[i]);
  const ownDir = i => {
    const c = M.children[i].find(k => M.restWP[k].distanceToSquared(M.restWP[i]) > 1e-10);
    return c != null ? dirTo(i, c) : dirTo(M.parent[i], i);
  };
  const perp = (v, to) => { const t = to.clone().normalize(); return v.clone().sub(t.multiplyScalar(v.dot(t))).normalize(); };
  const set = (i, kind, axisW, hingeW) => {
    M.dof.set(i, { kind, axis: toParentFrame(i, axisW), hinge: hingeW ? toParentFrame(i, hingeW) : null });
    M.dofWorld.set(i, { kind, axis: axisW.clone().normalize(), hinge: hingeW ? hingeW.clone().normalize() : null });
  };
  // 肘・膝: 曲げ（ヒンジ）と骨の軸まわりのねじり
  for (const L of M.limbs) set(L.b, 'hingeTwist', dirTo(L.b, L.c), limbHingeRest(L));
  // Unity が測った軸があれば、それで決める（指などは骨の形からの推測が数度ずれる）
  if (M.unityAxes?.size) {
    for (const s of ['Left', 'Right']) {
      const names = [s + 'Shoulder', s + 'Toes'];
      for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Little']) for (const g of ['Proximal', 'Intermediate', 'Distal']) names.push(s + f + g);
      for (const hn of names) {
        const i = H[hn], ax = i != null ? M.unityAxes.get(i) : null;
        if (!ax) continue;
        if (ax.length === 1) set(i, 'hinge', ownDir(i), ax[0]);
        else if (ax.length === 2) set(i, 'swing', ax[0].clone().cross(ax[1]));
      }
    }
    return;
  }
  for (const s of ['Left', 'Right']) {
    // 肩: ねじれない
    if (H[s + 'Shoulder'] != null) set(H[s + 'Shoulder'], 'swing', ownDir(H[s + 'Shoulder']));
    // つま先: 横の軸（膝と同じ）まわりの曲げだけ
    const toe = H[s + 'Toes'], leg = M.limbs.find(L => L.key === s + 'Foot');
    if (toe != null && leg) set(toe, 'hinge', ownDir(toe), limbHingeRest(leg));
    // 指: 付け根はねじれない、第 2・第 3 関節は曲げだけ。
    // 曲げの軸は、親指以外は指の付け根を結ぶ線、親指は手のひらの法線（どちらも指の向きに直交させる）
    const hand = H[s + 'Hand'], ip = H[s + 'IndexProximal'], lp = H[s + 'LittleProximal'] ?? H[s + 'RingProximal'];
    const knuckles = ip != null && lp != null ? dirTo(lp, ip) : null;
    const palm = hand != null && knuckles ? dirTo(hand, ip).cross(dirTo(hand, lp)) : null;
    for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Little']) {
      const prox = H[s + f + 'Proximal'];
      if (prox != null) set(prox, 'swing', ownDir(prox));
      for (const g of ['Intermediate', 'Distal']) {
        const i = H[s + f + g];
        if (i == null) continue;
        const dir = ownDir(i);
        const base = f === 'Thumb' ? palm : knuckles;
        if (base && base.lengthSq() > 1e-12 && perp(base, dir).lengthSq() > 0.5) set(i, 'hinge', dir, perp(base, dir));
        else set(i, 'swing', dir);
      }
    }
  }
}

function limbHingeRest(L) { return L.hingeInA.clone().applyQuaternion(M.restWQ[L.a]).normalize(); }

/**
 * Unity が測ったマッスルの回転軸（json の axes）を使う。モデルごとにブラウザに覚えておき、次から FBX だけ開いても使う。
 * 軸は元のポーズでのワールドの向き（three.js の向き）。
 */
/**
 * Humanoid の再生で動く骨の位置（playOffset）。Unity の向き・メートルで書かれているので、HTML の向き・単位にしたものを持つ。
 * 覚えておいた物（units が html）はそのまま。
 */
function playOffsetsOf(obj) {
  const po = obj.playOffset;
  if (po && po.units === 'html') return po;
  if (!Array.isArray(po) || !po.length) return null;
  const fit = Array.isArray(obj.rest) ? fitRest(obj) : { ok: false };
  const scale = fit.ok ? fit.scale : 1;
  return { units: 'html', list: po.map(e => ({ bone: e.bone, d: mirrorV(vecOf(e.d)).divideScalar(scale).toArray() })) };
}
/** 骨ごとの、HTML のローカルの位置の足し分。再生した姿の表示（applyUnityView）で足す */
function buildPlayOffsets() {
  M.playOffsets = new Map();
  const po = M.unityInfo?.playOffset;
  if (!po) return;
  for (const e of po.list) {
    const i = M.byName.get(e.bone);
    if (i == null || M.parent[i] < 0 || i === M.hips) continue;
    M.playOffsets.set(i, vecOf(e.d).applyQuaternion(M.restWQ[M.parent[i]].clone().invert()));
  }
}

function setUnityInfo(obj, remember = true) {
  if (!M || !obj || !Array.isArray(obj.axes) || !obj.axes.length) return false;
  const map = new Map();
  for (const e of obj.axes) {
    const i = M.byName.get(e.bone);
    if (i == null || !Array.isArray(e.axes) || e.axes.length < 3) continue;
    const ax = [];
    for (let k = 0; k + 2 < e.axes.length; k += 3) ax.push(new THREE.Vector3(e.axes[k], e.axes[k + 1], e.axes[k + 2]).normalize());
    map.set(i, ax);
  }
  if (map.size < 10) return false;
  M.unityAxes = map;
  M.unityInfo = { axes: obj.axes, twist: obj.twist || null, unityRest: obj.unityRest || null, zeroPose: obj.zeroPose || null, playOffset: playOffsetsOf(obj) };
  buildPlayOffsets();

  // 肘・膝のヒンジも Unity の曲げの軸に（向きの正負は今のヒンジにそろえる）
  for (const L of M.limbs) {
    const ax = map.get(L.b);
    if (!ax || ax.length < 2) continue;
    const bone = M.restWP[L.c].clone().sub(M.restWP[L.b]).normalize();
    const hinge = ax.reduce((best, a) => (Math.abs(a.dot(bone)) < Math.abs(best.dot(bone)) ? a : best)).clone();
    if (hinge.dot(limbHingeRest(L)) < 0) hinge.negate();
    L.hingeInA = hinge.applyQuaternion(M.restWQ[L.a].clone().invert());
  }
  buildDof();
  buildUnityView();
  if (remember) { try { localStorage.setItem('motiontool.model:' + M.name, JSON.stringify(M.unityInfo)); } catch (e) { /* 覚えられなくても動く */ } }
  return true;
}
function loadRememberedInfo() {
  try {
    const t = localStorage.getItem('motiontool.model:' + M.name);
    if (t) return setUnityInfo(JSON.parse(t), false);
  } catch (e) { /* 無ければ推測のまま */ }
  return false;
}

// ================================================================
//  Unity で再生したときの骨の向き（表示のときだけ掛ける。キーや書き出しは回したままの値）
//
//  Humanoid は腕・脚のねじりを上下の骨に分けて持つ（実測）:
//    上の骨（上腕・太もも）のねじり T1 → 上の骨は (1-k1)·T1 だけ回り、残りは肘・膝の所で下の骨に掛かる
//    下の骨と先端のねじりの合計 T2 → 下の骨は (1-k2)·T2、先端（手・足）のワールドの向きは変わらない
//  関節の位置は変わらず、骨の軸まわりの回り方（袖や肌のねじれ方）だけが変わる。
//  指などは元のポーズそのものが Humanoid で表せず、再生すると軸まわりに少し回る（unityRest）。それも表示に入れる
// ================================================================

function buildUnityView() {
  if (!M) return;
  const tw = M.unityInfo?.twist;
  // マッスルが全部 0 の姿を一度骨に掛けて、上腕・太もものローカルの回転を取る
  const zeroLocal = new Map();
  if (M.unityInfo?.zeroPose) {
    const saved = savePose();
    applyRest();
    const list = M.unityInfo.zeroPose.map(e => [M.byName.get(e.bone), e.q]).filter(([i]) => i != null).sort((x, y) => M.depth[x[0]] - M.depth[y[0]]);
    for (const [i, q] of list) setWorldQuat(M.bones[i], new THREE.Quaternion().fromArray(q).multiply(M.restWQ[i]));
    for (const [i] of list) zeroLocal.set(i, M.bones[i].quaternion.clone());
    restorePose(saved);
  }
  for (const L of M.limbs) {
    L.view = null;
    const A = M.bones[L.a], B = M.bones[L.b], C = M.bones[L.c];
    if (B.parent !== A || C.parent !== B) continue; // 間に別の骨があるモデルは、そのまま表示する
    const pick = (i, dir) => {
      const ax = M.unityAxes?.get(i);
      if (!ax) return dir.clone().normalize();
      const best = ax.reduce((x, a) => (Math.abs(a.dot(dir)) > Math.abs(x.dot(dir)) ? a : x));
      return best.clone().multiplyScalar(best.dot(dir) < 0 ? -1 : 1);
    };
    const axisU = pick(L.a, M.restWP[L.b].clone().sub(M.restWP[L.a]));
    const axisL = pick(L.b, M.restWP[L.c].clone().sub(M.restWP[L.b]));
    const hinge = limbHingeRest(L);
    // 先端（手・足）のねじりの軸: Unity が持つ 2 つの軸のどちらでもない向き。腕では前腕の軸と同じ、脚ではすねの軸から少し傾く
    const axC = M.unityAxes?.get(L.c);
    let axisE = axisL.clone();
    if (axC && axC.length === 2) {
      axisE = axC[0].clone().cross(axC[1]).normalize();
      if (axisE.dot(axisL) < 0) axisE.negate();
    }
    L.view = {
      uA: toParentFrame(L.a, axisU), uB: toParentFrame(L.b, axisU), hB: toParentFrame(L.b, hinge),
      lB: toParentFrame(L.b, axisL), lC: toParentFrame(L.c, axisL), mC: toParentFrame(L.c, axisE),
      k1: tw ? tw[L.arm ? 0 : 2] : 0.5, k2: tw ? tw[L.arm ? 1 : 3] : 0.5,
    };
    // 上の骨のねじりを Unity と同じ測り方にする: マッスル 0 の姿から「骨の軸の向きを最短で振った」残りが、ねじり。
    // 元のポーズからの差で測ると、腕のように 0 の姿から大きく振れている骨では、振りの分がねじりに混ざる（数十度）
    const r0 = zeroLocal.get(L.a);
    if (r0) {
      const xl = axisU.clone().applyQuaternion(M.restWQ[L.a].clone().invert()).normalize(); // 骨のローカルでのねじりの軸
      const v = L.view;
      v.r0 = r0;
      v.xl = xl;
      v.z0 = xl.clone().applyQuaternion(r0).normalize();
      v.tauRest = upperTwist(v, M.restQ[L.a]).tau;
    }
  }
  M.lowerView = new Map(M.limbs.filter(L => L.view).map(L => [L.b, L.view]));
  docVer++;
  // 指などは、元のポーズそのものが Humanoid で表せず、再生すると骨の軸まわりに少し回る（親指で 13° など）。
  // その回り（骨のローカルの向きで持つ）を、表示のときに足す。Unity が書いた骨は読み込むときにこの回りを引いておく（unityBonesToRaw）。
  // 「Unity での向きを基準に曲げ直す」方式も試したが、実測ではこちらの方が合った（指先 0.2 mm・0.6° に対し 1.3 mm・1.9°）
  M.restOffset = new Map();
  for (const e of M.unityInfo?.unityRest || []) {
    const i = M.byName.get(e.bone);
    if (i == null || !Array.isArray(e.q)) continue;
    const kw = new THREE.Quaternion().fromArray(e.q);
    M.restOffset.set(i, M.restWQ[i].clone().invert().multiply(kw).multiply(M.restWQ[i]).normalize());
  }
}

/** 骨 i の、表示で足す回り。親の回りは打ち消す（子のワールドの向きが、回りを足した分だけ変わるように）。 */
function restOffsetLocals(inverse) {
  const next = [];
  const parentK = i => { const p = M.parent[i]; return p >= 0 && M.bones[i].parent === M.bones[p] ? M.restOffset.get(p) : null; };
  for (const [i, k] of M.restOffset) {
    const kp = parentK(i);
    // 表示: Kp⁻¹ · q · K。読み込み（逆）: Kp · q · K⁻¹
    const q = inverse ? M.bones[i].quaternion.clone().multiply(k.clone().invert()) : M.bones[i].quaternion.clone().multiply(k);
    if (kp) q.premultiply(inverse ? kp : kp.clone().invert());
    next.push([i, q.normalize()]);
  }
  // 親だけが回る人型の骨は、親の回りを打ち消して向きを保つ
  for (const [i, k] of M.restOffset) {
    for (const c of M.children[i]) {
      if (M.restOffset.has(c) || M.bones[c].parent !== M.bones[i] || !M.humanSet.has(c)) continue;
      next.push([c, (inverse ? k.clone() : k.clone().invert()).multiply(M.bones[c].quaternion).normalize()]);
    }
  }
  return next;
}

/** Unity が書いた骨（再生したときの向き）から、表示で足す回りを引く。 */
function unityBonesToRaw() {
  if (!M.restOffset?.size) return;
  for (const [i, q] of restOffsetLocals(true)) M.bones[i].quaternion.copy(q);
  M.root.updateMatrixWorld(true);
}

const axisAngleQ = (axis, angle) => new THREE.Quaternion().setFromAxisAngle(axis, angle);
/** q を axis まわりのねじりと残りに分けたときの、ねじりの角度（符号つき）。 */
function twistAngle(q, axis) {
  const d = q.x * axis.x + q.y * axis.y + q.z * axis.z;
  let a = 2 * Math.atan2(d, q.w);
  if (a > Math.PI) a -= 2 * Math.PI;
  if (a < -Math.PI) a += 2 * Math.PI;
  return a;
}

/** 上の骨のローカルの回転 q を、Unity と同じく「0 の姿からの最短の振り」と「軸まわりのねじり」に分ける。 */
function upperTwist(v, q) {
  const u = v.xl.clone().applyQuaternion(q).normalize();
  const arc = new THREE.Quaternion().setFromUnitVectors(v.z0, u);
  const rest = arc.clone().invert().multiply(q).multiply(v.r0.clone().invert());
  return { arc, tau: twistAngle(rest, v.z0) };
}

/**
 * 前腕・すねの回し方（元のポーズからの差分 dB）を 3 つの角度に分ける:
 * 上の骨の軸まわり（曲げる面の向き rho）→ ヒンジの曲げ theta → 自分の軸まわりのねじり b。
 */
function lowerAngles(v, dB) {
  const dir = v.lB.clone().applyQuaternion(dB);
  const hl = v.hB.dot(v.lB), hu = v.hB.dot(v.uB);
  const pa = v.lB.dot(v.uB) - hl * hu, pb = v.hB.clone().cross(v.lB).dot(v.uB), pc = dir.dot(v.uB) - hl * hu;
  const pr = Math.hypot(pa, pb);
  let theta = 0;
  if (pr > 1e-9) {
    const base = Math.atan2(pb, pa), ac = Math.acos(clamp(pc / pr, -1, 1));
    const guess = hingeAngle(dB, v.lB, v.hB);
    const wrap = x => Math.atan2(Math.sin(x), Math.cos(x));
    const c1 = wrap(base + ac), c2 = wrap(base - ac);
    theta = Math.abs(c1 - guess) < Math.abs(c2 - guess) ? c1 : c2;
  }
  const e = v.lB.clone().applyAxisAngle(v.hB, theta);
  const ep = e.clone().sub(v.uB.clone().multiplyScalar(e.dot(v.uB))), dp = dir.clone().sub(v.uB.clone().multiplyScalar(dir.dot(v.uB)));
  // まっすぐに近いと曲げる面が決まらない（少しの外れが大きな角度になる）ので、面は回っていないことにする
  const rho = ep.lengthSq() > 3e-3 && dp.lengthSq() > 3e-3 ? Math.atan2(v.uB.dot(ep.clone().cross(dp)), ep.dot(dp)) : 0;
  const rem = axisAngleQ(v.uB, rho).multiply(axisAngleQ(v.hB, theta)).invert().multiply(dB);
  return { rho, theta, b: twistAngle(rem, v.lB) };
}
const lowerQuat = (v, rho, theta, b, rest, out) =>
  out.copy(axisAngleQ(v.uB, rho)).multiply(axisAngleQ(v.hB, theta)).multiply(axisAngleQ(v.lB, b)).multiply(rest).normalize();

/** 腕・脚 1 本の、今の回し方を「上のねじり T1・曲げ・下のねじり T2」に読む。 */
function analyzeLimb(L) {
  const v = L.view;
  const qA = M.bones[L.a].quaternion, qB = M.bones[L.b].quaternion, qC = M.bones[L.c].quaternion;
  const dA = qA.clone().multiply(M.restQ[L.a].clone().invert());
  let sA = swingTwist(dA, v.uA).swing, a = twistAngle(dA, v.uA), arc = null;
  if (v.r0) { const r = upperTwist(v, qA); arc = r.arc; a = r.tau - v.tauRest; }
  const { rho, theta, b } = lowerAngles(v, qB.clone().multiply(M.restQ[L.b].clone().invert()));
  // 先端（手・足）のねじり
  const dC = qC.clone().multiply(M.restQ[L.c].clone().invert());
  const c = twistAngle(dC, v.mC);
  // ねじりの合計は ±180° の範囲で数える（Unity のマッスルと同じ側に取る）
  const wrap = x => Math.atan2(Math.sin(x), Math.cos(x));
  return { sA, arc, theta, t1: wrap(a + rho), t2: wrap(b + c) };
}

/**
 * 骨を Unity で再生したときの向きにする。戻り値を restoreUnityView に渡すと元に戻る。
 * k1・k2 を指定すると、ねじりの分け方を変えられる（確認用）。
 */
function applyUnityView() {
  if (!M || !M.limbs) return null;
  const saved = [];
  const keep = i => saved.push([i, M.bones[i].quaternion.clone(), M.bones[i].position.clone()]);
  for (const L of M.limbs) {
    if (!L.view) continue;
    const v = L.view, A = M.bones[L.a], B = M.bones[L.b], C = M.bones[L.c];
    const r = analyzeLimb(L);
    const qA = (r.arc
      ? r.arc.clone().multiply(axisAngleQ(v.z0, v.tauRest + (1 - v.k1) * r.t1)).multiply(v.r0)
      : r.sA.clone().multiply(axisAngleQ(v.uA, (1 - v.k1) * r.t1)).multiply(M.restQ[L.a])).normalize();
    const qB = axisAngleQ(v.uB, v.k1 * r.t1).multiply(axisAngleQ(v.hB, r.theta)).multiply(axisAngleQ(v.lB, (1 - v.k2) * r.t2)).multiply(M.restQ[L.b]).normalize();
    // 先端のワールドの向きは変えない（実測。足首のねじりの残りを足首の軸で持たせると、かえって 7〜8° ずれた）
    const chain = A.quaternion.clone().multiply(B.quaternion).multiply(C.quaternion);
    const qC = qB.clone().invert().multiply(qA.clone().invert()).multiply(chain).normalize();
    keep(L.a); keep(L.b); keep(L.c);
    A.quaternion.copy(qA); B.quaternion.copy(qB); C.quaternion.copy(qC);
  }
  if (M.restOffset?.size) {
    const changed = new Set(saved.map(x => x[0]));
    for (const [i, q] of restOffsetLocals(false)) {
      if (!changed.has(i)) { keep(i); changed.add(i); }
      M.bones[i].quaternion.copy(q);
    }
  }
  // 再生では骨の位置も少し動く
  if (M.playOffsets?.size) {
    const have = new Set(saved.map(x => x[0]));
    for (const [i, off] of M.playOffsets) {
      if (!have.has(i)) { keep(i); have.add(i); }
      M.bones[i].position.copy(M.restP[i]).add(off);
    }
  }
