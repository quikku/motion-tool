}
function restoreUnityView(saved) {
  if (!saved) return;
  for (const [i, q, p] of saved) { M.bones[i].quaternion.copy(q); M.bones[i].position.copy(p); }
  M.root.updateMatrixWorld(true);
}

function swingTwist(q, axis) {
  const d = q.x * axis.x + q.y * axis.y + q.z * axis.z;
  const twist = new THREE.Quaternion(axis.x * d, axis.y * d, axis.z * d, q.w);
  if (twist.lengthSq() < 1e-12) twist.identity(); else twist.normalize();
  return { swing: q.clone().multiply(twist.clone().invert()), twist };
}

/** 骨の向き（axis の先）を、ヒンジまわりの回転だけで近づけたときの角度。 */
function hingeAngle(delta, axis, hinge) {
  const dir = axis.clone().applyQuaternion(delta);
  dir.sub(hinge.clone().multiplyScalar(dir.dot(hinge)));
  return dir.lengthSq() > 1e-12 ? Math.atan2(hinge.dot(axis.clone().cross(dir)), axis.dot(dir)) : 0;
}

/**
 * 骨のローカルの回転を、その骨の自由度に収める。変えたら true。
 * swing: 骨の軸まわりのねじりを除く / hinge: ヒンジまわりの曲げだけ / hingeTwist: 曲げ＋骨の軸まわりのねじり（反る向きは少しだけ）
 */
function constrainDof(i) {
  const d = M.dof?.get(i);
  if (!d) return false;
  const b = M.bones[i];
  const delta = b.quaternion.clone().multiply(M.restQ[i].clone().invert());
  let out;
  if (d.kind === 'swing') out = swingTwist(delta, d.axis).swing;
  else if (d.kind === 'hinge') out = new THREE.Quaternion().setFromAxisAngle(d.hinge, hingeAngle(delta, d.axis, d.hinge));
  else {
    // 反る向きにはほとんど曲がらないようにする
    const v = M.lowerView?.get(i);
    if (v) {
      // 補間や Unity の読み方と同じ分け方で、曲げとねじりだけを残す（曲げる面は回さない）
      const r = lowerAngles(v, delta);
      out = axisAngleQ(v.hB, clamp(r.theta, -0.09, 2.7)).multiply(axisAngleQ(v.lB, r.b));
    } else {
      const th = clamp(hingeAngle(delta, d.axis, d.hinge), -0.09, 2.7);
      out = new THREE.Quaternion().setFromAxisAngle(d.hinge, th).multiply(swingTwist(delta, d.axis).twist);
    }
  }
  const q = out.multiply(M.restQ[i]).normalize();
  if (Math.abs(q.dot(b.quaternion)) > 1 - 1e-10) return false;
  b.quaternion.copy(q);
  b.updateMatrixWorld(true);
  return true;
}

function isAncestor(i, j) { for (let p = M.parent[j]; p >= 0; p = M.parent[p]) if (p === i) return true; return false; }
function limbOfBone(i) { return M.limbs.find(L => L.a === i || L.b === i || L.c === i); }

// ================================================================
//  キーと補間
// ================================================================

function track(i) {
  let t = D.tracks.get(i);
  if (!t) { t = { keys: [] }; D.tracks.set(i, t); }
  return t;
}

function insertKey(keys, k) {
  const at = keys.findIndex(x => x.f >= k.f);
  if (at < 0) keys.push(k);
  else if (keys[at].f === k.f) keys[at] = k;
  else keys.splice(at, 0, k);
}

function setKey(i, f) {
  const b = M.bones[i];
  insertKey(track(i).keys, { f, q: b.quaternion.clone(), p: hasPos(i) ? b.position.clone() : null });
}

function keyBones(list, shapes = []) {
  if (!M || (!list.length && !shapes.length)) return;
  if (S.falloff) for (const i of list) spreadToNeighbors(i, S.frame);
  for (const i of list) setKey(i, S.frame);
  for (const i of list) S.edited.delete(i);
  for (const id of shapes) {
    insertKey(shapeTrack(id).keys, { f: S.frame, v: shapeValue(id) });
    S.shapeEdited.delete(id);
  }
  docVer++;
  markDirty();
  refreshKeysUI();
}
const keyShapes = ids => keyBones([], ids);

/** 「伝染」の重み。frame から d フレーム離れたキーにどれだけ効かせるか（Blender の Smooth と同じ減り方） */
function falloffWeight(d) {
  const R = S.falloffR;
  if (d >= R) return 0;
  const u = 1 - d / R;
  return u * u * (3 - 2 * u);
}

/**
 * 「伝染」: 骨 i をフレーム f で動かした分（いまの姿 − カーブの値）を、同じ骨の前後のキーにも重みを付けて足す。
 * キーを打つ前に呼ぶ。新しいキーは足さず、既にあるキーだけを動かす（間のフレームはそのキーから補間されてついてくる）。
 * 回転は親の空間での差分を足す。ループのときは、つなぎ目の向こう側のキーも近いとみなす。
 */
function spreadToNeighbors(i, f) {
  const t = D.tracks.get(i);
  if (!t || !t.keys.some(k => k.f !== f)) return;
  const b = M.bones[i];
  const oldQ = new THREE.Quaternion(), oldP = b.position.clone();
  const hadPos = evalTrack(t, M.restQ[i], f, oldQ, oldP, M.lowerView?.get(i));
  const dq = b.quaternion.clone().multiply(oldQ.invert());
  const dp = hadPos ? b.position.clone().sub(oldP) : null;
  if (1 - Math.abs(dq.w) < 1e-10 && (!dp || dp.lengthSq() < 1e-14)) return;
  const I = new THREE.Quaternion(), last = D.frameCount;
  for (const k of t.keys) {
    if (k.f === f || k.f < 0 || k.f > last) continue;
    let d = Math.abs(k.f - f);
    if (D.loop) d = Math.min(d, last - d);
    const w = falloffWeight(d);
    if (w <= 0) continue;
    k.q = I.clone().slerp(dq, w).multiply(k.q).normalize();
    if (dp && k.p) k.p = k.p.clone().addScaledVector(dp, w);
  }
}

/**
 * 実際にカーブにするキー列。0 と最終フレームに前後のキーの値を置く。
 * ループのときは loopKeys（キーが 2 つ以上のとき）。
 */
function effectiveKeys(keys, copy) {
  const last = D.frameCount;
  const ks = keys.filter(k => k.f >= 0 && k.f <= last).map(k => copy(k, k.f, D.interp.get(k.f) ?? 0));
  if (D.loop && ks.length >= 2) return loopKeys(ks, copy, last);
  if (ks.length) {
    if (ks[0].f > 0) ks.unshift(copy(ks[0], 0, 2));
    if (ks[ks.length - 1].f < last) ks.push(copy(ks[ks.length - 1], last, 0));
  }
  return ks;
}

/**
 * ループのキー列。キーが last ごとにくり返すとみなし、前後に 1 周ずらした写しを 2 つずつ置く
 * （写しは 0 より前・last より後ろにはみ出す）。こうすると:
 * - つなぎ目の接線が、ループの反対側のキーまで見て決まる（両端を 0 にしないので、つなぎ目で動きが止まらない）
 * - 最初のキーより前と最後のキーより後ろは、最後のキー → 最初のキーへ補間してつながる
 * 0 と last の両方にキーがあれば、last のキーを 0 のキーの 1 周あととみなす。写しは 1 周ごとに
 * その差（last の値 − 0 の値）だけずらす（shiftLaps）。前へ進み続けるルートの位置でも、つなぎ目の速さがそろう。
 */
function loopKeys(ks, copy, last) {
  const both = ks[0].f === 0 && ks[ks.length - 1].f === last;
  const base = both ? ks.slice(0, -1) : ks, m = base.length;
  const lap = j => {
    const q = Math.floor(j / m), k = base[j - q * m];
    return Object.assign(copy(k, k.f + q * last, k.mode), { lap: q });
  };
  const out = [lap(-2), lap(-1), ...ks, ...(both ? [] : [lap(m)]), lap(m + 1)];
  if (both) { out.lapFrom = 2; out.lapTo = 2 + ks.length - 1; }
  return out;
}

/** loopKeys の写しの値（y は ks とそろった 1 成分の配列）を、1 周ぶんの差だけずらす。 */
function shiftLaps(ks, y) {
  if (ks.lapFrom == null) return y;
  const d = y[ks.lapTo] - y[ks.lapFrom];
  ks.forEach((k, i) => { if (k.lap) y[i] += k.lap * d; });
  return y;
}

/** キーの無いフレーム 0 から次のフレームまでのつなぎ方（1 = 直線、2 = 止める）。ループなら最後のキーから回ってくる区間 */
function startInterp() {
  if (!D.loop) return 2;
  const frames = allKeyFrames();
  return frames.length && D.interp.get(frames[frames.length - 1]) === 2 ? 2 : 1;
}

/**
 * 成分ごとの接線。Unity の ClampedAuto と同じ（実測で確かめた式）:
 * 前後のキーを結ぶ傾きを、4 × min(前との差, 次との差) ÷ 前後のキーの時間差 で抑える。山・谷・平らなところと両端は 0。
 */
function autoTangents(ks, y) {
  const n = ks.length, m = new Array(n).fill(0);
  for (let j = 1; j < n - 1; j++) {
    const a = y[j] - y[j - 1], b = y[j + 1] - y[j];
    if (a * b <= 0) continue;
    const dt = ks[j + 1].f - ks[j - 1].f;
    const s = (y[j + 1] - y[j - 1]) / dt;
    m[j] = Math.sign(s) * Math.min(Math.abs(s), 4 * Math.min(Math.abs(a), Math.abs(b)) / dt);
  }
  return m;
}

/**
 * 回転は「元のポーズからの回し方」を回転ベクトル（軸 × 角度）にして補間する。
 * Unity のマッスルはほぼ角度なので、クォータニオンの成分で補間するより Unity の再生に近い。
 */
function rotVecOf(q, rest) {
  const d = q.clone().multiply(rest.clone().invert());
  if (d.w < 0) d.set(-d.x, -d.y, -d.z, -d.w);
  const s = Math.hypot(d.x, d.y, d.z);
  if (s < 1e-12) return [0, 0, 0];
  const k = 2 * Math.atan2(s, d.w) / s;
  return [d.x * k, d.y * k, d.z * k];
}
function quatOfRotVec(x, y, z, rest, out) {
  const a = Math.hypot(x, y, z);
  if (a < 1e-12) return out.copy(rest);
  const k = Math.sin(a / 2) / a;
  return out.set(x * k, y * k, z * k, Math.cos(a / 2)).multiply(rest).normalize();
}

/**
 * lower: 前腕・すねのとき、その腕・脚の view。回転ベクトルの代わりに「面の向き・曲げ・ねじり」の 3 つの角度で補間する。
 * 回転ベクトルで補間すると、キーの間で前腕が曲げの面からわずかに外れ、肘がまっすぐに近いときに
 * Unity がそれを上腕の大きなねじりとして読む（数十度）。
 */
function prepTrack(t, rest, lower) {
  if (t.ver === docVer) return t.cache;
  const ks = effectiveKeys(t.keys, (k, f, mode) => ({ f, q: k.q.clone(), p: k.p ? k.p.clone() : null, mode }));
  let rv;
  if (lower) {
    rv = ks.map(k => { const r = lowerAngles(lower, k.q.clone().multiply(rest.clone().invert())); return [r.rho, r.theta, r.b]; });
    // 角度は前のキーから近い側へ（±360° の取り方）
    for (let i = 1; i < rv.length; i++) for (const c of [0, 2]) {
      while (rv[i][c] - rv[i - 1][c] > Math.PI) rv[i][c] -= 2 * Math.PI;
      while (rv[i][c] - rv[i - 1][c] < -Math.PI) rv[i][c] += 2 * Math.PI;
    }
  } else {
    rv = ks.map(k => rotVecOf(k.q, rest));
    // 180° をまたぐときは、前のキーに近い側の表し方にそろえる
    for (let i = 1; i < rv.length; i++) {
      const a = Math.hypot(...rv[i]);
      if (a < 1e-9) continue;
      const alt = rv[i].map(v => v * (1 - 2 * Math.PI / a));
      const d0 = rv[i].reduce((s, v, c) => s + (v - rv[i - 1][c]) ** 2, 0), d1 = alt.reduce((s, v, c) => s + (v - rv[i - 1][c]) ** 2, 0);
      if (d1 < d0) rv[i] = alt;
    }
  }
  const vals = [], tans = [];
  for (let c = 0; c < 6; c++) {
    const y = shiftLaps(ks, ks.map((k, i) => c < 3 ? rv[i][c] : (k.p ? k.p.toArray()[c - 3] : 0)));
    vals.push(y);
    tans.push(autoTangents(ks, y));
  }
  t.cache = { ks, vals, tans, rest };
  t.ver = docVer;
  return t.cache;
}

/** f を含む区間の始まりのキー。前なら -1、後ろなら最後のキー。 */
function segmentAt(ks, f) {
  const n = ks.length;
  if (f <= ks[0].f) return -1;
  if (f >= ks[n - 1].f) return n - 1;
  let i = 0;
  while (i < n - 2 && ks[i + 1].f <= f) i++;
  return i;
}
const hermite = (u, dt, y0, m0, y1, m1) => {
  const u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * dt * m0 + (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * dt * m1;
};

/** f は小数でもよい（再生中）。 */
function evalTrack(t, rest, f, outQ, outP, lower) {
  const { ks, vals, tans } = prepTrack(t, rest, lower);
  const n = ks.length;
  if (!n) return false;
  const i = segmentAt(ks, f);
  if (i < 0 || i >= n - 1) {
    const k = ks[Math.max(0, i)];
    outQ.copy(k.q);
    if (k.p && outP) outP.copy(k.p);
    return !!k.p;
  }
  const k0 = ks[i], k1 = ks[i + 1];
  const dt = k1.f - k0.f, u = (f - k0.f) / dt;
  let e;
  if (k0.mode === 2) {
    outQ.copy(k0.q);
    if (k0.p && outP) outP.copy(k0.p);
    return !!k0.p;
  }
  if (k0.mode === 1) e = c => vals[c][i] + (vals[c][i + 1] - vals[c][i]) * u;
  else e = c => hermite(u, dt, vals[c][i], tans[c][i], vals[c][i + 1], tans[c][i + 1]);
  if (lower) lowerQuat(lower, e(0), e(1), e(2), rest, outQ);
  else quatOfRotVec(e(0), e(1), e(2), rest, outQ);
  if (k0.p && outP) outP.set(e(3), e(4), e(5));
  return !!k0.p;
}

// ---------- シェイプキー（値は Unity と同じ 0〜100） ----------

function shapeTrack(id) {
  let t = D.shapes.get(id);
  if (!t) { t = { keys: [] }; D.shapes.set(id, t); }
  return t;
}
function shapeValue(id) {
  const s = M.shapeById.get(id);
  return s ? s.mesh.morphTargetInfluences[s.idx] * 100 : 0;
}
function setShapeValue(id, v) {
  const s = M.shapeById.get(id);
  if (s) s.mesh.morphTargetInfluences[s.idx] = clamp(v, -100, 200) / 100;
}
function prepShape(t) {
  if (t.ver === docVer) return t.cache;
  const ks = effectiveKeys(t.keys, (k, f, mode) => ({ f, v: k.v, mode }));
  const y = shiftLaps(ks, ks.map(k => k.v));
  t.cache = { ks, y, m: autoTangents(ks, y) };
  t.ver = docVer;
  return t.cache;
}
function evalShape(t, f) {
  const { ks, y, m } = prepShape(t);
  const n = ks.length;
  if (!n) return 0;
  const i = segmentAt(ks, f);
  if (i < 0 || i >= n - 1) return ks[Math.max(0, i)].v;
  const k0 = ks[i], k1 = ks[i + 1], dt = k1.f - k0.f, u = (f - k0.f) / dt;
  if (k0.mode === 2) return k0.v;
  if (k0.mode === 1) return k0.v + (k1.v - k0.v) * u;
  return hermite(u, dt, y[i], m[i], y[i + 1], m[i + 1]);
}

/** 骨とシェイプをキーのとおりにする（キーの無いものは元のまま）。breath: 呼吸の揺れも足す（再生と保存だけ） */
function poseAt(f, breath = false) {
  for (let i = 0; i < M.bones.length; i++) {
    const b = M.bones[i], t = D.tracks.get(i);
    if (t && t.keys.length) {
      if (!evalTrack(t, M.restQ[i], f, b.quaternion, b.position, M.lowerView?.get(i))) b.position.copy(M.restP[i]);
    } else {
      b.quaternion.copy(M.restQ[i]);
      b.position.copy(M.restP[i]);
    }
  }
  for (const s of M.shapes) {
    const t = D.shapes.get(s.id);
    s.mesh.morphTargetInfluences[s.idx] = (t && t.keys.length ? evalShape(t, f) : M.shapeBase?.get(s.id) ?? 0) / 100;
  }
  M.root.updateMatrixWorld(true);
  if (breath) applyBreath(f);
}

function applyRest() {
  M.bones.forEach((b, i) => { b.quaternion.copy(M.restQ[i]); b.position.copy(M.restP[i]); });
  M.root.updateMatrixWorld(true);
}

function savePose() {
  const s = M.bones.map(b => [b.quaternion.clone(), b.position.clone()]);
  s.shapes = M.shapes.map(x => x.mesh.morphTargetInfluences[x.idx]);
  return s;
}
function restorePose(s) {
  M.bones.forEach((b, i) => { b.quaternion.copy(s[i][0]); b.position.copy(s[i][1]); });
  if (s.shapes) M.shapes.forEach((x, k) => { x.mesh.morphTargetInfluences[x.idx] = s.shapes[k]; });
  M.root.updateMatrixWorld(true);
}

function goFrame(f) {
  S.frame = clamp(Math.round(f), 0, D.frameCount);
  if (!M) { refreshKeysUI(); return; }
  poseAt(S.frame);
  S.edited.clear();
  S.shapeEdited.clear();
  syncLimbs();
  updateOnion();
  refreshKeysUI();
  videoFollow();
}

function allKeyFrames() {
  const set = new Set();
  for (const t of D.tracks.values()) for (const k of t.keys) set.add(k.f);
  for (const t of D.shapes.values()) for (const k of t.keys) set.add(k.f);
  return [...set].sort((a, b) => a - b);
}
const hasKeys = () => [...D.tracks.values(), ...D.shapes.values()].some(t => t.keys.length);

// ================================================================
//  取り消し
// ================================================================

const undoStack = [], redoStack = [];
function snapshot() {
  return {
    doc: {
      name: D.name, fps: D.fps, frameCount: D.frameCount, loop: D.loop,
      tracks: [...D.tracks].map(([i, t]) => [i, t.keys.map(k => ({ f: k.f, q: k.q.clone(), p: k.p ? k.p.clone() : null }))]),
      shapes: [...D.shapes].map(([id, t]) => [id, t.keys.map(k => ({ ...k }))]),
      interp: [...D.interp],
    },
    pose: M ? savePose() : null, edited: [...S.edited], shapeEdited: [...S.shapeEdited], frame: S.frame,
  };
}
function restoreSnapshot(s) {
  Object.assign(D, { name: s.doc.name, fps: s.doc.fps, frameCount: s.doc.frameCount, loop: s.doc.loop });
  D.tracks = new Map(s.doc.tracks.map(([i, keys]) => [i, { keys: keys.map(k => ({ f: k.f, q: k.q.clone(), p: k.p ? k.p.clone() : null })) }]));
  D.shapes = new Map(s.doc.shapes.map(([id, keys]) => [id, { keys: keys.map(k => ({ ...k })) }]));
  D.interp = new Map(s.doc.interp);
  docVer++;
  S.frame = s.frame;
  if (M && s.pose) restorePose(s.pose);
  S.edited = new Set(s.edited);
  S.shapeEdited = new Set(s.shapeEdited);
  syncLimbs();
  updateOnion();
  refreshAll();
}
function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > 200) undoStack.shift();
  redoStack.length = 0;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restoreSnapshot(undoStack.pop());
  markDirty();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restoreSnapshot(redoStack.pop());
  markDirty();
}

// ================================================================
//  選択と操作
// ================================================================

function select(sel) {
  S.sel = sel;
  attachGizmo();
  refreshBoneListSel();
  const i = selectedBone();
  if (i >= 0) tlReveal('b' + i);
  drawTimeline();
}

function attachGizmo() {
  gizmo.detach();
  if (!M || !S.sel || S.playing) return;
  if (S.sel.kind === 'bone') {
    const i = S.sel.i;
    const movable = hasPos(i);
    gizmo.setMode(S.mode === 'translate' && movable ? 'translate' : 'rotate');
    gizmo.attach(M.bones[i]);
  } else if (S.sel.kind === 'ik') {
    gizmo.setMode(S.mode);
    gizmo.attach(M.limbs[S.sel.limb].target);
  } else if (S.sel.kind === 'pole') {
    gizmo.setMode('translate');
    gizmo.attach(M.limbs[S.sel.limb].pole);
  } else if (S.sel.kind === 'look') {
    gizmo.setMode('translate');
    gizmo.attach(LOOK.target);
  }
  // ルートはいつもワールドの向きで動かす（ルートのローカルの軸はFBXのArmatureの軸で、寝ていることがある）
  gizmo.setSpace(S.sel.kind === 'bone' && S.sel.i === M.rootBone ? 'world' : S.space);
}

function selectedBone() {
  if (!S.sel || !M) return -1;
  if (S.sel.kind === 'bone') return S.sel.i;
  if (S.sel.kind === 'look') return M.human.Head ?? -1;
  return M.limbs[S.sel.limb]?.c ?? -1;
}

gizmo.addEventListener('mouseDown', () => { pushUndo(); });
gizmo.addEventListener('objectChange', () => {
  if (!M || !S.sel) return;
  if (S.sel.kind === 'bone') {
    const i = S.sel.i;
    S.edited.add(i);
    constrainBone(i);
    M.bones[i].updateMatrixWorld(true);
    mirrorBoneEdit(i);
    syncLook();
    const own = limbOfBone(i);
    for (const L of M.limbs) {
      if (L === own) continue;
      if (S.ik && S.pin && isAncestor(i, L.a)) solveLimb(L);
      else syncLimb(L);
    }
    if (own) syncLimb(own);
  } else if (S.sel.kind === 'look') {
    solveLook();
  } else {
    solveLimb(M.limbs[S.sel.limb]);
    mirrorLimbEdit(M.limbs[S.sel.limb]);
  }
  updateUnkeyed();
});
gizmo.addEventListener('mouseUp', () => {
  if (S.autoKey && S.edited.size) keyBones([...S.edited]);
  else { refreshKeysUI(); if (S.edited.size) markDirty(); }
});

// ---------- 骨の丸・線・IK の印 ----------

function circleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(16, 16, 12, 0, Math.PI * 2);
  g.fillStyle = '#fff'; g.fill();
  g.lineWidth = 4; g.strokeStyle = '#000'; g.stroke();
  return new THREE.CanvasTexture(c);
}
const circleTex = circleTexture();
const MK = { points: null, lines: null, handles: null, poleLines: null, list: [], hlist: [] };
const onion = { prev: null, next: null };

function overlayMaterial(opts) { return Object.assign(opts, { depthTest: false, depthWrite: false, transparent: true }); }

function buildMarkers() {
  for (const k of ['points', 'lines', 'handles', 'poleLines']) if (MK[k]) { scene.remove(MK[k]); MK[k].geometry.dispose(); }
  const mkPoints = (n, size, map) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    const p = new THREE.Points(g, new THREE.PointsMaterial(overlayMaterial({ size, sizeAttenuation: false, vertexColors: true, map, alphaTest: map ? 0.5 : 0 })));
    p.renderOrder = 1000;
    p.frustumCulled = false;
    scene.add(p);
    return p;
  };
  const mkLines = (n, color, opacity) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
    const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial(overlayMaterial({ color, opacity })));
    l.renderOrder = 999;
    l.frustumCulled = false;
    scene.add(l);
    return l;
  };
  const n = M.bones.length;
  MK.points = mkPoints(n, 11, circleTex);
  MK.lines = mkLines(n, 0xc8d0e0, 0.45);
  MK.handles = mkPoints(10, 13, null);
  MK.poleLines = mkLines(5, 0x9fd0ff, 0.5);
  for (const k of ['prev', 'next']) {
    if (onion[k]) { scene.remove(onion[k]); onion[k].geometry.dispose(); }
    onion[k] = mkLines(n, k === 'prev' ? 0xff5a4f : 0x5fd06a, 0.8);
    onion[k].visible = false;
  }
}

function boneShown(i) {
  if (S.boneView === 'none' || i === M.rootBone) return false;
  if (S.ik && M.limbs.some(L => L.c === i)) return false;
  return S.boneView === 'all' || M.humanSet.has(i);
}

const _v = new THREE.Vector3();
function updateMarkers() {
  if (!M || !MK.points) return;
  const shown = [];
  for (let i = 0; i < M.bones.length; i++) if (boneShown(i)) shown.push(i);
  MK.list = shown;
  const pos = MK.points.geometry.attributes.position, col = MK.points.geometry.attributes.color;
  const selB = S.sel?.kind === 'bone' ? S.sel.i : -1;
  shown.forEach((i, k) => {
    M.bones[i].getWorldPosition(_v);
    pos.setXYZ(k, _v.x, _v.y, _v.z);
    const c = i === selB ? [1, 0.54, 0.24] : S.edited.has(i) ? [1, 0.85, 0.3] : M.humanSet.has(i) ? [0.92, 0.94, 1] : [0.55, 0.62, 0.75];
    col.setXYZ(k, c[0], c[1], c[2]);
  });
  MK.points.geometry.setDrawRange(0, shown.length);
  pos.needsUpdate = col.needsUpdate = true;

  const lp = MK.lines.geometry.attributes.position;
  const m = fillSkeleton(lp, S.boneView);
  MK.lines.geometry.setDrawRange(0, m);
  lp.needsUpdate = true;

  // IK: 四角 = 手先・足先、丸 = ポール（肘・膝の向き）
  const hp = MK.handles.geometry.attributes.position, hc = MK.handles.geometry.attributes.color;
  const plp = MK.poleLines.geometry.attributes.position;
  MK.hlist = [];
  let pl = 0;
  if (S.ik) {
    M.limbs.forEach((L, li) => {
      const selT = S.sel?.kind === 'ik' && S.sel.limb === li, selP = S.sel?.kind === 'pole' && S.sel.limb === li;
      let k = MK.hlist.length;
      hp.setXYZ(k, L.target.position.x, L.target.position.y, L.target.position.z);
      hc.setXYZ(k, ...(selT ? [1, 0.54, 0.24] : [0.35, 0.8, 1]));
      MK.hlist.push({ kind: 'ik', limb: li });
      k++;
      hp.setXYZ(k, L.pole.position.x, L.pole.position.y, L.pole.position.z);
      hc.setXYZ(k, ...(selP ? [1, 0.54, 0.24] : [0.55, 0.55, 0.9]));
      MK.hlist.push({ kind: 'pole', limb: li });
      M.bones[L.b].getWorldPosition(_v);
      plp.setXYZ(pl++, _v.x, _v.y, _v.z);
      plp.setXYZ(pl++, L.pole.position.x, L.pole.position.y, L.pole.position.z);
    });
    // 桃色 = 頭の向きの的
    if (M.human.Head != null) {
      const k = MK.hlist.length;
      hp.setXYZ(k, LOOK.target.position.x, LOOK.target.position.y, LOOK.target.position.z);
      hc.setXYZ(k, ...(S.sel?.kind === 'look' ? [1, 0.54, 0.24] : [0.95, 0.6, 0.9]));
      MK.hlist.push({ kind: 'look' });
      const e = eyePos();
      plp.setXYZ(pl++, e.x, e.y, e.z);
      plp.setXYZ(pl++, LOOK.target.position.x, LOOK.target.position.y, LOOK.target.position.z);
    }
  }
  // 緑の四角 = ルート
  if (M.rootBone >= 0 && S.boneView !== 'none') {
    M.bones[M.rootBone].getWorldPosition(_v);
    hp.setXYZ(MK.hlist.length, _v.x, _v.y, _v.z);
    hc.setXYZ(MK.hlist.length, ...(S.sel?.kind === 'bone' && S.sel.i === M.rootBone ? [1, 0.54, 0.24] : S.edited.has(M.rootBone) ? [1, 0.85, 0.3] : [0.4, 0.9, 0.5]));
    MK.hlist.push({ kind: 'bone', i: M.rootBone });
  }
  MK.handles.geometry.setDrawRange(0, MK.hlist.length);
  hp.needsUpdate = hc.needsUpdate = true;
  MK.poleLines.geometry.setDrawRange(0, pl);
  plp.needsUpdate = true;
}

/** 骨の線（親 → 子）。人型の表示では、人型の骨どうしを、間の骨を飛ばしてつなぐ。 */
function fillSkeleton(attr, viewMode) {
  let m = 0;
  if (viewMode === 'none') return 0;
  for (let i = 0; i < M.bones.length; i++) {
    let p = M.parent[i];
    if (viewMode === 'human') {
      if (!M.humanSet.has(i)) continue;
      while (p >= 0 && !M.humanSet.has(p)) p = M.parent[p];
    }
    if (p < 0) continue;
    M.bones[p].getWorldPosition(_v); attr.setXYZ(m++, _v.x, _v.y, _v.z);
    M.bones[i].getWorldPosition(_v); attr.setXYZ(m++, _v.x, _v.y, _v.z);
  }
  return m;
}

function updateOnion() {
  if (!M || !onion.prev) return;
  onion.prev.visible = onion.next.visible = false;
  if (!S.onion) return;
  const frames = allKeyFrames();
  const prev = [...frames].reverse().find(f => f < S.frame), next = frames.find(f => f > S.frame);
  const saved = savePose();
  for (const [f, obj] of [[prev, onion.prev], [next, onion.next]]) {
    if (f == null) continue;
    poseAt(f);
    const lp = obj.geometry.attributes.position;
    const m = fillSkeleton(lp, S.boneView === 'none' ? 'human' : S.boneView);
    obj.geometry.setDrawRange(0, m);
    lp.needsUpdate = true;
    obj.visible = true;
  }
  restorePose(saved);
}

// ---------- クリックで選ぶ ----------

const raycaster = new THREE.Raycaster();
let press = null;
/**
 * ギズモより先に見る（capture）。押した所に骨の点・IK の的があれば、ギズモを休ませてクリックで選べるようにする。
 * 回転のギズモは輪の内側全体が「自由に回す」の当たりなので、そのままだと内側の骨が選べない。
 * 今選んでいる物そのものの上なら、今まで通りギズモで回す。
 */
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !M || S.playing || !gizmo.object) return;
  const r = renderer.domElement.getBoundingClientRect();
  if (gizmo.axis && gizmo.axis !== 'XYZE') return; // 軸の矢印・輪の上は、今まで通りギズモが取る
  const hit = markerAt(e.clientX - r.left, e.clientY - r.top);
  if (!hit || sameSel(hit, S.sel)) return;
  gizmo.enabled = false;
  const back = () => { gizmo.enabled = true; window.removeEventListener('pointerup', back); window.removeEventListener('pointercancel', back); };
  window.addEventListener('pointerup', back);
  window.addEventListener('pointercancel', back);
}, { capture: true });
renderer.domElement.addEventListener('pointerdown', e => {
  // 輪の内側（自由に回す）を動かさずに離したときは、回したことにせず下の物を選ぶ
  press = { x: e.clientX, y: e.clientY, gizmo: gizmo.enabled && gizmo.axis !== null && gizmo.axis !== 'XYZE', button: e.button };
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('pointerup', e => {
  // 右クリック（動かさずに離した）: メッシュを隠すメニュー
  if (press && press.button === 2 && Math.hypot(e.clientX - press.x, e.clientY - press.y) <= 4) { press = null; meshMenu(e); return; }
  if (!press || press.button !== 0) { press = null; return; }
  const moved = Math.hypot(e.clientX - press.x, e.clientY - press.y);
  const usedGizmo = press.gizmo;
  press = null;
  if (moved > 4 || usedGizmo || !M || S.playing) return;
  const r = renderer.domElement.getBoundingClientRect();
  pick(e.clientX - r.left, e.clientY - r.top);
});

function screenOf(p, r) {
  _v.copy(p).project(camera);
  return { x: (_v.x + 1) / 2 * r.width, y: (1 - _v.y) / 2 * r.height, z: _v.z };
}

const sameSel = (a, b) => !!a && !!b && a.kind === b.kind && a.i === b.i && a.limb === b.limb;

/** 画面の (x, y) の近くにある骨の点・IK の的（無ければ null） */
function markerAt(x, y) {
  const r = renderer.domElement.getBoundingClientRect();
  let best = null;
  const tryHit = (p, sel, radius) => {
    const s = screenOf(p, r);
    if (s.z > 1) return;
    const d = Math.hypot(s.x - x, s.y - y);
    if (d <= radius && (!best || d < best.d)) best = { d, sel };
  };
  if (S.ik) M.limbs.forEach((L, li) => { tryHit(L.target.position, { kind: 'ik', limb: li }, 10); tryHit(L.pole.position, { kind: 'pole', limb: li }, 9); });
  if (S.ik && M.human.Head != null) tryHit(LOOK.target.position, { kind: 'look' }, 10);
  if (M.rootBone >= 0 && S.boneView !== 'none') tryHit(wp(M.bones[M.rootBone]), { kind: 'bone', i: M.rootBone }, 10);
  if (!best) for (const i of MK.list) tryHit(wp(M.bones[i]), { kind: 'bone', i }, 9);
  return best ? best.sel : null;
}

function pick(x, y) {
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(x / r.width * 2 - 1, -(y / r.height) * 2 + 1), camera);
  if (S.contactPick != null) { pickContact(); return; }
  const hit = markerAt(x, y);
  if (hit) { select(hit); return; }

  // 体をクリック: その点をいちばん動かしている骨
  const meshes = M.meshes.filter(m => m.visible);
  for (const m of meshes) if (m.isSkinnedMesh) { m.boundingSphere = null; m.boundingBox = null; }
  const hits = raycaster.intersectObjects(meshes, false);
  // 相手役の体をクリックしたら、動かすほうを入れ替えてその骨を選ぶ（半透明のときは、後ろの今のアバターを優先）
  if (P.M && P.show) {
    const other = P.M.meshes.filter(m => m.visible);
    for (const m of other) if (m.isSkinnedMesh) { m.boundingSphere = null; m.boundingBox = null; }
    const h = raycaster.intersectObjects(other, false)[0];
    if (h && (!hits.length || (!P.ghost && h.distance < hits[0].distance))) {
      switchActor();
      const i = boneAtHit(h);
      if (i >= 0) select({ kind: 'bone', i });
      return;
    }
  }
  for (const h of hits) {
    const i = boneAtHit(h);
    if (i < 0) continue;
    const L = S.ik ? M.limbs.findIndex(l => l.c === i) : -1;
    select(L >= 0 ? { kind: 'ik', limb: L } : { kind: 'bone', i });
    return;
  }
}

function boneAtHit(h) {
  const m = h.object;
  if (!m.isSkinnedMesh || !h.face) return -1;
  const si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight;
  if (!si || !sw) return -1;
  const bc = h.barycoord || new THREE.Vector3(1 / 3, 1 / 3, 1 / 3);
  const acc = new Map();
  [[h.face.a, bc.x], [h.face.b, bc.y], [h.face.c, bc.z]].forEach(([vi, bw]) => {
    for (let k = 0; k < 4; k++) {
      const w = sw.array[vi * sw.itemSize + k] * bw;
      if (!(w > 0)) continue;
      let b = m.skeleton.bones[si.array[vi * si.itemSize + k]];
      while (b && !M.index.has(b)) b = b.parent;
      if (!b) continue;
      let i = M.index.get(b);
      if (S.boneView === 'human') while (i >= 0 && !M.humanSet.has(i)) i = M.parent[i];
      if (i >= 0) acc.set(i, (acc.get(i) || 0) + w);
    }
  });
  let best = -1, bw = 0;
  for (const [i, w] of acc) if (w > bw) { bw = w; best = i; }
  return best;
}

function focusSelected() {
  if (!M) return;
  const i = selectedBone();
  const p = S.sel?.kind === 'ik' ? M.limbs[S.sel.limb].target.position.clone() : i >= 0 ? wp(M.bones[i]) : null;
  if (!p) { frameCamera(); return; }
  // その骨から先（人型の骨）が収まる距離
  let extent = M.size * 0.08;
  if (i >= 0) {
    const stack = [i];
    while (stack.length) {
      const j = stack.pop();
      if (M.humanSet.has(j) || j === i) extent = Math.max(extent, wp(M.bones[j]).distanceTo(p));
      stack.push(...M.children[j]);
    }
  }
  const off = camera.position.clone().sub(orbit.target);
  const dist = Math.min(M.size * 2.6, extent * 3.2);
  orbit.target.copy(p);
  camera.position.copy(p).add(off.setLength(dist));
  orbit.update();
}

// ================================================================
//  ポーズ（コピー・ミラー）。回転は「元のポーズからのワールドの差分」で扱う
// ================================================================

const deltaOf = i => wq(M.bones[i]).multiply(M.restWQ[i].clone().invert());
/** 親の差分を除いた、その骨だけの回し方（元のポーズの向きで表す）。左右対称な元のポーズなら X の反転でミラーできる。 */
function ownDeltas() {
  const G = M.bones.map((_, i) => deltaOf(i));
  return G.map((g, i) => (M.parent[i] >= 0 ? G[M.parent[i]].clone().invert() : new THREE.Quaternion()).multiply(g));
}
/** own（骨ごと）から、親から順にポーズを組む。hipsDelta はワールドの位置の差分。 */
function applyOwnDeltas(own, hipsDelta) {
  const G = [];
  for (let i = 0; i < M.bones.length; i++) {
    const g = (M.parent[i] >= 0 ? G[M.parent[i]].clone() : new THREE.Quaternion()).multiply(own[i]);
    G.push(g);
    setWorldQuat(M.bones[i], g.clone().multiply(M.restWQ[i]));
    if (i === M.hips && hipsDelta) setWorldPos(M.bones[i], M.restWP[i].clone().add(hipsDelta));
  }
}
const hipsDelta = () => wp(M.bones[M.hips]).sub(M.restWP[M.hips]);
/** ルートを、ワールドの位置 p の左右を入れ替えた所へ置く。 */
function mirrorRootPos(p) {
  if (M.rootBone < 0) return;
  setWorldPos(M.bones[M.rootBone], mirrorV(p));
  M.root.updateMatrixWorld(true);
}

function changedBones(before) {
  const out = [];
  M.bones.forEach((b, i) => {
    if (Math.abs(b.quaternion.dot(before[i][0])) < 1 - 1e-9 || b.position.distanceToSquared(before[i][1]) > 1e-12) out.push(i);
  });
  return out;
}

function afterPoseOp(before) {
  const ch = changedBones(before);
  ch.forEach(i => S.edited.add(i));
  syncLimbs();
  if (S.autoKey && ch.length) keyBones(ch);
  else { refreshKeysUI(); markDirty(); }
}

/** mode: 'all' 全身反転 / 'L2R' 左を右へ / 'R2L' 右を左へ / 'sel' 選んだ骨を反対側へ */
function mirrorPose(mode) {
  if (!M) return;
  const sel = selectedBone();
  if (mode === 'sel' && sel < 0) { setStatus('骨を選んでください'); return; }
  pushUndo();
  const before = savePose();
  const own = ownDeltas();
  const out = own.map(q => q.clone());
  let hd = hipsDelta();
  M.bones.forEach((_, i) => {
    const side = sideOf(M.names[i]), j = partnerOf(i);
    if (mode === 'all') out[i] = mirrorQ(own[j]);
    else if (mode === 'L2R' && side === 'Right' && j !== i) out[i] = mirrorQ(own[j]);
    else if (mode === 'R2L' && side === 'Left' && j !== i) out[i] = mirrorQ(own[j]);
  });
  if (mode === 'sel') {
    const j = partnerOf(sel);
    out[j] = mirrorQ(own[sel]);
  }
  if (mode === 'all') { hd = mirrorV(hd); mirrorRootPos(wp(M.bones[Math.max(0, M.rootBone)])); }
  applyOwnDeltas(out, hd);
  afterPoseOp(before);
  setStatus({ all: '全身を反転', L2R: '左を右へ', R2L: '右を左へ', sel: `${M.names[sel]} → ${M.names[partnerOf(sel)]}` }[mode]);
}

let clipboard = null;
function copyPose() {
  if (!M) return;
  const one = S.sel?.kind === 'bone' ? S.sel.i : -1;
  const idx = one >= 0 ? [one] : M.bones.map((_, i) => i);
  clipboard = {
    whole: one < 0,
    items: idx.map(i => ({ name: M.names[i], q: M.bones[i].quaternion.clone(), p: M.bones[i].position.clone() })),
    own: one < 0 ? ownDeltas() : null, hips: one < 0 ? hipsDelta() : null, model: M.name,
    rootPos: one < 0 && M.rootBone >= 0 ? wp(M.bones[M.rootBone]) : null,
  };
  lastCopy = 'pose';
  setStatus(one >= 0 ? `${M.names[one]}をコピー` : '全身をコピー');
}
function pastePose(mirror) {
  if (!M || !clipboard) return;
  pushUndo();
  const before = savePose();
  if (mirror && clipboard.whole && clipboard.model === M.name) {
    if (clipboard.rootPos) mirrorRootPos(clipboard.rootPos);
    applyOwnDeltas(M.bones.map((_, i) => mirrorQ(clipboard.own[partnerOf(i)])), mirrorV(clipboard.hips));
  } else {
    for (const it of clipboard.items) {
      const i = M.byName.get(it.name);
      if (i == null) continue;
      M.bones[i].quaternion.copy(it.q);
      if (hasPos(i)) M.bones[i].position.copy(it.p);
    }
    M.root.updateMatrixWorld(true);
  }
  afterPoseOp(before);
}

// ================================================================
//  キーの操作。キー列は「b骨の番号」「sシェイプの番号」で指す
// ================================================================

const allHumanOrAll = () => (M.humanSet.size >= 10 ? [...M.humanSet] : M.bones.map((_, i) => i)).sort((a, b) => a - b);

function trackOfRef(ref) {
  if (ref[0] === 'b') return D.tracks.get(Number(ref.slice(1)));
  const s = M.shapes[Number(ref.slice(1))];
  return s ? D.shapes.get(s.id) : null;
}
function dropIfEmpty(ref) {
  const t = trackOfRef(ref);
  if (t && !t.keys.length) {
    if (ref[0] === 'b') D.tracks.delete(Number(ref.slice(1)));
    else D.shapes.delete(M.shapes[Number(ref.slice(1))].id);
  }
}
function allRefs() {
  return [...[...D.tracks.keys()].map(i => 'b' + i), ...[...D.shapes.keys()].map(id => 's' + M.shapeIndex.get(id))];
}
const selectedShapeRef = () => (S.shapeSel != null && M.shapeIndex.has(S.shapeSel) ? 's' + M.shapeIndex.get(S.shapeSel) : null);

function keySelected() {
  if (!M) return;
  const shapes = [...S.shapeEdited];
  if (S.tab === 'shapes' && S.shapeSel && !shapes.includes(S.shapeSel)) shapes.push(S.shapeSel);
  const i = selectedBone();
  let bones = [...S.edited];
  if (S.sel?.kind === 'ik' || S.sel?.kind === 'pole') { const L = M.limbs[S.sel.limb]; bones.push(L.a, L.b, L.c); }
  else if (S.sel?.kind === 'look') bones.push(...[M.human.Neck, M.human.Head].filter(b => b != null));
  else if (i >= 0 && S.tab === 'bones') bones.push(i);
  bones = [...new Set(bones)];
  if (!bones.length && !shapes.length) { setStatus('骨かシェイプを選んでください'); return; }
  pushUndo();
  keyBones(bones, shapes);
}
/** 今見えているポーズ（キーの間でも）をそのままキーにする。人型の骨全部と、キーのある骨・シェイプ、動かした骨・シェイプ。 */
function keyAll() {
  if (!M) return;
  pushUndo();
  const keyed = [...D.tracks].filter(([, t]) => t.keys.length).map(([i]) => i);
  keyBones([...new Set([...allHumanOrAll(), ...keyed, ...S.edited])], [...new Set([...D.shapes.keys(), ...S.shapeEdited])]);
}

/** 選んだキー（タイムライン）→ [キー列, フレーム] の一覧。全体の行のキーは、そのフレームの全部のキー列。 */
function expandSel(sel = TL.sel) {
  const out = [];
  for (const id of sel) {
    const at = id.lastIndexOf(':');
    const ref = id.slice(0, at), f = Number(id.slice(at + 1));
    if (ref === 'all') { for (const r of allRefs()) if (trackOfRef(r)?.keys.some(k => k.f === f)) out.push([r, f]); }
    else out.push([ref, f]);
  }
  return out;
}

function deleteKeys() {
  if (!M) return;
  let list = expandSel();
  if (!list.length) {
    const i = selectedBone();
    if (i >= 0 && D.tracks.get(i)?.keys.some(k => k.f === S.frame)) list.push(['b' + i, S.frame]);
    const sr = selectedShapeRef();
    if (S.tab === 'shapes' && sr && trackOfRef(sr)?.keys.some(k => k.f === S.frame)) list.push([sr, S.frame]);
  }
  if (!list.length) return;
  pushUndo();
  for (const [ref, f] of list) {
    const t = trackOfRef(ref);
    if (!t) continue;
    t.keys = t.keys.filter(k => k.f !== f);
    dropIfEmpty(ref);
  }
  const left = new Set(allKeyFrames());
  for (const f of [...D.interp.keys()]) if (!left.has(f)) D.interp.delete(f);
  TL.sel.clear();
  docVer++;
  markDirty();
  goFrame(S.frame);
}

function moveKeys(delta) {
  const list = expandSel();
  if (!list.length || !delta) return;
  pushUndo();
  const moving = new Map();
  for (const [ref, f] of list) {
    const t = trackOfRef(ref);
    const k = t?.keys.find(x => x.f === f);
    if (!k) continue;
    t.keys = t.keys.filter(x => x !== k);
    if (!moving.has(ref)) moving.set(ref, []);
    moving.get(ref).push(k);
  }
  const frames = new Set(list.map(([, f]) => f));
  const wholeFrames = [...TL.sel].filter(id => id.startsWith('all:')).map(id => Number(id.slice(4)));
  const interpMoved = wholeFrames.map(f => [f, D.interp.get(f)]).filter(([, m]) => m != null);
  for (const f of wholeFrames) D.interp.delete(f);
  for (const [ref, ks] of moving) {
    const t = trackOfRef(ref);
    for (const k of ks) {
      k.f = Math.max(0, k.f + delta);
      t.keys = t.keys.filter(x => x.f !== k.f);
      t.keys.push(k);
    }
    t.keys.sort((a, b) => a.f - b.f);
  }
  for (const [f, m] of interpMoved) D.interp.set(Math.max(0, f + delta), m);
  TL.sel = new Set([...TL.sel].map(id => {
    const at = id.lastIndexOf(':');
    return `${id.slice(0, at)}:${Math.max(0, Number(id.slice(at + 1)) + delta)}`;
  }));
  docVer++;
  markDirty();
  if (frames.has(S.frame)) S.frame = Math.max(0, S.frame + delta);
  goFrame(S.frame);
}

function setInterp(mode) {
  let frames = [...new Set(expandSel().map(([, f]) => f))];
  if (!frames.length) frames = [S.frame];
  pushUndo();
  for (const f of frames) { if (mode === 0) D.interp.delete(f); else D.interp.set(f, mode); }
  docVer++;
  markDirty();
  goFrame(S.frame);
}

function jumpKey(dir) {
  const frames = allKeyFrames();
  const f = dir < 0 ? [...frames].reverse().find(x => x < S.frame) : frames.find(x => x > S.frame);
  if (f != null) goFrame(f);
}

// ================================================================
//  タイムライン（Blockbench に寄せた形）
//  キーのある骨・シェイプごとに行を出す。目盛りでフレーム移動、何もない所のドラッグで範囲選択、選んだキーはまとめて動かす
// ================================================================

const TL = { el: $('tl'), left: 190, rulerH: 22, rowH: 20, start: 0, ppf: 8, fit: true, sel: new Set(), drag: null, rows: [], scrollY: 0, maxScroll: 0, hoverPlus: -1, hoverEnd: false };
const MODE_NAMES = ['Auto', 'Linear', 'Constant'];
const PLUS_W = 26, END_W = 9;

/** 全体・キーのある骨（階層の順）・キーのあるシェイプ。選んでいる骨とシェイプは、キーが無くても出す。 */
function tlRows() {
  const rows = [{ label: '全体', ref: 'all' }];
  if (!M) return rows;
  const sel = selectedBone();
  const bones = new Set([...D.tracks].filter(([, t]) => t.keys.length).map(([i]) => i));
  if (sel >= 0) bones.add(sel);
  const rootFirst = i => (i === M.rootBone ? -1 : i);
  for (const i of [...bones].sort((a, b) => rootFirst(a) - rootFirst(b))) rows.push({ label: M.names[i], ref: 'b' + i, bone: i, selected: i === sel });
  const shapes = new Set([...D.shapes].filter(([, t]) => t.keys.length).map(([id]) => id));
  if (S.shapeSel != null) shapes.add(S.shapeSel);
  for (const id of [...shapes].filter(v => M.shapeIndex.has(v)).sort((a, b) => M.shapeIndex.get(a) - M.shapeIndex.get(b)))
    rows.push({ label: M.shapes[M.shapeIndex.get(id)].name, ref: 's' + M.shapeIndex.get(id), shape: id, selected: id === S.shapeSel });
  return rows;
}
const fx = f => TL.left + (f - TL.start) * TL.ppf;
const xf = x => (x - TL.left) / TL.ppf + TL.start;
// 全体の行は目盛りのすぐ下に止めておき、その下の行だけ縦に流す
const tlHeadH = () => TL.rulerH + TL.rowH;
const rowY = r => (r === 0 ? TL.rulerH : tlHeadH() + (r - 1) * TL.rowH - TL.scrollY);
const rowAt = y => (y < TL.rulerH ? -1 : y < tlHeadH() ? 0 : 1 + Math.floor((y - tlHeadH() + TL.scrollY) / TL.rowH));
const rowShown = (r, h) => r === 0 || (rowY(r) + TL.rowH > tlHeadH() && rowY(r) < h);

function tlFit() {
  const w = TL.el.clientWidth - TL.left - 24;
  TL.ppf = Math.max(0.5, w / Math.max(1, D.frameCount));
  TL.start = -0.5 * 8 / TL.ppf;
}

function rowKeys(row) {
  if (row.ref === 'all') return allKeyFrames();
  return (trackOfRef(row.ref)?.keys || []).map(k => k.f);
}

/** その行が見える所まで縦に流す。 */
function tlReveal(ref) {
  const idx = tlRows().findIndex(r => r.ref === ref);
  if (idx < 1) return;
  const area = TL.el.clientHeight - tlHeadH();
  const y = (idx - 1) * TL.rowH;
  if (y < TL.scrollY) TL.scrollY = y;
  else if (y + TL.rowH > TL.scrollY + area) TL.scrollY = y + TL.rowH - area;
}

function drawTimeline() {
  const c = TL.el, dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  if (TL.fit) tlFit();
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#202226'; g.fillRect(0, 0, w, h);
  TL.rows = tlRows();
  const headH = tlHeadH();
  TL.maxScroll = Math.max(0, (TL.rows.length - 1) * TL.rowH - (h - headH));
  TL.scrollY = clamp(TL.scrollY, 0, TL.maxScroll);
  g.textBaseline = 'middle';

  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  const step = steps.find(s => s * TL.ppf >= 42) || 1000;
  const f0 = Math.max(0, Math.floor(xf(TL.left))), f1 = Math.ceil(xf(w));
  const drag = TL.drag?.type === 'key' ? TL.drag.delta : 0;
  const endX = fx(D.frameCount), startX = fx(0);
  const pairTicks = pairKeyTicks();

  const drawRow = (row, r) => {
    const y = rowY(r);
    // キーの側
    g.fillStyle = row.selected ? '#2a3442' : r === 0 ? '#2a2c31' : r % 2 ? '#23252a' : '#26282d';
    g.fillRect(TL.left, y, w - TL.left, TL.rowH);
    g.fillStyle = 'rgba(0,0,0,.3)';
    if (endX < w) g.fillRect(Math.max(TL.left, endX), y, w - Math.max(TL.left, endX), TL.rowH);
    if (startX > TL.left) g.fillRect(TL.left, y, startX - TL.left, TL.rowH);
    g.strokeStyle = '#34373e';
    for (let f = f0 - (f0 % step); f <= f1; f += step) {
      const x = Math.round(fx(f)) + 0.5;
      if (x > TL.left) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + TL.rowH); g.stroke(); }
    }
    g.save(); g.beginPath(); g.rect(TL.left, y, w - TL.left, TL.rowH); g.clip();
    // 「伝染」の効く範囲
    if (S.falloff) {
      const a = Math.round(fx(S.frame - S.falloffR)) + 0.5, z = Math.round(fx(S.frame + S.falloffR)) + 0.5;
      g.fillStyle = 'rgba(255,170,60,.08)';
      g.fillRect(a, y, z - a, TL.rowH);
      // 枠: 左右の端は行ごとに引いてつなげ、上下は一番上と一番下の行だけ
      g.strokeStyle = 'rgba(255,170,60,.7)';
      g.beginPath();
      g.moveTo(a, y); g.lineTo(a, y + TL.rowH); g.moveTo(z, y); g.lineTo(z, y + TL.rowH);
      if (r === 0) { g.moveTo(a, y + 0.5); g.lineTo(z, y + 0.5); }
      if (r === TL.rows.length - 1) { g.moveTo(a, y + TL.rowH - 0.5); g.lineTo(z, y + TL.rowH - 0.5); }
      g.stroke();
    }
    // 全体の行に、相手役のキーの時刻を細い線で出す（タイミングを合わせる目安）
    if (r === 0 && pairTicks.length) {
      g.strokeStyle = 'rgba(170,150,255,.75)';
      g.beginPath();
      for (const f of pairTicks) { const x = Math.round(fx(f)) + 0.5; g.moveTo(x, y + 1); g.lineTo(x, y + 6); }
      g.stroke();
    }
    for (const f of rowKeys(row)) {
      const sel = TL.sel.has(`${row.ref}:${f}`) || (r > 0 && TL.sel.has(`all:${f}`));
      const x = fx(f + (sel ? drag : 0));
      if (x < TL.left - 7 || x > w + 7) continue;
      drawKeyShape(g, x, y + TL.rowH / 2, D.interp.get(f) ?? 0, sel, r === 0);
    }
    g.restore();
    // 名前の側
    g.fillStyle = row.selected ? '#2b4666' : r === 0 ? '#2a2c31' : '#25272b';
    g.fillRect(0, y, TL.left, TL.rowH);
    g.font = '11px system-ui, "Yu Gothic UI", sans-serif';
    g.fillStyle = r === 0 ? '#9aa0aa' : row.ref[0] === 's' ? '#b9e0c0' : '#e8eaee';
    g.save(); g.beginPath(); g.rect(0, y, TL.left - PLUS_W, TL.rowH); g.clip();
    g.fillText(row.label, 8, y + TL.rowH / 2 + 0.5); g.restore();
    // ＋: この行の今のフレームにキーを打つ
    const px = TL.left - PLUS_W / 2, py = y + TL.rowH / 2;
    g.strokeStyle = TL.hoverPlus === r ? '#fff' : '#8a8f99'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(px - 4.5, py); g.lineTo(px + 4.5, py); g.moveTo(px, py - 4.5); g.lineTo(px, py + 4.5); g.stroke(); g.lineWidth = 1;
  };

  // 縦に流れる行（全体の行より下にだけ描く）
  g.save();
  g.beginPath(); g.rect(0, headH, w, h - headH); g.clip();
  TL.rows.forEach((row, r) => { if (r > 0 && rowShown(r, h)) drawRow(row, r); });
  g.restore();
  drawRow(TL.rows[0], 0);
  g.fillStyle = '#1b1c1f'; g.fillRect(0, headH - 1, w, 1);

  // 範囲選択の枠
  if (TL.drag?.type === 'box') {
    const b = TL.drag;
    const bx = Math.max(TL.left, Math.min(b.x0, b.x1)), by = Math.max(TL.rulerH, Math.min(b.y0, b.y1));
    const bw = Math.max(b.x0, b.x1) - bx, bh = Math.max(b.y0, b.y1) - by;
    g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(bx, by, bw, bh);
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.strokeRect(Math.round(bx) + 0.5, Math.round(by) + 0.5, Math.round(bw), Math.round(bh));
  }

  // 目盛り
  g.fillStyle = '#2f3136'; g.fillRect(0, 0, w, TL.rulerH);
  g.font = '10px system-ui, sans-serif';
  for (let f = f0; f <= f1; f++) {
    const x = Math.round(fx(f)) + 0.5;
    if (x < TL.left) continue;
    if (f % step === 0) {
      g.strokeStyle = '#5a5f69'; g.beginPath(); g.moveTo(x, 12); g.lineTo(x, TL.rulerH); g.stroke();
      g.fillStyle = '#b0b5bf'; g.fillText(String(f), x + 3, 8);
    } else if (TL.ppf >= 5) {
      g.strokeStyle = '#454952'; g.beginPath(); g.moveTo(x, 17); g.lineTo(x, TL.rulerH); g.stroke();
    }
  }
  // 終わりの印（つまんで長さを変える）
  if (endX >= TL.left && endX < w) {
    g.fillStyle = TL.drag?.type === 'end' || TL.hoverEnd ? '#fff' : '#8a8f99';
    g.fillRect(Math.round(endX), 3, 2, TL.rulerH - 6);
    g.fillRect(Math.round(endX), TL.rulerH - 11, END_W, 8);
  }
  g.fillStyle = '#2f3136'; g.fillRect(0, 0, TL.left, TL.rulerH);
  g.fillStyle = '#1b1c1f'; g.fillRect(TL.left - 1, 0, 1, h); g.fillRect(0, TL.rulerH - 1, w, 1);

  // 今のフレーム
  const cx = Math.round(fx(S.frame)) + 0.5;
  if (cx >= TL.left) {
    g.strokeStyle = '#ff8a3d'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx, TL.rulerH - 4); g.lineTo(cx, h); g.stroke(); g.lineWidth = 1;
    g.fillStyle = '#ff8a3d';
    g.beginPath(); g.moveTo(cx - 6, 9); g.lineTo(cx + 6, 9); g.lineTo(cx + 6, 14); g.lineTo(cx, TL.rulerH - 1); g.lineTo(cx - 6, 14); g.closePath(); g.fill();
  }
  // 縦の位置
  if (TL.maxScroll > 0) {
    const area = h - headH, bar = Math.max(18, area * area / ((TL.rows.length - 1) * TL.rowH));
    g.fillStyle = 'rgba(255,255,255,.25)';
    g.fillRect(w - 5, headH + (area - bar) * TL.scrollY / TL.maxScroll, 3, bar);
  }
}

/** 丸 = Auto、ひし形 = Linear、四角 = Constant。 */
function drawKeyShape(g, x, y, mode, sel, summary) {
  g.fillStyle = sel ? '#ff8a3d' : summary ? '#a88a3f' : '#e2b340';
  g.strokeStyle = sel ? '#fff' : '#111';
  g.beginPath();
  if (mode === 1) { g.moveTo(x, y - 6); g.lineTo(x + 6, y); g.lineTo(x, y + 6); g.lineTo(x - 6, y); g.closePath(); }
  else if (mode === 2) g.rect(x - 4.5, y - 4.5, 9, 9);
  else g.arc(x, y, 5, 0, Math.PI * 2);
  g.fill(); g.stroke();
}

function tlHit(x, y) {
  const r = rowAt(y);
  if (r < 0 || r >= TL.rows.length || x < TL.left - 6) return null;
  const row = TL.rows[r];
  let best = null;
  for (const f of rowKeys(row)) {
    const d = Math.abs(fx(f) - x);
    if (d <= 7 && (!best || d < best.d)) best = { d, id: `${row.ref}:${f}`, f, row };
  }
  return best;
}
const tlKeySelected = hit => TL.sel.has(hit.id) || (hit.row.ref !== 'all' && TL.sel.has(`all:${hit.f}`));
const tlOnEnd = (x, y) => y < TL.rulerH && x >= TL.left && x >= fx(D.frameCount) && x <= fx(D.frameCount) + END_W + 2;

/** その行の今のフレームにキーを打つ。 */
function keyRow(row) {
  if (!M) return;
  if (row.ref === 'all') { keyAll(); return; }
  pushUndo();
  if (row.bone != null) keyBones([row.bone]);
  else keyShapes([row.shape]);
}
function selectRow(row) {
  if (row.bone != null) { if (S.tab === 'shapes') setTab('bones'); select({ kind: 'bone', i: row.bone }); }
  else if (row.shape != null) { if (S.tab !== 'shapes') setTab('shapes'); selectShape(row.shape); }
}

const tlPos = e => { const r = TL.el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

TL.el.addEventListener('pointerdown', e => {
  if (!M) return;
  const { x, y } = tlPos(e);
  if (e.button === 1) { TL.drag = { type: 'pan', x0: x, y0: y, s0: TL.start, sy0: TL.scrollY }; TL.el.setPointerCapture(e.pointerId); return; }
  if (e.button !== 0) return;
  const r = rowAt(y);
  // 名前の列: ＋ でキー、名前で骨・シェイプを選ぶ
  if (x < TL.left) {
    if (r >= 0 && r < TL.rows.length) { if (x >= TL.left - PLUS_W) keyRow(TL.rows[r]); else selectRow(TL.rows[r]); }
    return;
  }
  TL.el.setPointerCapture(e.pointerId);
  // 目盛り: 終わりの印は長さ、それ以外はフレーム移動
  if (y < TL.rulerH) {
    if (tlOnEnd(x, y)) { pushUndo(); TL.drag = { type: 'end', from: D.frameCount }; }
    else { TL.drag = { type: 'scrub' }; if (S.playing) stopPlay(); goFrame(xf(x)); }
    drawTimeline();
    return;
  }
  const add = e.shiftKey || e.ctrlKey || e.metaKey;
  const hit = tlHit(x, y);
  if (hit) {
    let single = false;
    if (add) { if (TL.sel.has(hit.id)) TL.sel.delete(hit.id); else TL.sel.add(hit.id); }
    else if (!tlKeySelected(hit)) { TL.sel.clear(); TL.sel.add(hit.id); }
    else single = true; // 動かさずに離したら、このキーだけにする
    TL.drag = { type: 'key', x0: x, delta: 0, hit, single, add };
  } else {
    // 何もない所: ドラッグで範囲選択。クリックだけなら選択を外す
    TL.drag = { type: 'box', x0: x, y0: y, x1: x, y1: y, base: new Set(add ? TL.sel : []) };
    if (!add) TL.sel.clear();
  }
  drawTimeline();
});
TL.el.addEventListener('pointermove', e => {
  const { x, y } = tlPos(e);
  const d = TL.drag;
  if (!d) {
    const r = rowAt(y);
    const plus = x < TL.left && x >= TL.left - PLUS_W && r >= 0 && r < TL.rows.length ? r : -1;
    const end = tlOnEnd(x, y);
    if (plus !== TL.hoverPlus || end !== TL.hoverEnd) { TL.hoverPlus = plus; TL.hoverEnd = end; drawTimeline(); }
    TL.el.style.cursor = end ? 'ew-resize' : x < TL.left && r >= 0 && r < TL.rows.length ? 'pointer' : 'default';
    return;
  }
  if (d.type === 'scrub') { const f = clamp(Math.round(xf(x)), 0, D.frameCount); if (f !== S.frame) goFrame(f); }
  else if (d.type === 'end') {
    const n = Math.max(1, Math.round(xf(x - END_W / 2)));
    if (n !== D.frameCount) { D.frameCount = n; docVer++; TL.fit = false; $('frames').value = n; goFrame(Math.min(S.frame, n)); }
  }
  else if (d.type === 'key') { d.delta = Math.round((x - d.x0) / TL.ppf); drawTimeline(); }
  else if (d.type === 'pan') { TL.fit = false; TL.start = d.s0 - (x - d.x0) / TL.ppf; TL.scrollY = d.sy0 - (y - d.y0); drawTimeline(); }
  else if (d.type === 'box') {
    d.x1 = x; d.y1 = y;
    TL.sel = new Set(d.base);
    const xa = Math.min(d.x0, d.x1), xb = Math.max(d.x0, d.x1), ya = Math.min(d.y0, d.y1), yb = Math.max(d.y0, d.y1);
    if (xb - xa > 2 || yb - ya > 2) {
      const h = TL.el.clientHeight;
      TL.rows.forEach((row, r) => {
        const cy = rowY(r) + TL.rowH / 2;
        if (cy < ya || cy > yb || !rowShown(r, h) || (r > 0 && cy < tlHeadH())) return;
        for (const f of rowKeys(row)) { const kx = fx(f); if (kx >= xa - 3 && kx <= xb + 3) TL.sel.add(`${row.ref}:${f}`); }
      });
    }
    drawTimeline();
  }
});
function tlEndDrag(cancel) {
  const d = TL.drag;
  TL.drag = null;
  if (!d) return;
  if (d.type === 'key' && !cancel) {
    if (d.delta) moveKeys(d.delta);
    else {
      if (d.single) { TL.sel.clear(); TL.sel.add(d.hit.id); }
      if (!d.add) goFrame(d.hit.f);
    }
  } else if (d.type === 'end') {
    if (D.frameCount === d.from) undoStack.pop();
    else { markDirty(); refreshAll(); }
  }
  drawTimeline();
}
TL.el.addEventListener('pointerup', () => tlEndDrag(false));
TL.el.addEventListener('pointercancel', () => tlEndDrag(true));
TL.el.addEventListener('pointerleave', () => { if (TL.hoverPlus !== -1 || TL.hoverEnd) { TL.hoverPlus = -1; TL.hoverEnd = false; drawTimeline(); } });
TL.el.addEventListener('wheel', e => {
  e.preventDefault();
  const { x, y } = tlPos(e);
  if (e.shiftKey) { TL.fit = false; TL.start += (e.deltaY || e.deltaX) / TL.ppf * 0.5; }
  else if (e.ctrlKey || e.metaKey || e.altKey || y < TL.rulerH) {
    // カーソルの位置を中心に拡大
    const ax = Math.max(x, TL.left), f = xf(ax);
    TL.fit = false;
    TL.ppf = clamp(TL.ppf * (e.deltaY < 0 ? 1.2 : 1 / 1.2), 0.3, 80);
    TL.start = f - (ax - TL.left) / TL.ppf;
  } else TL.scrollY += Math.sign(e.deltaY) * TL.rowH * 2;
  drawTimeline();
}, { passive: false });
TL.el.addEventListener('dblclick', e => {
  if (!M) return;
  const { x, y } = tlPos(e);
  if (x < TL.left) return;
  if (y < TL.rulerH) { TL.fit = true; drawTimeline(); return; }
  // 行の何もない所: そのフレームにキーを打つ
  const r = rowAt(y);
  if (r < 0 || r >= TL.rows.length || tlHit(x, y)) return;
  goFrame(xf(x));
  keyRow(TL.rows[r]);
});
TL.el.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!M) return;
  const { x, y } = tlPos(e);
  if (x < TL.left || y < TL.rulerH) return;
  const hit = tlHit(x, y);
  if (hit && !tlKeySelected(hit)) { TL.sel.clear(); TL.sel.add(hit.id); drawTimeline(); }
  const items = [];
  const paste = keyClip ? [['貼り付け' + keyHint('paste'), pasteKeys]] : [];
  if (hit) items.push(['コピー' + keyHint('copy'), copyKeys], ...paste, null, ...MODE_NAMES.map((n, m) => [n, () => setInterp(m)]), null, ['削除' + keyHint('deleteKey'), deleteKeys]);
  else items.push(...paste);
  if (items.length) showMenu(e.clientX, e.clientY, items);
});

// ---------- キーのコピー・貼り付け ----------

let keyClip = null;
/** 最後にコピーしたのがキーかポーズか。貼り付けはそちらを貼る。 */
let lastCopy = 'pose';

function copyKeys() {
  if (!M) return;
  const seen = new Set(), items = [];
  let minF = Infinity;
  for (const [ref, f] of expandSel()) {
    if (seen.has(`${ref}:${f}`)) continue;
    seen.add(`${ref}:${f}`);
    const k = trackOfRef(ref)?.keys.find(v => v.f === f);
    if (!k) continue;
    minF = Math.min(minF, f);
    items.push(ref[0] === 'b'
      ? { bone: M.names[Number(ref.slice(1))], f, q: k.q.clone(), p: k.p ? k.p.clone() : null }
      : { shape: M.shapes[Number(ref.slice(1))].id, f, v: k.v });
  }
  if (!items.length) return;
  keyClip = { items, minF, interp: [...new Set(items.map(it => it.f))].map(f => [f - minF, D.interp.get(f) ?? 0]) };
  lastCopy = 'keys';
  setStatus(`キー${items.length}個をコピー`);
}

/** コピーしたキーを、いちばん早いキーが今のフレームに来るように貼る。 */
function pasteKeys() {
  if (!M || !keyClip) return;
  pushUndo();
  TL.sel.clear();
  for (const it of keyClip.items) {
    const f = S.frame + it.f - keyClip.minF;
    if (it.bone != null) {
      const i = M.byName.get(it.bone);
      if (i == null) continue;
      insertKey(track(i).keys, { f, q: it.q.clone(), p: hasPos(i) ? (it.p ? it.p.clone() : M.bones[i].position.clone()) : null });
      TL.sel.add(`b${i}:${f}`);
    } else if (M.shapeIndex.has(it.shape)) {
      insertKey(shapeTrack(it.shape).keys, { f, v: it.v });
      TL.sel.add(`s${M.shapeIndex.get(it.shape)}:${f}`);
    }
  }
  for (const [df, m] of keyClip.interp) if (m) D.interp.set(S.frame + df, m);
  docVer++;
  markDirty();
  goFrame(S.frame);
}

// ---------- 高さ（上の縁をドラッグ。ブラウザが覚える） ----------

(() => {
  const wrap = $('tlwrap'), handle = $('tlresize');
  try { const h = Number(localStorage.getItem('motiontool.tlHeight')); if (h >= 64) wrap.style.height = h + 'px'; } catch (e) { /* 覚えていなければ初期の高さ */ }
  let from = null;
  handle.addEventListener('pointerdown', e => { from = { y: e.clientY, h: wrap.clientHeight }; handle.setPointerCapture(e.pointerId); });
  handle.addEventListener('pointermove', e => {
    if (!from) return;
    wrap.style.height = clamp(from.h + (from.y - e.clientY), 64, Math.round(window.innerHeight * 0.7)) + 'px';
    resize();
  });
  handle.addEventListener('pointerup', () => {
    if (!from) return;
    from = null;
    try { localStorage.setItem('motiontool.tlHeight', String(wrap.clientHeight)); } catch (e) { /* 覚えられなくても動く */ }
  });
})();

// ================================================================
//  骨の一覧
// ================================================================

const collapsed = new Set();
function buildBoneList() {
  const list = $('bones');
  list.innerHTML = '';
  collapsed.clear();
  // 人型でない骨の枝（髪・スカートなど）は閉じておく
  M.bones.forEach((_, i) => { if (!M.humanSet.has(i) && M.children[i].length && i !== M.rootBone) collapsed.add(i); });
  M.rows = M.bones.map((b, i) => {
    const row = document.createElement('div');
    row.className = 'bone' + (M.humanSet.has(i) ? ' human' : '');
    row.style.paddingLeft = (2 + M.depth[i] * 10) + 'px';
    const tw = document.createElement('span');
    tw.className = 'tw';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = M.names[i];
    const kd = document.createElement('span');
    kd.className = 'kd';
    kd.textContent = '◆';
    row.append(tw, nm, kd);
    tw.addEventListener('click', e => {
      e.stopPropagation();
      if (collapsed.has(i)) collapsed.delete(i); else collapsed.add(i);
      refreshBoneListVisibility();
    });
    row.addEventListener('click', () => select({ kind: 'bone', i }));
    row.addEventListener('dblclick', () => focusSelected());
    list.appendChild(row);
    return { row, tw };
  });
  refreshBoneListVisibility();
  refreshBoneListKeys();
}


/** 「骨: 人型」のときは人型の骨だけを並べる（間の骨を飛ばした木）。それ以外は全部の骨の木。 */
function refreshBoneListVisibility() {
  if (!M?.rows) return;
  const q = S.tab === 'bones' ? $('filter').value.trim().toLowerCase() : '';
  const humanOnly = S.boneView === 'human' && M.humanSet.size >= 10;
  M.rows.forEach(({ row, tw }, i) => {
    let show;
    if (q) show = M.names[i].toLowerCase().includes(q);
    else if (humanOnly) show = M.humanSet.has(i) || i === M.rootBone;
    else { show = true; for (let p = M.parent[i]; p >= 0; p = M.parent[p]) if (collapsed.has(p)) { show = false; break; } }
    row.style.display = show ? '' : 'none';
    let depth = M.depth[i];
    if (humanOnly) { depth = 0; for (let p = M.parent[i]; p >= 0; p = M.parent[p]) if (M.humanSet.has(p)) depth++; }
    row.style.paddingLeft = (2 + depth * 10) + 'px';
    tw.textContent = !humanOnly && M.children[i].length ? (collapsed.has(i) ? '▸' : '▾') : '';
  });
}

function refreshBoneListSel() {
  if (!M?.rows) return;
  const s = selectedBone();
  M.rows.forEach(({ row }, i) => row.classList.toggle('sel', i === s));
  if (s >= 0) {
    // 閉じた枝の中なら開く
    let changed = false;
    for (let p = M.parent[s]; p >= 0; p = M.parent[p]) if (collapsed.delete(p)) changed = true;
    if (changed) refreshBoneListVisibility();
    M.rows[s].row.scrollIntoView({ block: 'nearest' });
  }
}

function refreshBoneListKeys() {
  if (!M?.rows) return;
  M.rows.forEach(({ row }, i) => {
    const t = D.tracks.get(i);
    row.classList.toggle('keyed', !!t?.keys.length);
    row.classList.toggle('keynow', !!t?.keys.some(k => k.f === S.frame));
  });
}
$('filter').addEventListener('input', () => (S.tab === 'shapes' ? refreshShapeListVisibility() : S.tab === 'meshes' ? refreshMeshList() : refreshBoneListVisibility()));

// ================================================================
//  シェイプキーの一覧
// ================================================================

const openMeshes = new Set();
function buildShapeList() {
  const list = $('shapes');
  list.innerHTML = '';
  openMeshes.clear();
  M.shapeRows = [];
  M.meshRows = [];
  const byMesh = new Map();
  for (const s of M.shapes) {
    if (!byMesh.has(s.path)) byMesh.set(s.path, []);
    byMesh.get(s.path).push(s);
  }
  if (!byMesh.size) { list.innerHTML = '<div class="mesh">シェイプキーはありません</div>'; return; }
  // いちばんシェイプの多いメッシュ（たいてい顔）だけ開いておく
  let biggest = null;
  for (const [p, arr] of byMesh) if (!biggest || arr.length > byMesh.get(biggest).length) biggest = p;
  openMeshes.add(biggest);
  for (const [path, arr] of byMesh) {
    const head = document.createElement('div');
    head.className = 'mesh';
    const tw = document.createElement('span');
    tw.className = 'tw';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = `${path}（${arr.length}）`;
    head.append(tw, nm);
    head.onclick = () => { if (openMeshes.has(path)) openMeshes.delete(path); else openMeshes.add(path); refreshShapeListVisibility(); };
    list.appendChild(head);
    M.meshRows.push({ path, head, tw });
    for (const s of arr) {
      const row = document.createElement('div');
      row.className = 'shape';
      const sn = document.createElement('span');
      sn.className = 'nm';
      sn.textContent = s.name;
      sn.title = s.name;
      const sl = document.createElement('input');
      sl.type = 'range'; sl.min = 0; sl.max = 100; sl.step = 1; sl.value = 0;
      const val = document.createElement('span');
      val.className = 'val';
      const kd = document.createElement('span');
      kd.className = 'kd';
      kd.textContent = '◆';
      row.append(sn, sl, val, kd);
      row.addEventListener('click', e => { if (e.target !== sl) selectShape(s.id); });
      let pushed = false;
      sl.addEventListener('input', () => {
        if (!pushed) { pushUndo(); pushed = true; }
        setShapeValue(s.id, Number(sl.value));
        S.shapeEdited.add(s.id);
        if (S.shapeSel !== s.id) selectShape(s.id);
        refreshShapeValues();
        updateUnkeyed();
      });
      sl.addEventListener('change', () => {
        pushed = false;
        if (S.autoKey) keyShapes([s.id]);
        else markDirty();
      });
      list.appendChild(row);
      M.shapeRows.push({ s, row, sl, val, last: null });
    }
  }
  refreshShapeListVisibility();
}

function refreshShapeListVisibility() {
  if (!M?.shapeRows) return;
  const q = S.tab === 'shapes' ? $('filter').value.trim().toLowerCase() : '';
  const anyShown = new Set();
  for (const r of M.shapeRows) {
    const show = q ? r.s.name.toLowerCase().includes(q) : openMeshes.has(r.s.path);
    r.row.style.display = show ? '' : 'none';
    r.shown = show;
    if (show || (!q)) anyShown.add(r.s.path);
  }
  for (const m of M.meshRows) {
    m.head.style.display = anyShown.has(m.path) ? '' : 'none';
    m.tw.textContent = q ? '' : openMeshes.has(m.path) ? '▾' : '▸';
  }
  refreshShapeValues(true);
}

/** 見えている行だけ、値とキーの印を更新する。 */
function refreshShapeValues(force = false) {
  if (!M?.shapeRows || S.tab !== 'shapes') return;
  for (const r of M.shapeRows) {
    if (!r.shown) continue;
    const v = Math.round(shapeValue(r.s.id));
    const t = D.shapes.get(r.s.id);
    const state = `${v}|${!!t?.keys.length}|${!!t?.keys.some(k => k.f === S.frame)}|${S.shapeEdited.has(r.s.id)}|${S.shapeSel === r.s.id}`;
    if (!force && state === r.last) continue;
    r.last = state;
    if (document.activeElement !== r.sl) r.sl.value = v;
    r.val.textContent = v;
    r.row.classList.toggle('on', v !== 0);
    r.row.classList.toggle('keyed', !!t?.keys.length);
    r.row.classList.toggle('keynow', !!t?.keys.some(k => k.f === S.frame));
    r.row.classList.toggle('edited', S.shapeEdited.has(r.s.id));
    r.row.classList.toggle('sel', S.shapeSel === r.s.id);
  }
}

/** 3D 表示で右クリックした所のメッシュを隠すメニュー。 */
function meshMenu(e) {
  if (!M) return;
  const r = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const meshes = M.meshes.filter(m => m.visible);
  for (const m of meshes) if (m.isSkinnedMesh) { m.boundingSphere = null; m.boundingBox = null; }
  const hit = raycaster.intersectObjects(meshes, false)[0];
  const items = [];
  if (hit) {
    const k = M.meshes.indexOf(hit.object);
    items.push([`隠す: ${meshLabel(hit.object)}`, () => setMeshesVisible((m, kk) => (kk === k ? false : m.visible))]);
    items.push(['これ以外を隠す', () => setMeshesVisible((m, kk) => kk === k)]);
  }
  if (M.meshes.some(m => !m.visible)) items.push(['全部表示', () => setMeshesVisible(() => true)]);
  if (items.length) showMenu(e.clientX, e.clientY, items);
}
