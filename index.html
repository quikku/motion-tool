/**
 * キーの間も毎フレームのポーズを書く（Unity はマッスルで補間するので、キーだけだと間の形が HTML と変わる）。
 * Unity 側で、直線で足りるキーは間引く。Constant の区間は間を書かない。
 */
/** カーブで書くフレーム（0〜最終フレーム）を frames に足す: キーと、止めない区間の中のフレーム全部 */
function curveFrames(ks, frames) {
  const last = D.frameCount;
  ks.forEach((k, j) => {
    if (k.f >= 0 && k.f <= last) frames.add(k.f);
    if (j + 1 < ks.length && k.mode !== 2) for (let f = Math.max(k.f + 1, 0); f < ks[j + 1].f && f <= last; f++) frames.add(f);
  });
  return frames;
}

function buildFile() {
  const saved = savePose();
  const tracked = [...D.tracks.keys()].filter(i => D.tracks.get(i).keys.length).sort((a, b) => a - b);
  const real = new Set(allKeyFrames());
  const frames = new Set(tracked.length ? [0, D.frameCount] : []);
  for (const i of tracked) curveFrames(prepTrack(D.tracks.get(i), M.restQ[i], M.lowerView?.get(i)).ks, frames);
  // 呼吸の揺れはキーの外なので、その骨も毎フレーム書く
  const breathing = tracked.length ? breathBones() : [];
  if (breathing.length) for (let f = 0; f <= D.frameCount; f++) frames.add(f);
  const startMode = startInterp();
  // ルートは骨として書かない（FBXに無い）。ルートの動きは、腰のワールドの向きと位置に入って出ていく
  const written = [...new Set([...tracked, ...breathing])].sort((a, b) => a - b).filter(i => i !== M.rootBone);
  if (tracked.includes(M.rootBone) && !written.includes(M.hips)) { written.push(M.hips); written.sort((a, b) => a - b); }
  const poses = [...frames].sort((a, b) => a - b).map(f => {
    poseAt(f, true);
    const rot = new Array(written.length * 4);
    // 回し方は FBX のままの元のポーズから（体型を変えた骨も、Unity が FBX に当てはめると見えていた向きになる）
    const put = k => { const i = written[k], d = M.fileRest ? wq(M.bones[i]).multiply(M.fileRest[i].q.clone().invert()) : deltaOf(i); rot[k * 4] = r6(d.x); rot[k * 4 + 1] = r6(d.y); rot[k * 4 + 2] = r6(d.z); rot[k * 4 + 3] = r6(d.w); };
    written.forEach((i, k) => { if (M.humanSet.has(i) || i === M.hips) put(k); });
    // 人型でない骨（髪・しっぽなど）は、見えていた向き（Unity の再生の姿での向き）で書く
    const view = applyUnityView();
    written.forEach((i, k) => { if (!M.humanSet.has(i) && i !== M.hips) put(k); });
    restoreUnityView(view);
    const hp = hipsDelta();
    const interp = real.has(f) ? (D.interp.get(f) === 2 ? 2 : 1) : (f === 0 ? startMode : 1);
    return { frame: f, interp, key: real.has(f) ? 1 : 0, rot, hipsPos: [r6(hp.x), r6(hp.y), r6(hp.z)] };
  });
  restorePose(saved);

  // シェイプ（0〜100）。骨と同じく、キーの間も毎フレーム書く
  const shapeCurves = [], shapeKeys = [];
  for (const [id, t] of D.shapes) {
    if (!t.keys.length) continue;
    const sh = M.shapeById.get(id);
    const list = [...curveFrames(prepShape(t).ks, new Set([0, D.frameCount]))].sort((a, b) => a - b);
    const own = new Set(t.keys.map(k => k.f));
    shapeCurves.push({
      path: sh.path, name: sh.name, frames: list, values: list.map(f => r6(evalShape(t, f))),
      interp: list.map(f => (own.has(f) ? (D.interp.get(f) === 2 ? 2 : 1) : (f === 0 ? startMode : 1))),
      key: list.map(f => (own.has(f) ? 1 : 0)),
    });
    shapeKeys.push({ mesh: sh.path, name: sh.name, keys: t.keys.map(k => ({ f: k.f, v: r6(k.v) })) });
  }

  const seen = new Set(), restBones = [], rest = [];
  M.names.forEach((n, i) => {
    if (seen.has(n) || i === M.rootBone) return;
    seen.add(n);
    restBones.push(n);
    const rp = M.fileRest ? M.fileRest[i].p : M.restWP[i];
    rest.push(r6(rp.x), r6(rp.y), r6(rp.z));
  });
  return {
    format: 'MotionToolWeb', version: 1, model: M.name, name: D.name,
    fps: D.fps, frameCount: D.frameCount, loop: D.loop,
    restFrom: 'three', restBones, rest, hips: M.names[M.hips],
    bones: written.map(i => M.names[i]), poses, shapeCurves,
    human: Object.entries(M.human).map(([k, i]) => `${k}:${M.names[i]}`),
    ...(M.unityInfo ? Object.fromEntries(Object.entries(M.unityInfo).filter(([, v]) => v)) : {}),
    // ここから下は HTML だけが使う（Unity は無視する）
    tracks: tracked.map(i => ({ bone: M.names[i], keys: D.tracks.get(i).keys.map(k => ({ f: k.f, q: k.q.toArray().map(r6), ...(k.p ? { p: k.p.toArray().map(r6) } : {}) })) })),
    shapes: shapeKeys,
    interp: [...D.interp].filter(([f]) => real.has(f)),
    breath: { ...D.breath },
  };
}

const clipNameOf = fileName => fileName.replace(/\.json$/i, '').replace(/\.motion$/i, '');

// ================================================================
//  .anim を直接書く（茜犬の見本用）。Unity を通さずに、骨の回転からマッスルを計算する
//  式は Unity の実物と比べて確かめた（README の「.anim を直接書く」）:
//    ローカル回転 = pre × ねじり・振りの回転（符号 × マッスル × 可動範囲）× post の逆
//    重心 = 腰の位置 + Σ（骨のワールドの回転 × 骨ごとの一定のずれ）
//    体の向き = 腰の向きから、上 → 右 → 上の順に最短の回転で合わせた枠 × 一定のずれ
//  モデルの数値は FBX名.motiontool.json の muscle（Unity で「HTML 用に書き出す」と入る）
// ================================================================

const quatOf = a => new THREE.Quaternion(a[0], a[1], a[2], a[3]);
const vecOf = a => new THREE.Vector3(a[0], a[1], a[2]);
const V_X = new THREE.Vector3(1, 0, 0), V_Y = new THREE.Vector3(0, 1, 0);
/** 腕・脚の 3 本組。ねじりが上の骨から下の骨へ受け渡されるので、まとめて解く */
const ANIM_CHAINS = [
  ['LeftUpperArm', 'LeftLowerArm', 'LeftHand'], ['RightUpperArm', 'RightLowerArm', 'RightHand'],
  ['LeftUpperLeg', 'LeftLowerLeg', 'LeftFoot'], ['RightUpperLeg', 'RightLowerLeg', 'RightFoot'],
];

/** 書ける状態なら { scale, bones, others, ... }。だめなら { error }。無ければ null（モデルの数値が無い） */
function buildAnimModel() {
  const info = M?.muscleInfo;
  if (!info?.muscle) return null;
  const mu = info.muscle;
  const fit = fitRest(info);
  if (!fit.ok) return { error: fit.message };
  const bones = new Map(), byHuman = {};
  const playOf = new Map((info.playOffset || []).map(e => [e.bone, vecOf(e.d)]));
  for (const b of mu.bones) {
    const i = M.byName.get(b.bone);
    if (i == null) return { error: `${b.bone} がモデルにありません` };
    const e = {
      name: b.bone, i, human: b.human, parent: b.parent, pre: quatOf(b.pre), post: quatOf(b.post), sign: b.sign, min: b.min, max: b.max, muscle: b.muscle,
      rest: quatOf(b.restRot), parentRest: quatOf(b.parentRestRot), restPos: vecOf(b.restPos), mass: vecOf(b.mass), play: playOf.get(b.bone) || new THREE.Vector3(),
    };
    e.preInv = e.pre.clone().invert();
    bones.set(b.bone, e);
    byHuman[b.human] = e;
  }
  for (const c of ANIM_CHAINS) for (const h of c) if (!byHuman[h]) return { error: `人型の骨 ${h} がありません` };
  if (!byHuman.Hips) return { error: '腰がありません' };
  const others = new Map();
  for (const o of mu.others || []) others.set(o.bone, { name: o.bone, i: M.byName.get(o.bone) ?? null, parent: o.parent, rest: quatOf(o.restRot) });
  // 人型でない骨のうち、キーを打った物（人型の骨の祖先と、ルートは除く）
  const ancestor = new Set();
  for (const b of bones.values()) for (let p = M.parent[b.i]; p >= 0; p = M.parent[p]) ancestor.add(M.names[p]);
  return {
    info, scale: fit.scale, fitError: fit.error, bones, byHuman, others, humanScale: mu.humanScale, names: mu.names, bodyOffset: quatOf(mu.bodyOffset),
    order: mu.bones.map(b => bones.get(b.bone)),
    isExtra: name => others.has(name) && others.get(name).i != null && !ancestor.has(name),
  };
}

/** roots の中から、前のフレームの値に近い物（円の上で）。前が無ければ 0 に近い物 */
function pickRoot(roots, prevA) {
  const ref = prevA ?? 0;
  const dist = r => Math.abs(Math.atan2(Math.sin(r - ref), Math.cos(r - ref)));
  let best = roots[0];
  for (const r of roots) if (dist(r) < dist(best)) best = r;
  // 前の値との差の分、2π を足し引きして、値が飛ばないようにする
  return prevA == null ? best : ref + Math.atan2(Math.sin(best - ref), Math.cos(best - ref));
}

/** SwingTwist の逆。マッスルの空間の回転 → ねじり・振り Y・振り Z の角度（ラジアン） */
function muscleAngles(q) {
  let { x, y, z, w } = q;
  if (w < 0) { x = -x; y = -y; z = -z; w = -w; }
  const X = x / w, B = y / w, C = z / w, d = 1 + X * X;
  return [2 * Math.atan(X), 2 * Math.atan((B - X * C) / d), 2 * Math.atan((C + X * B) / d)];
}

/** F(a) = 0 になる a（-π〜π）を全部。区間を粗く切って符号が変わる所を二分法で詰める（無ければ 0） */
function solveAll(F) {
  const roots = [];
  let prevA = -Math.PI, prevF = F(prevA);
  for (let k = 1; k <= 72; k++) {
    const a = -Math.PI + k * (2 * Math.PI / 72), f = F(a);
    if (prevF * f <= 0) {
      let x0 = prevA, x1 = a, f0 = prevF;
      for (let it = 0; it < 40; it++) { const xm = (x0 + x1) / 2, fm = F(xm); if (f0 * fm <= 0) x1 = xm; else { x0 = xm; f0 = fm; } }
      const r = (x0 + x1) / 2;
      if (!roots.some(v => Math.abs(v - r) < 1e-6)) roots.push(r);
    }
    prevA = a; prevF = f;
  }
  return roots.length ? roots : [0];
}

/**
 * 今のポーズ（表示されている姿）→ マッスル・RootT・RootQ・人型でない骨のローカル回転。
 * Unity の空間にそろえるので、X を反転する（json と同じ）。
 */
function animFrame(am, prev) {
  M.root.updateMatrixWorld(true);
  const world = (e) => mirrorQ(deltaOf(e.i)).multiply(e.rest).normalize();
  const W = new Map();
  for (const e of am.bones.values()) W.set(e.name, world(e));
  const worldOf = name => {
    if (W.has(name)) return W.get(name);
    const o = am.others.get(name);
    const q = o ? (o.i != null ? world(o) : o.rest) : new THREE.Quaternion();
    W.set(name, q);
    return q;
  };
  const local = e => (e.parent ? worldOf(e.parent) : e.parentRest).clone().invert().multiply(W.get(e.name));
  // マッスルの空間の角度（ラジアン）
  const angles = e => muscleAngles(e.preInv.clone().multiply(local(e)).multiply(e.post));
  // 親のねじりの軸（親のローカルで post × X）まわりに、子のローカル回転から角度 a を抜く
  const untwist = (parent, childLocal, a) => parent.post.clone().multiply(new THREE.Quaternion().setFromAxisAngle(V_X, -a)).multiply(parent.post.clone().invert()).multiply(childLocal);
  const muscles = new Float64Array(am.names.length);
  // マッスルの値（-1〜1 が可動範囲）
  const muscleOf = (e, d, rad) => { const deg = rad * 180 / Math.PI * e.sign[d]; return deg >= 0 ? deg / e.max[d] : deg / -e.min[d]; };
  const put = (e, rad) => {
    for (let d = 0; d < 3; d++) if (e.muscle[d] >= 0) muscles[e.muscle[d]] = muscleOf(e, d, rad[d]);
  };
  const done = new Set(), chains = new Map();
  for (const [hu, hl, he] of ANIM_CHAINS) {
    const u = am.byHuman[hu], l = am.byHuman[hl], e = am.byHuman[he];
    const ll = local(l), le = local(e), au = angles(u);
    // ねじりの受け渡しは、解が 2 つある（180° ちがい）。前のフレームの解にいちばん近い方を選ぶ
    // （範囲を超えたポーズでも、フレームの途中で解が入れ替わらないように）。最初のフレームは、0 に近い方
    const alpha = pickRoot(solveAll(a => { const q = l.preInv.clone().multiply(untwist(u, ll, a)).multiply(l.post); return q.y * q.w - q.x * q.z; }), prev?.chains.get(hu)?.alpha);
    const beta = pickRoot(solveAll(a => { const q = e.preInv.clone().multiply(untwist(l, le, a)).multiply(e.post); return q.x * Math.sign(q.w || 1); }), prev?.chains.get(hu)?.beta);
    chains.set(hu, { alpha, beta });
    const al = muscleAngles(l.preInv.clone().multiply(untwist(u, ll, alpha)).multiply(l.post));
    const ae = muscleAngles(e.preInv.clone().multiply(untwist(l, le, beta)).multiply(e.post));
    put(u, [au[0] + alpha, au[1], au[2]]);
    put(l, [al[0] + beta, al[1], al[2]]);
    put(e, ae);
    done.add(u.name); done.add(l.name); done.add(e.name);
  }
  for (const e of am.bones.values()) if (!done.has(e.name) && e.human !== 'Hips') put(e, angles(e));

  // 位置: 腰は元の位置からのずれ（HTML の単位 → Unity のメートル）。ほかは親から順に
  const hipsE = am.byHuman.Hips;
  const P = new Map([[hipsE.name, hipsE.restPos.clone().add(mirrorV(hipsDelta()).multiplyScalar(am.scale))]]);
  for (const e of am.order) {
    if (e === hipsE) continue;
    const p = am.bones.get(e.parent);
    const off = e.restPos.clone().sub(p.restPos).add(e.play).applyQuaternion(p.rest.clone().invert()).applyQuaternion(W.get(p.name));
    P.set(e.name, P.get(p.name).clone().add(off));
  }
  // 体の向き
  const pos = h => P.get(am.byHuman[h].name);
  const up = pos('LeftUpperArm').clone().add(pos('RightUpperArm')).sub(pos('LeftUpperLeg')).sub(pos('RightUpperLeg')).normalize();
  const right = pos('RightUpperLeg').clone().sub(pos('LeftUpperLeg')).add(pos('RightUpperArm')).sub(pos('LeftUpperArm')).normalize();
  let f = W.get(hipsE.name).clone().multiply(hipsE.rest.clone().invert());
  const turn = (axis, to) => { f = new THREE.Quaternion().setFromUnitVectors(axis.clone().applyQuaternion(f).normalize(), to).multiply(f); };
  turn(V_Y, up); turn(V_X, right); turn(V_Y, up);
  const rootQ = f.multiply(am.bodyOffset).normalize();
  if (prev && rootQ.dot(prev.rootQ) < 0) rootQ.set(-rootQ.x, -rootQ.y, -rootQ.z, -rootQ.w);
  // 重心
  const com = P.get(hipsE.name).clone();
  for (const e of am.bones.values()) if (e.mass.lengthSq() > 0) com.add(e.mass.clone().applyQuaternion(W.get(e.name)));
  const rootT = com.divideScalar(am.humanScale);

  // 人型でない骨: Unity の空間でのローカルの回転
  const extras = new Map();
  for (const [name, o] of am.others) {
    if (!am.isExtra(name) || !D.tracks.get(o.i)?.keys.length) continue;
    const q = (o.parent ? worldOf(o.parent) : new THREE.Quaternion()).clone().invert().multiply(worldOf(name)).normalize();
    extras.set(name, q);
  }
  return { muscles, rootT, rootQ, extras, chains };
}

// ---------- カーブ → .anim の文章 ----------

const yf = x => {
  if (x === Infinity) return 'Infinity';
  if (x === -Infinity) return '-Infinity';
  if (Math.abs(x) < 1e-9) return '0';
  return x.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
};
const MODE_LINEAR = 2, MODE_CONSTANT = 3; // Unity の TangentMode

/** 直線で足りるフレームを間引く。keep[i] が true のフレームを残す（comps: 成分ごとの値の配列、誤差は成分の最大） */
function reduceKeys(times, comps, modes, anchor, tol) {
  const n = times.length, keep = new Array(n).fill(false);
  const simplify = (a, b) => {
    if (b - a < 2) return;
    let worst = 0, at = -1;
    for (let i = a + 1; i < b; i++) {
      const u = (times[i] - times[a]) / (times[b] - times[a]);
      let d = 0;
      for (const v of comps) d = Math.max(d, Math.abs(v[a] + (v[b] - v[a]) * u - v[i]));
      if (d > worst) { worst = d; at = i; }
    }
    if (worst <= tol) return;
    keep[at] = true;
    simplify(a, at); simplify(at, b);
  };
  let start = 0;
  for (let i = 0; i < n; i++) {
    if (!anchor[i] && modes[i] === 1 && (i === 0 || modes[i - 1] === 1)) continue;
    keep[i] = true;
    if (i > start) simplify(start, i);
    start = i;
  }
  return keep;
}

/** 1 本分のキー。modes[i] はそのキーから次のキーまで（1 = 直線、2 = 止める）。 */
function curveKeys(times, comps, modes, keep) {
  const idx = [];
  keep.forEach((k, i) => { if (k) idx.push(i); });
  return idx.map((i, j) => {
    const prev = j > 0 ? idx[j - 1] : -1, next = j + 1 < idx.length ? idx[j + 1] : -1;
    const slope = (a, b, c) => (times[b] === times[a] ? 0 : (comps[c][b] - comps[c][a]) / (times[b] - times[a]));
    const outConst = next >= 0 && modes[i] === 2, inConst = prev >= 0 && modes[prev] === 2;
    const inS = comps.map((_, c) => (prev < 0 ? (next >= 0 ? slope(i, next, c) : 0) : inConst ? Infinity : slope(prev, i, c)));
    const outS = comps.map((_, c) => (next < 0 ? (prev >= 0 ? slope(prev, i, c) : 0) : outConst ? Infinity : slope(i, next, c)));
    const left = inConst ? MODE_CONSTANT : MODE_LINEAR, right = outConst ? MODE_CONSTANT : MODE_LINEAR;
    return { t: times[i], v: comps.map(c => c[i]), inS, outS, mode: (left << 1) | (right << 4) | (left !== right ? 1 : 0) };
  });
}

function floatCurveYaml(keys, attribute, path, classId) {
  const out = ['  - serializedVersion: 2', '    curve:', '      serializedVersion: 2', '      m_Curve:'];
  for (const k of keys) {
    out.push('      - serializedVersion: 3', `        time: ${yf(k.t)}`, `        value: ${yf(k.v[0])}`, `        inSlope: ${yf(k.inS[0])}`, `        outSlope: ${yf(k.outS[0])}`,
      `        tangentMode: ${k.mode}`, '        weightedMode: 0', '        inWeight: 0.33333334', '        outWeight: 0.33333334');
  }
  out.push('      m_PreInfinity: 2', '      m_PostInfinity: 2', '      m_RotationOrder: 4', `    attribute: ${attribute}`, `    path: ${path}`, `    classID: ${classId}`, '    script: {fileID: 0}', '    flags: 0');
  return out;
}

function quatCurveYaml(keys, path) {
  const v4 = a => `{x: ${yf(a[0])}, y: ${yf(a[1])}, z: ${yf(a[2])}, w: ${yf(a[3])}}`;
  const out = ['  - curve:', '      serializedVersion: 2', '      m_Curve:'];
  for (const k of keys) {
    out.push('      - serializedVersion: 3', `        time: ${yf(k.t)}`, `        value: ${v4(k.v)}`, `        inSlope: ${v4(k.inS)}`, `        outSlope: ${v4(k.outS)}`,
      `        tangentMode: ${k.mode}`, '        weightedMode: 0',
      '        inWeight: {x: 0.33333334, y: 0.33333334, z: 0.33333334, w: 0.33333334}', '        outWeight: {x: 0.33333334, y: 0.33333334, z: 0.33333334, w: 0.33333334}');
  }
  out.push('      m_PreInfinity: 2', '      m_PostInfinity: 2', '      m_RotationOrder: 4', `    path: ${path}`);
  return out;
}

/** 毎フレームのポーズ（マッスル・RootT・RootQ・シェイプ・人型でない骨）から、.anim の文章を作る。書けなければ { error } */
function buildAnim(name) {
  const am = buildAnimModel();
  if (!am) return { error: 'このモデルは、ブラウザだけでは .anim を書けません（Unity で「HTML 用に書き出す」をした情報がありません）' };
  if (am.error) return { error: am.error };
  const N = D.frameCount, fps = D.fps, count = N + 1;
  const times = new Float64Array(count).map((_, f) => f / fps);
  const keyFrames = new Set(allKeyFrames());
  const modes = new Array(count).fill(1);
  const startMode = startInterp();
  for (let f = 0; f < count; f++) modes[f] = keyFrames.has(f) ? (D.interp.get(f) === 2 ? 2 : 1) : (f === 0 ? startMode : 1);
  const anchor = modes.map((m, f) => keyFrames.has(f) || f === 0 || f === N || m === 2 || (f > 0 && modes[f - 1] === 2));

  const muscle = am.names.map(() => new Float64Array(count));
  const rootT = [0, 1, 2].map(() => new Float64Array(count)), rootQ = [0, 1, 2, 3].map(() => new Float64Array(count));
  const extraNames = [...am.others.keys()].filter(n => am.isExtra(n) && D.tracks.get(am.others.get(n).i)?.keys.length);
  const extraRot = new Map(extraNames.map(n => [n, [0, 1, 2, 3].map(() => new Float64Array(count))]));
  const shapes = [...D.shapes].filter(([, t]) => t.keys.length).map(([id, t]) => ({ id, t, v: new Float64Array(count), sh: M.shapeById.get(id) }));

  const saved = savePose();
  let prev = null; const prevE = new Map();
  try {
    for (let f = 0; f < count; f++) {
      poseAt(f, true);
      const view = applyUnityView();
      const r = animFrame(am, prev);
      restoreUnityView(view);
      prev = r;
      r.muscles.forEach((v, m) => { muscle[m][f] = v; });
      rootT.forEach((a, c) => { a[f] = r.rootT.getComponent(c); });
      rootQ.forEach((a, c) => { a[f] = [r.rootQ.x, r.rootQ.y, r.rootQ.z, r.rootQ.w][c]; });
      for (const [n, q] of r.extras) {
        const p = prevE.get(n);
        if (p && q.dot(p) < 0) q.set(-q.x, -q.y, -q.z, -q.w);
        prevE.set(n, q);
        extraRot.get(n).forEach((a, c) => { a[f] = [q.x, q.y, q.z, q.w][c]; });
      }
      for (const s of shapes) s.v[f] = evalShape(s.t, f);
    }
  } finally {
    restorePose(saved);
  }

  // 許容差は Unity 側の変換（WebMotionBridge）と同じ
  const TOL = { muscle: 0.0001, rootT: 0.00005, rootQ: 0.00005, extra: 0.00005, shape: 0.05 };
  const curves = [];
  const keysOf = (comps, tol) => curveKeys(times, comps, modes, reduceKeys(times, comps, modes, anchor, tol));
  ['RootT.x', 'RootT.y', 'RootT.z'].forEach((n, c) => curves.push(floatCurveYaml(keysOf([rootT[c]], TOL.rootT), n, '', 95)));
  ['RootQ.x', 'RootQ.y', 'RootQ.z', 'RootQ.w'].forEach((n, c) => curves.push(floatCurveYaml(keysOf([rootQ[c]], TOL.rootQ), n, '', 95)));
  am.names.forEach((n, m) => curves.push(floatCurveYaml(keysOf([muscle[m]], TOL.muscle), n, '', 95)));
  const shapeCurves = shapes.map(s => keysOf([s.v], TOL.shape));
  // Unity の Transform のパス（モデルのルートの下から。親が人型の骨でもたどる）
  const parentOf = n => am.bones.get(n)?.parent ?? am.others.get(n)?.parent ?? '';
  const pathOf = n => { const a = []; for (let p = n; p; p = parentOf(p)) a.unshift(p); return a.join('/'); };
  const rotCurves = extraNames.map(n => ({ path: pathOf(n), keys: keysOf(extraRot.get(n), TOL.extra) }));

  const float = [...curves.flat()], editor = [...float];
  shapes.forEach((s, j) => {
    const y = floatCurveYaml(shapeCurves[j], 'blendShape.' + s.sh.name, s.sh.path, 137);
    float.push(...y); editor.push(...y);
  });
  const rot = rotCurves.flatMap(c => quatCurveYaml(c.keys, c.path));
  const eulerless = rotCurves.flatMap(c => ['x', 'y', 'z', 'w'].flatMap((a, k) => floatCurveYaml(c.keys.map(key => ({ ...key, v: [key.v[k]], inS: [key.inS[k]], outS: [key.outS[k]] })), 'm_LocalRotation.' + a, c.path, 4)));
  const bool = b => (b ? 1 : 0);
  const lines = [
    '%YAML 1.1', '%TAG !u! tag:unity3d.com,2011:', '--- !u!74 &7400000', 'AnimationClip:',
    '  m_ObjectHideFlags: 0', '  m_CorrespondingSourceObject: {fileID: 0}', '  m_PrefabInstance: {fileID: 0}', '  m_PrefabAsset: {fileID: 0}',
    `  m_Name: ${name}`, '  serializedVersion: 7', '  m_Legacy: 0', '  m_Compressed: 0', '  m_UseHighQualityCurve: 1',
    rot.length ? '  m_RotationCurves:' : '  m_RotationCurves: []', ...rot,
    '  m_CompressedRotationCurves: []', '  m_EulerCurves: []', '  m_PositionCurves: []', '  m_ScaleCurves: []',
    float.length ? '  m_FloatCurves:' : '  m_FloatCurves: []', ...float,
    '  m_PPtrCurves: []', `  m_SampleRate: ${yf(fps)}`, '  m_WrapMode: 0', '  m_Bounds:', '    m_Center: {x: 0, y: 0, z: 0}', '    m_Extent: {x: 0, y: 0, z: 0}',
    '  m_ClipBindingConstant:', '    genericBindings: []', '    pptrCurveMapping: []',
    '  m_AnimationClipSettings:', '    serializedVersion: 2', '    m_AdditiveReferencePoseClip: {fileID: 0}', '    m_AdditiveReferencePoseTime: 0',
    '    m_StartTime: 0', `    m_StopTime: ${yf(N / fps)}`, '    m_OrientationOffsetY: 0', '    m_Level: 0', '    m_CycleOffset: 0', '    m_HasAdditiveReferencePose: 0',
    `    m_LoopTime: ${bool(D.loop)}`, '    m_LoopBlend: 0', '    m_LoopBlendOrientation: 1', '    m_LoopBlendPositionY: 1', '    m_LoopBlendPositionXZ: 1',
    '    m_KeepOriginalOrientation: 1', '    m_KeepOriginalPositionY: 1', '    m_KeepOriginalPositionXZ: 1', '    m_HeightFromFeet: 0', '    m_Mirror: 0',
    editor.length + eulerless.length ? '  m_EditorCurves:' : '  m_EditorCurves: []', ...editor, ...eulerless,
    '  m_EulerEditorCurves: []', '  m_HasGenericRootTransform: 0', '  m_HasMotionFloatCurves: 0', '  m_Events: []', '',
  ];
  return { text: lines.join('\n'), keys: float.filter(l => l.startsWith('      - serializedVersion: 3')).length, bytes: lines.reduce((a, l) => a + l.length + 1, 0), fitError: am.fitError, scale: am.scale };
}

/**
 * Unityから開いたときの保存。Unityが.animにして、プロジェクトに置く。
 * 編集用のデータ（骨ごとのキー）も渡す。Unityが.animと一緒に覚えておき、次に開くときに返してくる。
 */
async function saveToUnity(as) {
  let path = S.unity.path;
  if (as || !path) {
    path = await ask('保存先', `${S.unity.dir}/${D.name}.anim`);
    if (!path) return;
  }
  const file = buildFile();
  const edit = { ...file };
  for (const k of ['poses', 'shapeCurves', 'restBones', 'rest', 'human', 'axes', 'twist', 'unityRest', 'zeroPose']) delete edit[k];
  const post = async overwrite => {
    // Unity の別のタブから出した相手役は、そのタブ（そのアバター）の Unity に保存させる
    const r = await fetch((S.src?.base || '') + 'unity/save', { method: 'POST', body: JSON.stringify({ path, overwrite, motion: JSON.stringify(file), edit: JSON.stringify(edit) }) });
    return r.json();
  };
  let res;
  try {
    res = await post(path === S.unity.path);
    if (res.exists) {
      if (!confirm(`${res.path} を上書きしますか？`)) return;
      res = await post(true);
    }
  } catch (e) {
    setStatus('Unityとつながりません。UnityでTools/SisMotionTooLをもう一度選んでください', true);
    return;
  }
  if (!res.ok) { setStatus('保存できません: ' + res.message, true); return; }
  S.unity.path = res.path;
  S.unity.dir = res.path.replace(/\/[^/]*$/, '');
  D.name = res.path.replace(/^.*\//, '').replace(/\.anim$/i, '');
  S.dirty = false;
  updateTitle();
  setStatus(`保存: ${res.path}` + (res.message ? '  ' + res.message : ''));
}

/** 茜犬の見本の保存。Unity を通さずに、ブラウザが .anim を書く */
async function saveAnim(as) {
  const base = (D.name || 'NewMotion').replace(/\.anim$/i, '');
  const built = buildAnim(base);
  if (built.error) { setStatus(built.error, true); return; }
  try {
    let name;
    if (window.showSaveFilePicker) {
      if (as || !S.animHandle) {
        S.animHandle = await window.showSaveFilePicker({ suggestedName: `${base}.anim`, types: [{ description: 'Unity AnimationClip', accept: { 'application/octet-stream': ['.anim'] } }] });
      }
      const w = await S.animHandle.createWritable();
      await w.write(built.text);
      await w.close();
      name = S.animHandle.name;
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([built.text], { type: 'application/octet-stream' }));
      a.download = name = `${base}.anim`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    D.name = name.replace(/\.anim$/i, '');
    S.dirty = false;
    updateTitle();
    setStatus(`保存: ${name}（${Math.round(built.bytes / 1024)} KB）`);
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('保存できません: ' + e.message, true);
  }
}

async function save(as) {
  if (!M) return;
  if (!hasKeys()) { setStatus('キーがありません', true); return; }
  if (S.sample) await saveAnim(as);
  else if (S.unity) await saveToUnity(as);
}

// ================================================================
//  プロジェクト（.sismotion）と自動保存
//  .anim は呼吸を焼き込むので、開き直すと元のキーに戻せない。編集の中身はこちらに残す
// ================================================================

const PROJECT_FORMAT = 'SisMotion';

/** 今の編集の中身（キーは骨の名前で持つ。別のモデルで開いても名前が合う骨は使える） */
function docData() {
  return {
    format: PROJECT_FORMAT, version: 1, model: M?.name ?? null, name: D.name,
    fps: D.fps, frameCount: D.frameCount, loop: D.loop, breath: { ...D.breath },
    tracks: [...D.tracks].filter(([, t]) => t.keys.length).map(([i, t]) => ({
      bone: M.names[i], keys: t.keys.map(k => ({ f: k.f, q: k.q.toArray(), ...(k.p ? { p: k.p.toArray() } : {}) })),
    })),
    shapes: [...D.shapes].filter(([, t]) => t.keys.length).map(([id, t]) => ({ id, keys: t.keys.map(k => ({ f: k.f, v: k.v })) })),
    interp: [...D.interp],
    frame: S.frame, dirty: S.dirty,
  };
}
/**
 * 保存する中身。2 体いるときは、1 体目を今までどおりの形で、2 体目を pair に入れる（どちらを動かしているかに関係なく、この順）。
 * 相手役の中身を作るとき（asPair の中）は M・D が相手のものなので、1 体分だけ
 */
function projectData() {
  const mine = docData();
  if (M === P.M || !(P.M || P.pending)) return mine;
  if (!P.M) return { ...mine, pair: P.pending };
  const other = asPair(docData);
  const [first, second] = S.second ? [other, mine] : [mine, other];
  delete second.frame;
  delete second.dirty;
  const st = S.second ? S : P.st;
  return {
    ...first, frame: S.frame, dirty: S.dirty,
    pair: { src: st.src?.kind || 'file', ...(st.src?.base ? { base: st.src.base } : {}), model: second.model, show: P.show, ghost: P.ghost, place: { ...P.place }, active: S.second ? 1 : 0, motion: second },
  };
}

/** projectData() の中身から、今のモデル（M）の骨に合わせたキーを組む。D は変えない。missing: モデルに無くて使えなかった骨とシェイプの数 */
function readProject(obj) {
  const tracks = new Map(), shapes = new Map(), interp = new Map(obj.interp || []);
  let missing = 0;
  for (const t of obj.tracks || []) {
    const i = M.byName.get(t.bone);
    if (i == null) { missing++; continue; }
    tracks.set(i, { keys: t.keys.map(k => ({ f: k.f, q: new THREE.Quaternion().fromArray(k.q), p: k.p && hasPos(i) ? new THREE.Vector3().fromArray(k.p) : null })) });
  }
  for (const sh of obj.shapes || []) {
    if (!M.shapeById.has(sh.id)) { missing++; continue; }
    shapes.set(sh.id, { keys: sh.keys.map(k => ({ f: k.f, v: k.v })) });
  }
  return {
    doc: {
      name: obj.name || 'NewMotion', fps: obj.fps || 30, frameCount: Math.max(1, obj.frameCount || 60), loop: obj.loop !== false,
      breath: { on: false, period: 4, amp: 100, ...(obj.breath || {}) }, tracks, shapes, interp,
    },
    missing,
  };
}

/** projectData() の中身を開く。戻り値は、モデルに無くて使えなかった骨とシェイプの数 */
function applyProject(obj) {
  // 中身の 1 体目は、1 体目に入れる
  if (S.second) switchActor();
  // 壊れたデータで途中まで書き換わらないように、先に全部組んでから入れ替える
  const { doc, missing } = readProject(obj);
  const { tracks, shapes, ...rest } = doc;
  Object.assign(D, rest);
  D.tracks.clear();
  D.shapes.clear();
  for (const [i, t] of tracks) D.tracks.set(i, t);
  for (const [id, t] of shapes) D.shapes.set(id, t);
  docVer++;
  if (obj.pair) restorePair(obj.pair);
  TL.sel.clear();
  TL.fit = true;
  goFrame(obj.frame || 0);
  refreshBreathUI();
  refreshAll();
  return missing;
}

async function saveProject() {
  if (!M) return;
  const data = projectData();
  const text = JSON.stringify(data);
  const base = (data.name || 'NewMotion').replace(/\.(anim|sismotion)$/i, '');
  try {
    let name;
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({ suggestedName: `${base}.sismotion`, types: [{ description: 'SisMotionTooL プロジェクト', accept: { 'application/json': ['.sismotion'] } }] });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      name = h.name;
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name = `${base}.sismotion`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    setStatus(`プロジェクトを保存: ${name}`);
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('保存できません: ' + e.message, true);
  }
}

async function openProjectFile(file) {
  if (!file || !M) return;
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { setStatus('開けません: ' + file.name + ' は .sismotion ではありません', true); return; }
  if (obj?.format !== PROJECT_FORMAT) { setStatus('開けません: ' + file.name + ' は .sismotion ではありません', true); return; }
  if (S.dirty && hasKeys() && !confirm('今の内容を閉じて開きますか？（今の内容は取り消しで戻せます）')) return;
  if (S.second) switchActor();
  pushUndo();
  let missing;
  try { missing = applyProject({ ...obj, frame: 0, name: obj.name || file.name.replace(/\.sismotion$/i, '') }); }
  catch (e) { undo(); setStatus('開けません: ' + file.name + ' の中身が壊れています', true); return; }
  S.dirty = false;
  updateTitle();
  autoSaveNow();
  const notes = [];
  if (obj.model && obj.model !== M.name) notes.push(`作ったときのモデルは ${obj.model}`);
  if (missing) notes.push(`このモデルに無い骨・シェイプ ${missing}個`);
  setStatus(`開いた: ${file.name}  キー${allKeyFrames().length}個` + (notes.length ? '  ' + notes.join('、') : ''), missing > 0);
}

// 自動保存: ブラウザの中に、アバターごと（avatarKey）に今の状態を残す。開いたときに同じアバターならそのまま戻す
/** 2 体いるときも、1 体目のアバターで残す（開いたときに読み込まれるのは 1 体目なので） */
const autosaveKey = () => M ? 'sismotion.autosave:' + (S.second && P.M ? P.st.avatarId || P.M.name : avatarKey()) : null;
let autoSavedVer = -1, autoSavedFrame = -1;
/** 起動して、前回の続きを戻すかどうか決めるまでは書かない（読み込みの途中の空の状態で上書きしないように） */
let autoReady = false;
function autoSaveNow() {
  if (!M || !autoReady || S.playing) return;
  try { localStorage.setItem(autosaveKey(), JSON.stringify(projectData())); autoSavedVer = docVer; autoSavedFrame = S.frame; } catch (e) { /* 残せなくても動く */ }
}
setInterval(() => { if (M && (docVer !== autoSavedVer || S.frame !== autoSavedFrame)) autoSaveNow(); }, 2000);
/** 前の状態が残っていれば戻す。戻したら true */
function autoRestore() {
  autoReady = true;
  let obj = null;
  try { obj = JSON.parse(localStorage.getItem(autosaveKey()) || 'null'); } catch (e) { /* 壊れていたら使わない */ }
  if (obj?.format !== PROJECT_FORMAT || !(obj.tracks?.length || obj.shapes?.length)) return false;
  try { applyProject(obj); } catch (e) { return false; } // 形が合わない残りは使わない
  S.dirty = !!obj.dirty;
  updateTitle();
  autoSavedVer = docVer;
  setStatus(`前回の続き（キー${allKeyFrames().length}個）。最初からにするときは「新規」`);
  return true;
}

$('bOpen').onclick = () => $('projFile').click();
$('projFile').onchange = e => { openProjectFile(e.target.files[0]); e.target.value = ''; };
$('bSaveProj').onclick = () => saveProject();
// .sismotion を画面に落としても開ける
window.addEventListener('dragover', e => { if ([...e.dataTransfer.items].some(x => x.kind === 'file')) e.preventDefault(); });
window.addEventListener('drop', e => {
  const f = [...e.dataTransfer.files].find(x => /\.sismotion$/i.test(x.name));
  if (!f) return;
  e.preventDefault();

});

// ================================================================
//  相手役（2 人目のアバター）。置き場所を決めて、同じタイムラインで一緒に再生する。「⇄」で動かすほうを入れ替える
//  動かしているほうは今までどおり M・D（と S の一部）。もう 1 体は P に置き、使うときだけ入れ替える（asPair）。
//  動かしているほうはいつも原点にいるので、元のポーズ（restWP など）を使う計算はそのまま効く
// ================================================================

const P = {
  M: null, D: null,
  /** もう 1 体の、アバターごとの状態（S と入れ替える分と、取り消しの履歴） */
  st: null,
  show: true, ghost: false,
  /** 2 体目の置き場所（1 体目から見た位置と、Y 軸まわりの向き（度））。どちらを動かしていても、この向きで持つ */
  place: { x: 0, y: 0, z: 0, yaw: 0 },
  wrap: new THREE.Group(),
  /** 開いたプロジェクトの相手役で、まだモデルが無くて戻せていない物 */
  pending: null,
  /** 保存してあった相手役を戻しているところ（保存していない変更があることにはしない） */
  restoring: false,
};
scene.add(P.wrap);
/** くっつけ方（下の「くっつける」）。limb: 今のアバターの IK の番号、bone: 相手の骨、off: 相手の骨から見た手先・足先の行列 */
let contact = null;
/** アバターごとに持つ S の中身（入れ替えるときに一緒に替える） */
const ACTOR_STATE = ['sel', 'edited', 'shapeEdited', 'shapeSel', 'boneView', 'animHandle', 'avatarId', 'src'];

const newDocData = () => ({ name: 'NewMotion', fps: 30, frameCount: 60, loop: true, tracks: new Map(), shapes: new Map(), interp: new Map(), breath: { on: false, period: 4, amp: 100 } });

/**
 * fn のあいだだけ、M・D を相手役のものにする。fn の中で await しない（そのあいだに描画などが走ると混ざる）。
 * 相手役は置き場所を原点に戻して計算する（元のポーズはそこで測ってある）。
 */
function asPair(fn) {
  const keep = { M, D, boneView: S.boneView };
  M = P.M; D = P.D;
  P.wrap.position.set(0, 0, 0);
  P.wrap.quaternion.identity();
  P.wrap.updateMatrixWorld(true);
  try { return fn(); }
  finally { P.M = M; P.D = D; M = keep.M; D = keep.D; S.boneView = keep.boneView; placePair(); }
}

const placeMatrix = pl => new THREE.Matrix4().compose(
  new THREE.Vector3(pl.x, pl.y, pl.z), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), pl.yaw * Math.PI / 180), new THREE.Vector3(1, 1, 1));
function placeOf(m) {
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  m.decompose(p, q, sc);
  const f = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
  const r3 = v => Math.round(v * 1000) / 1000;
  return { x: r3(p.x), y: r3(p.y), z: r3(p.z), yaw: Math.round(Math.atan2(f.x, f.z) * 180 / Math.PI * 10) / 10 };
}
/** もう 1 体を、動かしているほうから見た置き場所 */
const otherPlace = () => (S.second ? placeOf(placeMatrix(P.place).invert()) : { ...P.place });
function setOtherPlace(pl) { P.place = S.second ? placeOf(placeMatrix(pl).invert()) : { ...pl }; }

function placePair() {
  const m = placeMatrix(P.place);
  if (S.second) m.invert();
  m.decompose(P.wrap.position, P.wrap.quaternion, P.wrap.scale);
  P.wrap.visible = P.show;
  P.wrap.updateMatrixWorld(true);
}

/** 今のフレーム → 相手役のフレーム。時刻でそろえる（fps が違っても同じ時刻）。相手の長さを越えたら、ループならくり返し、でなければ最後で止める */
function pairFrame(f) {
  const t = f / D.fps * P.D.fps, n = P.D.frameCount;
  return P.D.loop ? ((t % n) + n) % n : clamp(t, 0, n);
}
/** 描くたびに、相手役を今のフレームのポーズにする（Unity の再生に近い見た目も、今のアバターと同じく入れる） */
function updatePair() {
  if (!P.M || !P.show) return;
  const f = pairFrame(S.playing ? S.playT : S.frame);
  asPair(() => {
    poseAt(f, S.playing);
    if (S.unityView) applyUnityView();
  });
}

/** 相手役を半透明にする（重なったところを見やすく）。動かしているほうは元に戻す */
function setGhost(root, on) {
  root.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      const base = m.userData.base ??= { alphaTest: m.alphaTest, transparent: m.transparent, depthWrite: m.depthWrite };
      m.transparent = on || base.transparent;
      m.opacity = on ? 0.4 : 1;
      m.alphaTest = on ? base.alphaTest * 0.4 : base.alphaTest;
      m.depthWrite = on ? false : base.depthWrite;
      m.needsUpdate = true;
    }
  });
}
function refreshGhost() {
  if (M) setGhost(M.root, false);
  if (P.M) setGhost(P.M.root, P.ghost);
}

async function loadPair(src) {
  if (!M) return false;
  setStatus('相手役を読み込み中…');
  const r = await parseModelFiles(src.files, src.texByMat, src.body);
  if (!r) { setStatus('相手役: FBX がありません', true); return false; }
  if (r.error) { setStatus('相手役: FBXを読めません: ' + r.error, true); return false; }
  const bufs = src.parts?.meshes?.length ? await fetchParts(src.parts) : null;
  removePair(false);
  P.D = newDocData();
  asPair(() => {
    setModel(r.group, r.name, r.info, P.wrap);
    // 茜犬の見本の .anim を書くときに要る（loadModelFiles と同じ）
    if (r.fileRest) M.fileRest = M.names.map((n, i) => r.fileRest.get(n) ?? { p: M.restWP[i], q: M.restWQ[i] });
    applyBodyShapes(src.body, true);
    if (bufs) addParts(src.parts, bufs, true);
  });
  P.st = {
    sel: null, edited: new Set(), shapeEdited: new Set(), shapeSel: null, boneView: P.M.humanSet.size >= 10 ? 'human' : 'all',
    animHandle: null, avatarId: src.avatarId ?? null, src, unityPath: null, undo: [], redo: [],
  };
  P.show = true;
  updateButtons();
  refreshGhost();
  facePair();
  setStatus(`相手役: ${r.name}` + (r.missing.length ? `  テクスチャなし: ${r.missing.join(', ')}` : ''));
  // 開いたプロジェクトの相手役が、このモデルを待っていたら戻す
  if (P.pending && P.pending.model === r.name) applyPairData(P.pending);
  return true;
}

/** もう 1 体を消す。2 体目を動かしていたときは、残ったほうが 1 体目になる */
function removePair(clearPending = true) {
  if (clearPending) P.pending = null;
  if (!P.M) return;
  for (const L of P.M.limbs) { scene.remove(L.target); scene.remove(L.pole); }
  P.wrap.remove(P.M.root);
  P.M.root.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(m => { m.map?.dispose(); m.dispose(); }); } });
  P.M = P.D = P.st = null;
  S.second = false;
  if (M) setGhost(M.root, false);
  refreshWho();
  pairChanged();
}

/** 今のアバターの正面に、こちらを向けて置く。腰どうしの間は、背の高いほうの 1/4 くらい */
function facePair() {
  if (!M || !P.M) return;
  const up = new THREE.Vector3(0, 1, 0);
  const fwd = modelForward();
  const pf = asPair(() => modelForward());
  const yaw = Math.atan2(-fwd.x, -fwd.z) - Math.atan2(pf.x, pf.z);
  const want = M.restWP[M.hips].clone().addScaledVector(fwd, 0.25 * Math.max(M.size, P.M.size));
  const hips = P.M.restWP[P.M.hips].clone().applyAxisAngle(up, yaw);
  setOtherPlace(placeOf(new THREE.Matrix4().compose(
    new THREE.Vector3(want.x - hips.x, 0, want.z - hips.z), new THREE.Quaternion().setFromAxisAngle(up, yaw), new THREE.Vector3(1, 1, 1))));
  pairChanged();
}

/** 相手役の動きを、docData() の形の物から入れる。戻り値は、相手のモデルに無くて使えなかった骨とシェイプの数 */
function setPairMotion(obj, name) {
  const { doc, missing } = asPair(() => readProject(obj));
  P.D = doc;
  if (name) P.D.name = name;
  P.st.undo.length = P.st.redo.length = 0;
  pairChanged();
  return missing;
}

function applyPairData(pd) {
  const restoring = P.restoring;
  P.restoring = true;
  P.pending = null;
  if (pd.motion) setPairMotion(pd.motion, pd.motion.name || pd.motionName || '');
  P.show = pd.show !== false;
  P.ghost = !!pd.ghost;
  refreshGhost();
  // 置き場所は 2 体目を 1 体目から見た向きで持っている。今は 1 体目を動かしている（開くときは 1 体目に戻すので）
  P.place = { x: 0, y: 0, z: 0, yaw: 0, ...pd.place };
  pairChanged();
  if (pd.active === 1 && !S.second) switchActor();
  P.restoring = restoring;
}
/** プロジェクトを開いたとき。同じアバターならすぐ作り直す。ファイルから読んだ相手役は、同じモデルを選び直すまで待つ */
async function restorePair(pd) {
  if (P.M && P.M.name === pd.model) { applyPairData(pd); return; }
  P.pending = pd;
  if (pd.src === 'unity' && pd.base && UNITY_BASE) {
    P.restoring = true;
    try {
      const u = await filesFromUnity(pd.base);
      if (u) await loadPair(unitySrc(u));
      else setStatus($('status').textContent + `  相手役（${pd.model}）のタブが Unity に残っていません。Unity でそのアバターを開き直して「Unityの別のタブ…」から選ぶと戻ります`, true);
    } finally { P.restoring = false; }
  } else if (pd.src === 'same' && S.modelSrc) {
    // 戻すだけなので、保存していない変更があることにはしない
    P.restoring = true;
    // 読み終わると、loadPair が P.pending（= pd）を戻す
    try { await loadPair({ ...S.modelSrc, kind: 'same' }); }
    finally { P.restoring = false; }
  } else {
    refreshPairUI();
    setStatus($('status').textContent + `  相手役（${pd.model}）は「相手」から同じモデルを選ぶと戻ります`);
  }
}

/** 取り消しの履歴は、アバターごと（骨の番号がモデルごとに違うので） */
function swapArrays(a, b) {
  const t = a.splice(0, a.length, ...b);
  b.length = 0;
  b.push(...t);
}

/**
 * 動かすほうを入れ替える。もう 1 体が原点に来るので、カメラも同じだけ動かして見た目をそのままにする
 */
function switchActor() {
  if (!M || !P.M) return;
  if (S.playing) stopPlay();
  gizmo.detach();
  TL.sel.clear();
  S.contactPick = null;
  const toNew = P.wrap.matrix.clone().invert();
  [M, P.M] = [P.M, M];
  [D, P.D] = [P.D, D];
  for (const k of ACTOR_STATE) [S[k], P.st[k]] = [P.st[k], S[k]];
  if (S.unity) [S.unity.path, P.st.unityPath] = [P.st.unityPath, S.unity.path];
  swapArrays(undoStack, P.st.undo);
  swapArrays(redoStack, P.st.redo);
  [ownWrap, P.wrap] = [P.wrap, ownWrap];
  S.second = !S.second;
  ownWrap.position.set(0, 0, 0);
  ownWrap.quaternion.identity();
  ownWrap.updateMatrixWorld(true);
  placePair();
  refreshGhost();
  camera.position.applyMatrix4(toNew);
  orbit.target.applyMatrix4(toNew);
  orbit.update();
  docVer++;
  buildBoneList();
  buildShapeList();
  buildMeshList();
  buildMarkers();
  refreshBreathUI();
  TL.fit = true;
  goFrame(S.frame);
  attachGizmo();
  refreshAll();
  refreshWho();
  refreshPairUI();
  setStatus(`${S.second ? '2体目' : '1体目'}を動かす: ${M.name}  ${D.name}`);
}

function pairChanged() {
  placePair();
  refreshPairUI();
  drawTimeline();
  if (!M) return;
  if (!P.restoring) markDirty();
  autoSavedVer = -1;
}

function refreshWho() {
  $('bWho').style.display = P.M ? '' : 'none';
  $('bWho').textContent = S.second ? '⇄ 2体目' : '⇄ 1体目';
}

function refreshPairUI() {
  const has = !!P.M;
  $('bPair').classList.toggle('on', has && P.show);
  $('paName').textContent = has
    ? `相手役（${S.second ? '1体目' : '2体目'}）: ${P.M.name}　動き: ${P.D.name}（${P.D.frameCount}F・${P.D.fps}fps${P.D.loop ? '・ループ' : ''}）`
    : P.pending ? `相手役なし（${P.pending.model} を選ぶと、保存してあった置き場所と動きが戻ります）` : '相手役なし';
  $('paSame').disabled = !S.modelSrc;
  for (const id of ['paDel', 'paShow', 'paGhost', 'paMotion', 'paCopy', 'paStill', 'paX', 'paY', 'paZ', 'paYaw', 'paFace', 'paSwap', 'paPin', 'paLook']) $(id).disabled = !has;
  refreshContactUI();
  $('paShow').checked = P.show;
  $('paGhost').checked = P.ghost;
  const pl = has ? otherPlace() : { x: 0, y: 0, z: 0, yaw: 0 };
  const put = (id, v) => { if (document.activeElement !== $(id)) $(id).value = v; };
  put('paX', pl.x); put('paY', pl.y); put('paZ', pl.z); put('paYaw', pl.yaw);
  // Unity は X が逆（モデルの単位はメートル）。1 体目を原点・回転 0 に置いたときの 2 体目
  const u = P.place, n = v => Math.round(v * 1000) / 1000 + 0;
  const uy = ((-u.yaw % 360) + 540) % 360 - 180 || 0;
  $('paUnity').textContent = has ? `Unityでは: 1体目を原点・回転0に置き、2体目を 位置 (${n(-u.x)}, ${n(u.y)}, ${n(u.z)})・回転Y ${n(uy === -180 ? 180 : uy)}° に置く` : '';
}

function openPairPop() {
  refreshPairUI();
  const r = $('bPair').getBoundingClientRect();
  Object.assign($('pairPop').style, { display: 'flex', left: Math.max(4, Math.min(r.left, innerWidth - 560)) + 'px', top: r.bottom + 4 + 'px' });
}
$('bPair').onclick = () => {
  if ($('pairPop').style.display === 'flex') $('pairPop').style.display = 'none';
  else openPairPop();
};
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#pairPop, #bPair')) $('pairPop').style.display = 'none';
});
// ---------- Unity で開いた別のアバター（別のタブ）を相手役にする ----------
// Unity のサーバーはタブごとに /s/合言葉/ で中身を出す。同じサーバーのタブどうしは BroadcastChannel で見つけ合う

/** このタブの場所（Unity から開いたときだけ）。例: /s/0123abcd/ */
const UNITY_BASE = (location.pathname.match(/^\/s\/[0-9a-f]+\//) || [])[0] || null;
const tabs = UNITY_BASE && 'BroadcastChannel' in window ? new BroadcastChannel('sismotion.tabs') : null;
if (tabs) {
  tabs.onmessage = e => {
    const m = e.data;
    if (m?.type === 'who' && S.home) tabs.postMessage({ type: 'here', to: m.from, base: UNITY_BASE, name: S.home.name, avatarId: S.home.avatarId, title: document.title });
    if (m?.type === 'here' && m.to === UNITY_BASE && m.base !== UNITY_BASE) tabsFound.set(m.base, m);
  };
}
const tabsFound = new Map();
const unitySrc = u => ({ files: u.files, texByMat: u.texByMat, body: u.body, parts: u.parts, base: u.base, avatarId: u.man.avatar || null, kind: 'unity' });

async function pickUnityTab() {
  if (!tabs) return;
  tabsFound.clear();
  tabs.postMessage({ type: 'who', from: UNITY_BASE });
  await new Promise(res => setTimeout(res, 400));
  const r = $('paUnityTab').getBoundingClientRect();
  if (!tabsFound.size) {
    setStatus('Unity で開いているほかのアバターがありません。Unity で相手にするアバターを選んで Tools/SisMotionTooL を押すと、別のタブで開きます（そのタブは開いたままにしておく）', true);
    return;
  }
  $('pairPop').style.display = 'none';
  showMenu(r.left, r.bottom + 2, [...tabsFound.values()].map(t => [`${t.name}（${t.title.replace(/ - SisMotionTooL$/, '')}）`, async () => {
    setStatus('相手役を読み込み中…');
    const u = await filesFromUnity(t.base);
    if (!u) { setStatus('そのタブのアバターを読めません。Unity で開き直してください', true); return; }
    await loadPair(unitySrc(u));
  }]));
}

$('bWho').onclick = () => switchActor();
$('paSwap').onclick = () => switchActor();

// ---------- くっつける: 手先・足先を、相手の骨に付けたままキーを打つ ----------

/** 相手役のキーの時刻を、今のアバターのフレームにした物（相手がループなら、今の長さの中でくり返す） */
function pairKeyTicks() {
  if (!P.M || !P.D || !M) return [];
  const keys = asPair(allKeyFrames), k = D.fps / P.D.fps, n = P.D.frameCount * k, out = [];
  for (let lap = 0; lap * n <= D.frameCount + 1e-9; lap++) {
    for (const f of keys) { const t = lap * n + f * k; if (t <= D.frameCount + 1e-9) out.push(t); }
    if (!P.D.loop || n <= 0) break;
  }
  return [...new Set(out)];
}

/** 相手役の骨 i の、フレーム f での行列（今動かしているほうのワールド）。見た目どおり（Unity の再生の姿）で測る */
function pairBoneWorld(i, f) {
  let m;
  asPair(() => {
    poseAt(pairFrame(f), true);
    if (S.unityView) applyUnityView();
    m = M.bones[i].matrixWorld.clone();
  });
  return P.wrap.matrix.clone().multiply(m);
}
/** 相手役の目の間の位置（フレーム f、今動かしているほうのワールド） */
function pairEyeWorld(f) {
  let v;
  asPair(() => {
    poseAt(pairFrame(f), true);
    if (S.unityView) applyUnityView();
    v = M.human.Head != null ? eyePos() : null;
  });
  return v && v.applyMatrix4(P.wrap.matrix);
}


/** くっつける物: IK の手先・足先（{ limb }）か、腰・ルート（{ bone }。位置ごと動かせる骨） */
const whatLabel = w => (w.limb != null ? M.limbs[w.limb].label : M.names[w.bone]);
const whatBone = w => (w.limb != null ? M.limbs[w.limb].c : w.bone);

function startContactPick() {
  if (!M || !P.M) return;
  const sel = S.sel;
  const what = sel?.kind === 'ik' || sel?.kind === 'pole' ? { limb: sel.limb } : sel?.kind === 'bone' && hasPos(sel.i) ? { bone: sel.i } : null;
  if (!what) { setStatus('先に、IKの手先・足先か、腰（ルート）を選んでください', true); return; }
  S.contactPick = what;
  // 手先のギズモが、ちょうどクリックしたい所に重なるので外しておく
  gizmo.detach();
  $('pairPop').style.display = 'none';
  setStatus(`${whatLabel(what)}をくっつける所を、相手の体でクリック（Escでやめる）`);
}

/** くっつける相手の骨をクリックで選ぶ（pick から） */
function pickContact() {
  const what = S.contactPick;
  S.contactPick = null;
  attachGizmo();
  if (!P.M) return;
  const other = P.M.meshes.filter(m => m.visible);
  for (const m of other) if (m.isSkinnedMesh) { m.boundingSphere = null; m.boundingBox = null; }
  const h = P.show ? raycaster.intersectObjects(other, false)[0] : null;
  if (!h) { setStatus('相手の体に当たりませんでした。もう一度「選んだ手足・腰 → 相手の体…」から', true); return; }
  const bone = asPair(() => boneAtHit(h));
  if (bone < 0) { setStatus('相手の骨が見つかりませんでした', true); return; }
  // 今のフレームの、相手の骨と手先・足先の関係を覚える
  const hand = M.bones[whatBone(what)].matrixWorld.clone();
  const off = pairBoneWorld(bone, S.frame).invert().multiply(hand);
  const keys = allKeyFrames();
  contact = { what, bone, off, from: 0, to: D.frameCount, step: 1, rot: true, model: P.M, me: M };
  // 範囲は、キーのある所全部（キーが 1 か所だけなら全体）
  if (keys.length > 1) { contact.from = Math.min(S.frame, keys[0]); contact.to = Math.max(S.frame, keys[keys.length - 1]); }
  refreshContactUI();
  openPairPop();
  setStatus(`${whatLabel(what)} → 相手の ${P.M.names[bone]}。範囲を決めて「キーを打つ」`);
}

function refreshContactUI() {
  const ok = contact && contact.me === M && contact.model === P.M;
  if (!ok) contact = null;
  $('paPinRow').style.display = ok ? 'flex' : 'none';
  $('paPinInfo').textContent = !ok ? '' : contact.look ? '視線 → 相手の顔' : `${whatLabel(contact.what)} → 相手の ${P.M.names[contact.bone]}`;
  $('paRot').parentElement.style.display = ok && contact.look ? 'none' : '';
  if (!ok) return;
  $('paFrom').value = contact.from;
  $('paTo').value = contact.to;
  $('paStep').value = contact.step;
  $('paRot').checked = contact.rot;
}

/** from〜to の step ごと（to は必ず）に、手先・足先を相手の骨に付けた姿勢を IK で解いてキーを打つ */
/** 視線: 首と頭を相手の顔に向ける。範囲は今のキーのある所全部（1 か所だけなら全体） */
function startLook() {
  if (!M || !P.M) return;
  if (M.human.Head == null || P.M.human.Head == null) { setStatus('頭の骨が見つかりません', true); return; }
  const keys = allKeyFrames();
  contact = { look: true, from: 0, to: D.frameCount, step: 1, model: P.M, me: M };
  if (keys.length > 1) { contact.from = keys[0]; contact.to = keys[keys.length - 1]; }
  refreshContactUI();
  setStatus('視線を相手の顔へ。範囲を決めて「キーを打つ」');
}

/** フレームの並び: from〜to の step ごと（to は必ず） */
function contactFrames() {
  const from = clamp(Math.round(contact.from), 0, D.frameCount), to = clamp(Math.round(contact.to), from, D.frameCount);
  const step = Math.max(1, Math.round(contact.step) || 1);
  const frames = [];
  for (let f = from; f <= to; f += step) frames.push(f);
  if (frames[frames.length - 1] !== to) frames.push(to);
  return frames;
}

function bakeLook() {
  const frames = contactFrames();
  const bones = [M.human.Neck, M.human.Head].filter(i => i != null);
  pushUndo();
  const out = [];
  for (const f of frames) {
    poseAt(f);
    const eye = pairEyeWorld(f);
    if (!eye) continue;
    LOOK.target.position.copy(eye);
    LOOK.target.updateMatrixWorld(true);
    solveLook();
    out.push([f, bones.map(i => [i, M.bones[i].quaternion.clone()])]);
  }
  for (const [f, list] of out) for (const [i, q] of list) insertKey(track(i).keys, { f, q, p: null });
  docVer++;
  markDirty();
  goFrame(S.frame);
  setStatus(`視線を相手の顔に向けて、${out.length}フレームにキーを打ちました`);
}

function bakeContact() {
  if (!contact || contact.me !== M || contact.model !== P.M) return;
  if (contact.look) { bakeLook(); return; }
  const w = contact.what;
  const L = w.limb != null ? M.limbs[w.limb] : null;
  const frames = contactFrames();
  pushUndo();
  // 解くのは全部、今のキーのままの姿から（打ったキーで次のフレームの解き方が変わらないように）。キーは最後にまとめて打つ
  const out = [];
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  let miss = 0, missAt = -1;
  for (const f of frames) {
    poseAt(f);
    pairBoneWorld(contact.bone, f).multiply(contact.off).decompose(p, q, sc);
    if (!L) {
      // 腰・ルート: その骨ごと動かす（手足は付いてくる。足を床に残したいときは、そのあと足をくっつけ直す）
      const b = M.bones[w.bone];
      setWorldPos(b, p);
      if (contact.rot) setWorldQuat(b, q);
      out.push([f, [[w.bone, b.quaternion.clone(), b.position.clone()]]]);
      continue;
    }
    L.target.position.copy(p);
    L.target.quaternion.copy(contact.rot ? q : wq(M.bones[L.c]));
    L.target.updateMatrixWorld(true);
    L.pole.position.copy(defaultPole(L));
    L.pole.updateMatrixWorld(true);
    solveLimb(L);
    const d = wp(M.bones[L.c]).distanceTo(p);
    if (d > miss) { miss = d; missAt = f; }
    out.push([f, [L.a, L.b, L.c].map(i => [i, M.bones[i].quaternion.clone(), M.bones[i].position.clone()])]);
  }
  for (const [f, list] of out) for (const [i, bq, bp] of list) insertKey(track(i).keys, { f, q: bq, p: hasPos(i) ? bp : null });
  docVer++;
  markDirty();
  goFrame(S.frame);
  // 届かないフレーム（腕・脚が伸び切る）は、そこまで伸ばしてキーを打つ。どれだけ足りないかを知らせる
  const short = miss > M.size * 0.005;
  setStatus(`${whatLabel(w)}を相手の ${P.M.names[contact.bone]} にくっつけて、${frames.length}フレームにキーを打ちました` +
    (short ? `  届かないフレームがあります（${missAt}Fで${(miss / M.size * 100).toFixed(1)}%（背の高さに対して）足りない。体を近づけてから打ち直してください）` : ''), short);
}

/** Unity が覚えていた編集用のデータ（または .anim から起こしたポーズ）を開く */
function applyMotionJson(obj, fileName) {
  if (S.dirty && hasKeys() && !confirm('保存していない変更があります。開きますか？')) return;
  pushUndo();
  const notes = [];
  if (obj.model && obj.model !== M.name) notes.push(`モデルが違う（${obj.model}）`);
  applyHumanFromJson(obj);
  if (obj.model === M.name && setUnityInfo(obj)) notes.push('関節の軸はUnity');
  D.fps = obj.fps || 30;
  D.frameCount = Math.max(1, obj.frameCount || 60);
  D.loop = !!obj.loop;
  D.breath = { on: false, period: 4, amp: 100, ...(obj.breath || {}) };
  D.name = clipNameOf(fileName);
  D.tracks.clear();
  D.shapes.clear();
  D.interp.clear();

  const usable = Array.isArray(obj.tracks) && obj.tracks.length && obj.tracks.every(t => M.byName.has(t.bone)) && obj.model === M.name;
  if (usable) {
    for (const t of obj.tracks) {
      const i = M.byName.get(t.bone);
      D.tracks.set(i, { keys: t.keys.map(k => ({ f: k.f, q: new THREE.Quaternion().fromArray(k.q), p: k.p && hasPos(i) ? new THREE.Vector3().fromArray(k.p) : null })) });
    }
    for (const [f, m] of obj.interp || []) D.interp.set(f, m);
  } else if (obj.poses?.length) {
    const fit = fitRest(obj);
    if (!fit.ok) { undoStack.pop(); setStatus(fit.message, true); return; }
    notes.push(`骨の位置の差 最大${(fit.error / M.size * 100).toFixed(2)}%`);
    posesToTracks(obj, fit.scale);
  }
  // シェイプ: HTML が書いたキーがあればそれ、無ければ Unity が書いたカーブのキー
  let missingShapes = 0;
  if (Array.isArray(obj.shapes) && obj.shapes.length && obj.model === M.name) {
    for (const sh of obj.shapes) {
      const id = `${sh.mesh}|${sh.name}`;
      if (M.shapeById.has(id)) D.shapes.set(id, { keys: sh.keys.map(k => ({ f: k.f, v: k.v })) });
      else missingShapes++;
    }
  } else for (const c of obj.shapeCurves || []) {
    const id = `${c.path}|${c.name}`;
    if (!M.shapeById.has(id)) { missingShapes++; continue; }
    const keys = [];
    c.frames.forEach((f, k) => {
      if (c.key && c.key[k] === 0) return;
      keys.push({ f, v: c.values[k] });
      const m = c.interp?.[k];
      // HTML が書いたものは Auto も Linear として書いている（キーの間を毎フレーム埋めているため）
      if (m && !D.interp.has(f) && !(m === 1 && obj.restFrom !== 'unity')) D.interp.set(f, m);
    });
    D.shapes.set(id, { keys });
  }
  if (missingShapes) notes.push(`モデルに無いシェイプ${missingShapes}個`);
  docVer++;
  S.dirty = false;
  TL.sel.clear();
  TL.fit = true;
  goFrame(0);
  refreshAll();
  setStatus(`開いた: ${fileName}  キー${allKeyFrames().length}個` + (notes.length ? '  ' + notes.join('、') : ''), notes.some(n => n.startsWith('モデル')));
}

/** json の rest（書いた側の単位）と、このモデルの骨の位置を比べて倍率を出す（腰からの相対）。 */
function fitRest(obj) {
  if (!Array.isArray(obj.restBones) || !Array.isArray(obj.rest)) return { ok: false, message: 'jsonに元のポーズがありません' };
  const hj = obj.restBones.indexOf(obj.hips), hi = M.byName.get(obj.hips);
  const oj = hj >= 0 ? new THREE.Vector3().fromArray(obj.rest, hj * 3) : new THREE.Vector3();
  const oi = hi != null ? M.restWP[hi] : new THREE.Vector3();
  const a = [], b = [];
  obj.restBones.forEach((n, k) => {
    const i = M.byName.get(n);
    if (i == null) return;
    a.push(M.restWP[i].clone().sub(oi));
    b.push(new THREE.Vector3().fromArray(obj.rest, k * 3).sub(oj));
  });
  if (a.length < 3) return { ok: false, message: 'モデルと名前が合う骨がほとんどありません' };
  let ab = 0, bb = 0;
  a.forEach((v, k) => { ab += v.dot(b[k]); bb += b[k].dot(b[k]); });
  const scale = bb > 0 ? ab / bb : 1;
  let error = 0;
  a.forEach((v, k) => { error = Math.max(error, b[k].clone().multiplyScalar(scale).distanceTo(v)); });
  if (!(scale > 0) || error > M.size * 0.02) return { ok: false, message: `骨の位置がモデルと合いません（最大${(error / M.size * 100).toFixed(1)}%）` };
  return { ok: true, scale, error };
}

/** 差分のポーズ（Unity が書いたもの）を、骨ごとのキーにする。 */
function posesToTracks(obj, scale) {
  const order = (obj.bones || []).map((n, k) => [M.byName.get(n), k]).filter(([i]) => i != null).sort((x, y) => M.depth[x[0]] - M.depth[y[0]]);
  const hi = M.byName.get(obj.hips) ?? M.hips;
  const saved = savePose();
  // HTML が書いたもの（キーの間も入っている）は、キーを打ったフレームだけにする
  const poses = (obj.poses || []).filter(p => p.key !== 0);
  for (const p of poses) {
    applyRest();
    const place = ([i, k]) => setWorldQuat(M.bones[i], new THREE.Quaternion().fromArray(p.rot, k * 4).multiply(M.restWQ[i]));
    order.filter(([i]) => M.humanSet.has(i)).forEach(place);
    if (obj.restFrom === 'unity') unityBonesToRaw();
    if (p.hipsPos && hi != null) setWorldPos(M.bones[hi], M.restWP[hi].clone().add(new THREE.Vector3().fromArray(p.hipsPos).multiplyScalar(scale)));
    // 人型でない骨の向きは、再生の姿（表示と同じ）での向きとして書かれている
    const view = applyUnityView();
    order.filter(([i]) => !M.humanSet.has(i)).forEach(place);
    restoreUnityView(view);
    const keyed = new Set(order.map(([i]) => i));
    if (hi != null) keyed.add(hi);
    for (const i of keyed) {
      const b = M.bones[i];
      const keys = track(i).keys;
      keys.push({ f: p.frame, q: b.quaternion.clone(), p: i === M.hips ? b.position.clone() : null });
    }
    if (p.interp && !(p.interp === 1 && obj.restFrom !== 'unity')) D.interp.set(p.frame, p.interp);
  }
  for (const t of D.tracks.values()) t.keys.sort((a, b) => a.f - b.f);
  restorePose(saved);
}

/** 1行の入力。やめたら null。 */
function ask(title, value) {
  return new Promise(res => {
    const m = $('ask'), input = m.querySelector('input');
    m.querySelector('h3').textContent = title;
    input.value = value;
    const close = v => { m.classList.remove('show'); input.onkeydown = null; res(v); };
    m.querySelector('.ok').onclick = () => close(input.value.trim() || null);
    m.querySelector('.no').onclick = () => close(null);
    m.onclick = e => { if (e.target === m) close(null); };
    input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') close(input.value.trim() || null); else if (e.key === 'Escape') close(null); };
    m.classList.add('show');
    input.focus();
    input.select();
  });
}

/**
 * 数字の欄を、左右のドラッグ（右で増える）とホイール（上で増える）でも変えられるようにする。
 * 動かさずに離したときだけ、ふつうの欄として打ち込める。Shift を押すと 5 ずつ。
 */
function scrubNumber(el, get, set) {
  const PX = 6; // 1 増やすのに動かす量
  el.style.cursor = 'ew-resize';
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || document.activeElement === el) return; // 打ち込み中はふつうの欄
    e.preventDefault();
    const x0 = e.clientX, v0 = get();
    let moved = false;
    el.setPointerCapture(e.pointerId);
    const move = ev => {
      const dx = ev.clientX - x0;
      if (!moved && Math.abs(dx) < 3) return;
      moved = true;
      set(v0 + Math.trunc(dx / PX) * (ev.shiftKey ? 5 : 1));
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      if (!moved) { el.focus(); el.select(); }
    };
    el.addEventListener('pointermove', move);

const CODE_LABEL = { Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc' };

/** 吸い切りと吐き切りの差（度、強さ 100% のとき）。首と頭は胸の分を戻して、顔の向きを変えない */
const BREATH_DEG = { Spine: 0.6, Chest: 1.2, UpperChest: 1.2, Shoulder: 2.5 };

function breathBones() {
  if (!M || !D.breath.on || !(D.breath.amp > 0)) return [];
  return ['Spine', 'Chest', 'UpperChest', 'Neck', 'Head', 'LeftShoulder', 'RightShoulder'].map(n => M.human[n]).filter(i => i != null);
}
/** 1 回の呼吸のフレーム数。ループのときは、ループの長さにちょうど整数回入るようにする */
function breathCycle() {
  const p = Math.max(0.5, D.breath.period || 4) * D.fps;
  if (!D.loop) return { frames: p, count: 0 };
  const count = Math.max(1, Math.round(D.frameCount / p));
  return { frames: D.frameCount / count, count };
}
/** 0（吐き切り）〜 1（吸い切り）。吸うのを短く、吐くのを長く */
function breathWave(f) {
  const u = (((f / breathCycle().frames) % 1) + 1) % 1, a = 0.4;
  return u < a ? 0.5 - 0.5 * Math.cos(Math.PI * u / a) : 0.5 + 0.5 * Math.cos(Math.PI * (u - a) / (1 - a));
}
function applyBreath(f) {
  if (!breathBones().length) return;
  const s = (breathWave(f) - 0.5) * (D.breath.amp / 100) * Math.PI / 180;
  const up = new THREE.Vector3(0, 1, 0), right = modelForward().cross(up).normalize();
  // 体の向きに合わせる（親の骨が元のポーズから回った分）
  const bodyQ = i => { const p = M.parent[i]; return p < 0 ? new THREE.Quaternion() : wq(M.bones[p]).multiply(M.restWQ[p].clone().invert()); };
  const pitch = (i, deg) => rotateWorld(M.bones[i], axisAngleQ(right.clone().applyQuaternion(bodyQ(i)), deg * s));
  let total = 0;
  for (const n of ['Spine', 'Chest', 'UpperChest']) {
    const i = M.human[n];
    if (i == null) continue;
    pitch(i, BREATH_DEG[n]);
    total += BREATH_DEG[n];
  }
  const back = [M.human.Neck, M.human.Head].filter(i => i != null);
  back.forEach(i => pitch(i, -total / back.length));
  for (const side of ['Left', 'Right']) {
    const i = M.human[side + 'Shoulder'], c = M.human[side + 'UpperArm'];
    if (i == null || c == null) continue;
    const axis = wp(M.bones[c]).sub(wp(M.bones[i])).cross(up.clone().applyQuaternion(bodyQ(i)));
    if (axis.lengthSq() < 1e-12) continue;
    rotateWorld(M.bones[i], axisAngleQ(axis.normalize(), BREATH_DEG.Shoulder * s));
  }
}

const hasVideo = () => !!V.url && !V.image && V.el.readyState >= 1;
/** フレーム f のときの動画の時刻 */
const videoTimeOf = f => V.offset + f / D.fps;

function refreshVideoUI() {
  $('vpane').style.width = V.width + 'px';
  $('bVideo').classList.toggle('on', $('vpane').style.display !== 'none');
  V.el.style.transform = $('vimg').style.transform = V.mirror ? 'scaleX(-1)' : '';
  V.el.style.display = V.image ? 'none' : '';
  $('vimg').style.display = V.image ? '' : 'none';
  document.querySelectorAll('#vpane .vvid').forEach(e => { e.style.display = V.image ? 'none' : ''; });
  $('vStart').value = Math.round(V.offset * 1000) / 1000;
  for (const id of ['vStart', 'vZero']) $(id).disabled = !hasVideo();
  V.el.muted = V.muted;
  $('vMirror').classList.toggle('on', V.mirror);
  $('vMute').textContent = V.muted ? '音なし' : '音あり';
  $('vEmpty').style.display = V.url ? 'none' : '';
  for (const id of ['vBack', 'vFwd', 'vSeek']) $(id).disabled = !hasVideo();
  refreshVideoTime();
}
function refreshVideoTime() {
  if (!hasVideo()) { $('vTime').textContent = ''; return; }
  const t = videoTimeOf(S.frame);
  $('vSeek').max = V.el.duration || 0;
  $('vSeek').value = t;
  const mmss = x => `${Math.floor(x / 60)}:${(x % 60).toFixed(2).padStart(5, '0')}`;
  $('vTime').textContent = `${mmss(Math.max(0, t))} = ${S.frame}F`;
}
function seekVideo(t) {
  if (!hasVideo()) return;
  const d = V.el.duration || 0;
  V.el.currentTime = clamp(t, 0, Math.max(0, d - 0.001));
}
function videoFollow() {
  if (!hasVideo() || S.playing) return;
  seekVideo(videoTimeOf(S.frame));
  refreshVideoTime();
}
function videoPlay() {
  if (!hasVideo()) return;
  seekVideo(videoTimeOf(S.playT));
  if (videoTimeOf(S.playT) < V.el.duration) V.el.play().catch(() => {});
}
function videoPause() {
  if (hasVideo()) V.el.pause();
}
/** 再生中、動画が遅れたり進みすぎたりしたら合わせ直す（ループで戻ったときも） */
function videoSync() {
  // 最後まで行って止めたフレームでも呼ばれるので、止めたあとは動かし直さない
  if (!hasVideo() || !S.playing) return;
  const t = videoTimeOf(S.playT);
  if (t < 0 || t >= V.el.duration) { if (!V.el.paused) V.el.pause(); seekVideo(t); return; }
  if (Math.abs(V.el.currentTime - t) > 0.15) seekVideo(t);
  if (V.el.paused) V.el.play().catch(() => {});
  refreshVideoTime();
}

function openVideo(file) {
  if (!file) return;
  if (V.url) URL.revokeObjectURL(V.url);
  V.url = URL.createObjectURL(file);
  V.image = /^image\//.test(file.type) || /\.(png|jpe?g|webp|bmp|gif)$/i.test(file.name);
  V.offset = 0;
  if (V.image) { V.el.pause(); V.el.removeAttribute('src'); V.el.load(); $('vimg').src = V.url; }
  else { $('vimg').removeAttribute('src'); V.el.src = V.url; }
  refreshVideoUI();
  $('vName').textContent = file.name;
  $('vName').title = file.name;
}
V.el.addEventListener('loadedmetadata', () => { videoFollow(); refreshVideoUI(); });
$('vimg').addEventListener('load', refreshVideoUI);
$('bVideo').onclick = () => {
  const p = $('vpane');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  refreshVideoUI();
};
$('vOpen').onclick = () => $('vFile').click();
$('vFile').onchange = e => { openVideo(e.target.files[0]); e.target.value = ''; };
$('vbox').addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
$('vbox').addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  const f = [...e.dataTransfer.files].find(x => /^(video|image)\//.test(x.type) || /\.(mp4|webm|mov|mkv|png|jpe?g|webp)$/i.test(x.name));
  if (f) openVideo(f);
});
$('vMirror').onclick = () => { V.mirror = !V.mirror; saveVideoPrefs(); refreshVideoUI(); };
$('vMute').onclick = () => { V.muted = !V.muted; saveVideoPrefs(); refreshVideoUI(); };
// つまみは「今のフレームのときの動画の時刻」。動かすと、動画とタイムラインの対応がずれる
$('vSeek').oninput = e => { V.offset = Number(e.target.value) - S.frame / D.fps; seekVideo(Number(e.target.value)); refreshVideoTime(); $('vStart').value = Math.round(V.offset * 1000) / 1000; };
const nudge = dir => { V.offset += dir / D.fps; videoFollow(); refreshVideoUI(); };
$('vStart').onchange = e => { V.offset = Number(e.target.value) || 0; videoFollow(); refreshVideoUI(); };
// 今見えている動画の位置を 0 フレームにして、0 フレームへ行く
$('vZero').onclick = () => { V.offset = V.el.currentTime; goFrame(0); refreshVideoUI(); };
$('vBack').onclick = () => nudge(-1);
$('vFwd').onclick = () => nudge(1);

// 幅（左の縁をドラッグ）
$('vresize').addEventListener('pointerdown', e => {
  e.preventDefault();
  const x0 = e.clientX, w0 = V.width;
  const move = ev => { V.width = clamp(w0 - (ev.clientX - x0), 200, window.innerWidth * 0.7); $('vpane').style.width = V.width + 'px'; };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveVideoPrefs(); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

// ---------- 対称（左右の骨を一緒に動かす） ----------

$('bSym').onclick = () => { S.sym = !S.sym; updateButtons(); };

/** 親の骨の、元のポーズからの回し方（ワールド） */
const parentDelta = i => (M.parent[i] >= 0 ? deltaOf(M.parent[i]) : new THREE.Quaternion());

/** 骨 i を動かしたら、反対側の骨に左右反転した回し方を入れる（親からの回し方で。体が傾いていても対称になる） */
function mirrorBoneEdit(i) {
  if (!S.sym) return;
  const j = partnerOf(i);
  if (j === i) return;
  const own = parentDelta(i).invert().multiply(deltaOf(i));
  setWorldQuat(M.bones[j], parentDelta(j).multiply(mirrorQ(own)).multiply(M.restWQ[j]));
  constrainBone(j);
  S.edited.add(j);
}

/** 手先・足先（またはポール）を動かしたら、反対側の手先・足先とポールを鏡の位置に置いて解く */
function mirrorLimbEdit(L) {
  if (!S.sym) return;
  const key = L.key.startsWith('Left') ? L.key.replace('Left', 'Right') : L.key.replace('Right', 'Left');
  const R = M.limbs.find(x => x.key === key);
  if (!R) return;
  // 左右の共通の親（腕なら胸、脚なら腰）の向きの中で反転する
  let c = M.parent[L.a];
  while (c >= 0 && !isAncestor(c, R.a)) c = M.parent[c];
  const g = c >= 0 ? deltaOf(c) : new THREE.Quaternion(), gi = g.clone().invert();
  const o = c >= 0 ? wp(M.bones[c]) : new THREE.Vector3();
  const mirP = p => o.clone().add(mirrorV(p.clone().sub(o).applyQuaternion(gi)).applyQuaternion(g));
  R.target.position.copy(mirP(L.target.position));
  R.pole.position.copy(mirP(L.pole.position));
  // 手先の向き: 元のポーズからの回し方を、共通の親の中で反転
  const d = L.target.quaternion.clone().multiply(M.restWQ[L.c].clone().invert());
  R.target.quaternion.copy(g.clone().multiply(mirrorQ(gi.clone().multiply(d).multiply(g))).multiply(gi).multiply(M.restWQ[R.c]));
  R.target.updateMatrixWorld(true);
  R.pole.updateMatrixWorld(true);
  solveLimb(R);
}

// ---------- 頭の向き（的を動かすと、首と頭がそちらを向く） ----------

const LOOK = { target: new THREE.Object3D() };
scene.add(LOOK.target);

/** 目の間の位置。目の骨が無ければ、頭の骨から少し上 */
function eyePos() {
  const H = M.human;
  if (H.LeftEye != null && H.RightEye != null) return wp(M.bones[H.LeftEye]).add(wp(M.bones[H.RightEye])).multiplyScalar(0.5);
  return wp(M.bones[H.Head]).add(new THREE.Vector3(0, M.size * 0.05, 0).applyQuaternion(deltaOf(H.Head)));
}
const headForward = () => modelForward().applyQuaternion(deltaOf(M.human.Head));

function syncLook() {
  if (!M || M.human.Head == null || (S.sel?.kind === 'look' && gizmo.dragging)) return;
  LOOK.target.position.copy(eyePos().addScaledVector(headForward(), M.size * 0.35));
  LOOK.target.updateMatrixWorld(true);
}

/**
 * 首に 4 割、残りを頭で向ける。毎回、体（首の親）を基準に向きを決め直す（少しずつ足すと、回しているうちに首がねじれていく）。
 * 頭は体の上向きに対して傾けない。上限があるときは、左右と上下の角度を LOOK_LIMIT に収める
 */
function solveLook() {
  const H = M.human, neck = H.Neck, head = H.Head, t = LOOK.target.position;
  const base = parentDelta(neck ?? head), inv = base.clone().invert();
  const up = new THREE.Vector3(0, 1, 0), fwd = modelForward(), left = up.clone().cross(fwd).normalize();
  const rad = Math.PI / 180;
  // 頭を回すと目の位置も動くので、数回決め直す
  for (let k = 0; k < 3; k++) {
    const d = t.clone().sub(eyePos()).applyQuaternion(inv).normalize();
    let yaw = Math.atan2(d.dot(left), d.dot(fwd)), pitch = Math.asin(clamp(d.dot(up), -1, 1));
    if (S.limits !== false) {
      // 後ろ側（上限の外）にいるあいだは、直前に向いていた側に留める（真後ろで左右に振れないように）
      const lim = LOOK_LIMIT.yaw * rad;
      if (Math.abs(yaw) > lim && LOOK.lastYaw != null) yaw = LOOK.lastYaw >= 0 ? lim : -lim;
      yaw = clamp(yaw, -lim, lim);
      pitch = clamp(pitch, -LOOK_LIMIT.down * rad, LOOK_LIMIT.up * rad);
    }
    const turn = frac => axisAngleQ(up, yaw * frac).multiply(axisAngleQ(left, -pitch * frac));
    if (k === 2) LOOK.lastYaw = yaw;
    if (neck != null) setWorldQuat(M.bones[neck], base.clone().multiply(turn(0.4)).multiply(M.restWQ[neck]));
    setWorldQuat(M.bones[head], base.clone().multiply(turn(1)).multiply(M.restWQ[head]));
  }
  if (neck != null) S.edited.add(neck);
  S.edited.add(head);
}

// ---------- 上限（人の体で無理な回し方をしない。ボタンで外せる） ----------

S.limits = (() => { try { return localStorage.getItem('mt.limits') !== '0'; } catch (e) { return true; } })();
$('bLimit').onclick = () => {
  S.limits = !S.limits;
  try { localStorage.setItem('mt.limits', S.limits ? '1' : '0'); } catch (e) { /* 覚えられなくてもいい */ }
  updateButtons();
};

/** [ねじり, 傾き] の上限（度）。人が回せる角度より少し上。null はその向きを縛らない。手首と前腕のねじりの合計は 180° 未満にする（180° で裏返るため） */
const LIMIT_DEG = {
  Spine: [35, 50], Chest: [35, 50], UpperChest: [35, 50], Neck: [55, 50], Head: [55, 50],
  Shoulder: [null, 50], UpperArm: [120, null], LowerArm: [110, null], Hand: [60, 95],
  UpperLeg: [70, null], LowerLeg: [45, null], Foot: [50, 70],
};
/** 頭の向きの的で、首と頭を合わせて向けられる角度（度） */
const LOOK_LIMIT = { yaw: 100, up: 60, down: 70 };

function limitOf(i) {
  if (!M.limitMap) {
    M.limitMap = new Map();
    for (const [hn, i] of Object.entries(M.human)) {
      if (i == null) continue;
      const lim = LIMIT_DEG[hn.replace(/^(Left|Right)/, '')];
      if (!lim) continue;
      const c = M.children[i].find(k => M.restWP[k].distanceToSquared(M.restWP[i]) > 1e-10);
      const dir = c != null ? M.restWP[c].clone().sub(M.restWP[i]) : M.restWP[i].clone().sub(M.restWP[M.parent[i]]);
      M.limitMap.set(i, { axis: toParentFrame(i, dir), twist: lim[0], swing: lim[1] });
    }
  }
  return M.limitMap.get(i);
}

/** 骨のローカルの回転を上限に収める。変えたら true */
function applyLimits(i) {
  if (!S.limits || !M) return false;
  const L = limitOf(i);
  if (!L) return false;
  const b = M.bones[i];
  const delta = b.quaternion.clone().multiply(M.restQ[i].clone().invert());
  const { swing, twist } = swingTwist(delta, L.axis);
  let changed = false;
  if (L.twist != null) {
    const ang = 2 * Math.atan2(twist.x * L.axis.x + twist.y * L.axis.y + twist.z * L.axis.z, twist.w);
    const a = Math.atan2(Math.sin(ang), Math.cos(ang)), max = L.twist * Math.PI / 180;
    if (Math.abs(a) > max) { twist.setFromAxisAngle(L.axis, Math.sign(a) * max); changed = true; }
  }
  if (L.swing != null) {
    if (swing.w < 0) swing.set(-swing.x, -swing.y, -swing.z, -swing.w);
    const ang = 2 * Math.acos(clamp(swing.w, -1, 1)), max = L.swing * Math.PI / 180;
    if (ang > max) { swing.copy(new THREE.Quaternion().slerp(swing, max / ang)); changed = true; }
  }
  if (!changed) return false;
  b.quaternion.copy(swing.multiply(twist).multiply(M.restQ[i]).normalize());
  b.updateMatrixWorld(true);
  return true;
}

/** 骨の自由度と上限の両方に収める。変えたら true */
function constrainBone(i) {
  const a = constrainDof(i);
  const b = applyLimits(i);
  return a || b;
}

refreshBreathUI();
refreshVideoUI();

// 確認用（コンソールから触る）
window.MTP = { V, applyLimits, limitOf, poseAt, applyBreath, breathWave, breathCycle, openVideo, LOOK, solveLook, syncLook, mirrorBoneEdit, mirrorLimbEdit, eyePos, headForward };

// ================================================================
//  ループ
// ================================================================

let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  if (S.playing && M) {
    S.playT += dt * D.fps;
    if (S.playT > D.frameCount) {
      if (D.loop) S.playT %= D.frameCount;
      else { S.playT = D.frameCount; stopPlay(); }
    }
    poseAt(S.playT, true);
    syncLimbs();
    videoSync();
    const f = Math.floor(S.playT);
    if (f !== S.frame) { S.frame = f; $('frame').value = f; drawTimeline(); }
  }
  updatePair();
  scene.updateMatrixWorld();
  if (M) updateMarkers();
  const view = M && S.unityView ? applyUnityView() : null;
  renderer.render(scene, camera);
  restoreUnityView(view);
  requestAnimationFrame(tick);
}
updateButtons();
updateTitle();
resize();
requestAnimationFrame(tick);

// ================================================================
//  最初に出すモデル。ページとして開いたとき（http）だけ。file:// では読めない
// ================================================================

/** index.html から見た場所。無いファイルは飛ばす。.motiontool.json は人型の骨の対応と関節の軸（Unity で FBX から書き出した物）。 */
const DEFAULT_MODEL = [
  'akane ver1.0/FBX/PC_akane.fbx',
  'akane ver1.0/FBX/PC_akane.fbx.motiontool.json',
  'akane ver1.0/TEX/C_undertights.png',
  'akane ver1.0/TEX/EX3_Body1.png',
  'akane ver1.0/TEX/EX3_Body2(SiroinoSotai).png',
  'akane ver1.0/TEX/EX3_clothes.png',
  'akane ver1.0/TEX/EX3_hair.png',
];

async function filesFromUrls(urls) {
  const files = await Promise.all(urls.map(async u => {
    try {
      const r = await fetch(u);
      if (!r.ok) return null;
      const f = new File([await r.blob()], decodeURIComponent(u.split('/').pop()));
      f._path = decodeURIComponent(new URL(u, location.href).pathname);
      return f;
    } catch (e) { return null; }
  }));
  return files.filter(Boolean);
}

/**
 * UnityのTools/SisMotionTooLから開いたとき（アドレスに ?unity が付く）。Unityが立てたサーバーから、選んだアバターを受け取る。
 * テクスチャは、Unityが「FBXのマテリアル名 → 画像」の対応を付けて渡す。
 */
async function filesFromUnity(base = '') {
  // base: ほかのタブ（Unity で開いた別のアバター）の物を読むとき、そのタブの場所（/s/合言葉/）
  const at = u => (u && base ? new URL(u, location.origin + base).href : u);
  let man;
  try { const r = await fetch(at('unity/manifest.json')); if (!r.ok) return null; man = await r.json(); } catch (e) { return null; }
  for (const k of ['fbx', 'info', 'body', 'parts']) man[k] = at(man[k]);
  for (const t of man.textures || []) t.url = at(t.url);
  const get = async (url, name) => {
    try { const r = await fetch(url); return r.ok ? new File([await r.blob()], name) : null; } catch (e) { return null; }
  };
  const texs = man.textures || [];
  let body = null;
  if (man.body) { try { const r = await fetch(man.body); if (r.ok) body = await r.json(); } catch (e) { body = null; } }
  let parts = null;
  if (man.parts) { try { const r = await fetch(man.parts); if (r.ok) parts = await r.json(); } catch (e) { parts = null; } }
  if (parts && base) for (const pm of parts.meshes || []) { pm.url = at(pm.url); for (const sub of pm.subs || []) sub.tex = at(sub.tex); }
  const [fbx, info, ...images] = await Promise.all([
    get(man.fbx, man.model), get(man.info, man.model + '.motiontool.json'), ...texs.map(t => get(t.url, t.file)),
  ]);
  if (!fbx) return null;
  const texByMat = new Map();
  texs.forEach((t, i) => { if (images[i]) texByMat.set(t.material.toLowerCase(), images[i]); });
  return { files: [fbx, info, ...images].filter(Boolean), texByMat, man, body, parts, base };
}

/** Unityで.animを選んで開いたとき。Unityが覚えていた編集用のデータか、無ければ.animから起こしたポーズが来る。 */
async function openFromUnity(man) {
  S.unity = { path: man.anim || null, dir: man.saveDir || 'Assets' };
  document.body.classList.add('unity');
  if (!man.motion) return;
  try {
    const r = await fetch(man.motion);
    if (!r.ok) return;
    const name = man.anim.replace(/^.*\//, '').replace(/\.anim$/i, '');
    applyMotionJson(await r.json(), name + '.motion.json', null);
    S.unity.path = man.anim;
    setStatus($('status').textContent.replace(name + '.motion.json', name + '.anim'), $('status').classList.contains('err'));
  } catch (e) {
    setStatus('.animを開けません: ' + e.message, true);
  }
}

async function loadDefaultModel() {
  const say = text => { $('empty').firstElementChild.textContent = text; setStatus(text, true); };
  if (!/^https?:$/.test(location.protocol)) { say('公開ページか、Unity の Tools/SisMotionTooL から開いてください'); return; }
  const unity = new URLSearchParams(location.search).has('unity') ? await filesFromUnity() : null;
  S.avatarId = unity?.man.avatar || null;
  const files = unity ? unity.files : await filesFromUrls(DEFAULT_MODEL.map(f => f.split('/').map(encodeURIComponent).join('/')));
  if (!files.some(f => /\.fbx$/i.test(f.name))) { say('モデルを読み込めませんでした'); return; }
  await loadModelFiles(files, unity ? unity.texByMat : null, unity ? unity.body : null);
  // 相手役の「同じアバター」は、同じファイルからもう1体作る
  if (M) {
    S.modelSrc = { files, texByMat: unity ? unity.texByMat : null, body: unity ? unity.body : null, parts: unity?.parts || null, avatarId: S.avatarId };
    S.src = { ...S.modelSrc, kind: 'same' };
    S.home = { name: M.name, avatarId: S.avatarId };
  }
  if (unity?.parts) await loadParts(unity.parts);
  if (unity) await openFromUnity(unity.man);
  // Unity を通さないページは、茜犬の見本（モデルの数値が入っているので、ブラウザだけで .anim を書ける）
  else if (M?.muscleInfo) { S.sample = true; }
  S.dirty = false;
  updateTitle();
  // Unity から .anim を開いたときはそれ。そうでなければ、前回の続きが残っていれば戻す
  if (!unity?.man.anim) autoRestore();
  else autoReady = true;
}
loadDefaultModel();

// 確認用（コンソールから触る）
window.MT = {
  THREE, S, get D() { return D; }, get M() { return M; }, get pair() { return P; }, get contact() { return contact; }, pairBoneWorld, pairEyeWorld, pairKeyTicks, switchActor, bakeContact, goFrame, keyBones, buildFile, applyMotionJson, fitRest, solveLimb, syncLimbs,
  mirrorPose, copyPose, pastePose, select, undo, redo, pick, boneAtHit, newDoc, keyAll, projectData, applyProject, allKeyFrames, constrainBone, camera, gizmo,
  applyUnityView, restoreUnityView, analyzeLimb, orbit, get settings() { return CFG; },
  TL, drawTimeline, copyKeys, pasteKeys, deleteKeys, moveKeys, fx, rowY, buildAnim, buildAnimModel, animFrame,
  /** ワールドの位置 → 画面（クライアント座標）。 */
  toScreen(v) {
    const r = renderer.domElement.getBoundingClientRect();
    const s = screenOf(v, r);
    return { x: Math.round(r.left + s.x), y: Math.round(r.top + s.y) };
  },
};
